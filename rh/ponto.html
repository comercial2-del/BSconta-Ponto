<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jornada / Ponto — BSconta+ RH</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
  <style>
    /* Ajuste visual exclusivo da tela Jornada / Ponto.
       Mantém o restante do sistema intacto e usa o mesmo padrão compacto
       do histórico por semana da referência. */
    .ponto-history-card{padding:14px 16px}
    .ponto-employee-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .ponto-employee-main{display:flex;align-items:center;gap:10px;min-width:260px}
    .ponto-employee-main select{min-width:250px;height:38px;border-radius:10px}
    .ponto-period-card{padding:14px 16px}
    .ponto-period-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ponto-period-controls{display:flex;align-items:center;gap:8px}
    .ponto-period-nav{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
    .ponto-period-nav button{width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:var(--text-soft);cursor:pointer;display:grid;place-items:center}
    .ponto-period-nav button:hover{background:var(--surface-2);color:var(--text)}
    .ponto-period-label{min-width:175px;text-align:center;font-size:.86rem;font-weight:750;color:var(--text)}
    .ponto-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
    .ponto-day-card{min-height:108px;border:1px dashed var(--border);border-radius:12px;background:var(--surface);padding:10px 11px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;display:flex;flex-direction:column;justify-content:space-between}
    .ponto-day-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .ponto-day-card.is-today{border:2px solid var(--indigo-500);padding:9px 10px}
    .ponto-day-card.is-weekend{background:var(--surface-2);color:var(--text-faint)}
    .ponto-day-card.status-completo{background:var(--emerald-50);border-color:rgba(16,185,129,.18)}
    .ponto-day-card.status-atraso{background:var(--amber-50);border-color:rgba(245,158,11,.22)}
    .ponto-day-card.status-falta{background:var(--red-50);border-color:rgba(239,68,68,.20)}
    .ponto-day-card.status-extra{background:var(--violet-50);border-color:rgba(139,92,246,.20)}
    .ponto-day-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .ponto-dow{font-size:.67rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint)}
    .ponto-date{font-size:1.15rem;line-height:1;font-weight:800;color:var(--text)}
    .ponto-day-card.status-completo .ponto-date{color:var(--emerald-700)}
    .ponto-day-card.status-atraso .ponto-date{color:var(--amber-700)}
    .ponto-day-card.status-falta .ponto-date{color:var(--red-700)}
    .ponto-day-card.status-extra .ponto-date{color:var(--violet-700)}
    .ponto-today-badge{font-size:.62rem;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--indigo-500);color:#fff}
    .ponto-day-middle{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
    .ponto-day-status{font-size:.72rem;font-weight:700;color:var(--text-soft)}
    .ponto-day-hours{font-size:.73rem;font-weight:750;color:var(--text)}
    .ponto-day-footer{display:flex;align-items:center;gap:7px;font-size:.68rem;font-weight:650;color:var(--text-soft)}
    .ponto-status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:none}
    .ponto-status-dot.complete{background:var(--emerald-500)}
    .ponto-status-dot.delay{background:var(--amber-500)}
    .ponto-status-dot.absent{background:var(--red-500)}
    .ponto-status-dot.extra{background:var(--violet-500)}
    .ponto-status-dot.rh{background:var(--indigo-500)}
    .ponto-month-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
    .ponto-month-head span{font-size:.67rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);padding:0 10px}
    .ponto-custom-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
    .ponto-single-wrap{margin-top:14px}
    .ponto-single-wrap .ponto-day-card{min-height:118px;max-width:none}
    .ponto-single-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text-soft);font-size:.76rem;font-weight:650}
    .ponto-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
    .ponto-legend .item{display:flex;align-items:center;gap:6px;font-size:.73rem;font-weight:650;color:var(--text-soft)}
    .ponto-legend .dot{width:8px;height:8px;border-radius:50%}
    @media (max-width: 1000px){
      .ponto-days,.ponto-month-head,.ponto-custom-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
    @media (max-width: 720px){
      .ponto-days,.ponto-month-head,.ponto-custom-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .ponto-employee-main{width:100%}.ponto-employee-main select{flex:1;min-width:0}
      .ponto-period-label{min-width:120px}
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/rh-supabase-auth.js"></script>
  <script src="../js/rh-ponto-data.js"></script>
  <script>
(async function () {
    const session = await requireRoleReal("RH");
    if (!session) return;
    const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    let abaAtiva = "hoje";
    let filtro = "TODOS";

    // Lista real dos colaboradores (rh.colaboradores) — antes esta tela usava
    // uma lista de exemplo fixa, depois um cadastro só local no navegador;
    // agora vem do banco. cacheHoje/cacheAjustes/cacheHistorico guardam o
    // resultado da ÚLTIMA consulta real, para as funções de render (todas
    // síncronas) não precisarem virar async — quem muda de aba/filtro/pessoa
    // chama o refresh (assíncrono) e SÓ DEPOIS chama render().
    let COLABORADORES_ATIVOS = [];
    let cacheHoje = [];
    let cacheAjustes = [];
    let cacheHistorico = {};

    async function carregarColaboradoresAtivos() {
      const { data, error } = await sb.from("colaboradores").select(`id, nome, ${RH_COLABORADOR_JORNADA_COLS}`).neq("status", "INATIVO").order("nome");
      if (error) throw error;
      COLABORADORES_ATIVOS = data || [];
    }
    function idPorNome(nome) {
      const c = COLABORADORES_ATIVOS.find((e) => e.nome === nome);
      return c ? c.id : null;
    }
    // Classificação real por pessoa (jornada configurada em
    // rh/colaboradores.html) — substitui o "h*60+m-8*60>5" fixo que assumia
    // 08:00 pra todo mundo. Ver rhClassificarStatusHoje em rh-ponto-data.js.
    function statusHoje(emp, hoje, dataIso) {
      const config = rhConfigJornada(emp);
      return rhClassificarStatusHoje({ entradaReal: hoje?.entrada || null, config, dataIso });
    }
    async function refrescarHoje() {
      const hojeIso = todayIso();
      const [{ data: linhasHojeRows, error: e1 }, { data: linhasResto, error: e2 }] = await Promise.all([
        sb.from("ponto_registros").select("*").eq("data", hojeIso),
        sb.from("ponto_registros").select("colaborador_id, atraso_min, horas_extras").neq("data", hojeIso),
      ]);
      if (e1) throw e1;
      if (e2) throw e2;
      const porId = {};
      (linhasHojeRows || []).forEach((r) => { porId[r.colaborador_id] = r; });
      const saldos = {};
      (linhasResto || []).forEach((r) => { saldos[r.colaborador_id] = (saldos[r.colaborador_id] || 0) + (Number(r.horas_extras) || 0) - (Number(r.atraso_min) || 0) / 60; });
      cacheHoje = COLABORADORES_ATIVOS.map((emp) => {
        const row = porId[emp.id];
        const hoje = row ? rhMapPontoRow(row) : { entrada: null, local: null };
        return { nome: emp.nome, status: statusHoje(emp, hoje, hojeIso), entrada: hoje.entrada, local: hoje.local, saldoBanco: saldos[emp.id] || 0 };
      });
    }
    function linhasHoje() {
      return cacheHoje;
    }

    // Estado da aba "Histórico"
    let colaboradorSelecionado = "";
    let periodoTipo = "mes";
    let mesRef = { ano: 2026, mes: 8 }; // Setembro (0-indexed)
    let diaSelecionado = todayIso();
    let rangeInicio = null, rangeFim = null;

    function todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function isoOf(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
    function fmtHoras(h) {
      if (h === null || h === undefined) return "—";
      const sinal = h < 0 ? "-" : "";
      const abs = Math.abs(h);
      const hh = Math.floor(abs);
      const mm = Math.round((abs - hh) * 60);
      return `${sinal}${hh}h${mm.toString().padStart(2, "0")}`;
    }
    async function refrescarHistorico(nome) {
      const id = idPorNome(nome);
      if (!id) { cacheHistorico[nome] = []; return; }
      const { data, error } = await sb.from("ponto_registros").select("*").eq("colaborador_id", id).order("data");
      if (error) throw error;
      cacheHistorico[nome] = (data || []).map(rhMapPontoRow);
    }
    function historicoDoColaborador(nome) {
      return cacheHistorico[nome] || [];
    }
    function statusPill(status) {
      const map = { completo: ["on", "Em dia"], atraso: ["away", "Atraso"], falta: ["off", "Falta"], afastado: ["off", "Afastado"], sem_expediente: ["badge-neutral", "Sem expediente hoje"] };
      const [cls, label] = map[status] || ["off", status];
      return `<span class="status-pill ${cls}"><span class="dot"></span>${label}</span>`;
    }
    function statusPillPonto(status) {
      const map = { completo: ["status-DONE", "Completo"], atraso: ["status-ATRASO", "Atraso"], falta: ["status-CANCELED", "Falta"], hoje: ["status-EM_ANALISE", "Em andamento"] };
      const [cls, label] = map[status] || ["badge-neutral", status];
      return `<span class="status-badge ${cls}">${label}</span>`;
    }

    // ------------------------------------------------------------------
    function render() {
      document.getElementById("content").innerHTML = `
        <div class="space-y">
          <div class="row-between">
            <div>
              <h1 class="page-title">Jornada / Ponto</h1>
              <p class="page-sub">Acompanhe a jornada da equipe hoje e consulte o histórico detalhado de cada colaborador.</p>
            </div>
          </div>

          <div class="card card-p" style="padding:0.4rem">
            <div class="tabs" style="border-bottom:none">
              <button type="button" class="tab-btn ${abaAtiva === "hoje" ? "active" : ""}" data-aba="hoje">${ICONS.users}<span style="margin-left:0.4rem">Hoje</span></button>
              <button type="button" class="tab-btn ${abaAtiva === "ajustes" ? "active" : ""}" data-aba="ajustes">${ICONS.alertCircle}<span style="margin-left:0.4rem">Ajustes pendentes</span>${ajustesPendentes().length ? `<span class="badge badge-red" style="margin-left:0.4rem">${ajustesPendentes().length}</span>` : ""}</button>
              <button type="button" class="tab-btn ${abaAtiva === "historico" ? "active" : ""}" data-aba="historico">${ICONS.calendar}<span style="margin-left:0.4rem">Histórico por colaborador</span></button>
            </div>
          </div>

          <div id="aba-conteudo"></div>
        </div>
      `;

      document.querySelectorAll("[data-aba]").forEach((btn) =>
        btn.addEventListener("click", () => irParaAba(btn.dataset.aba))
      );

      if (abaAtiva === "hoje") renderHoje();
      else if (abaAtiva === "ajustes") renderAjustesTab();
      else renderHistorico();
    }

    /** Troca de aba SEMPRE busca dados atuais do banco antes de pintar —
     * evita mostrar uma lista de ajustes/hoje desatualizada. */
    async function irParaAba(aba) {
      try {
        if (aba === "hoje") await refrescarHoje();
        else if (aba === "ajustes") await refrescarAjustes();
        else if (aba === "historico" && colaboradorSelecionado) await refrescarHistorico(colaboradorSelecionado);
      } catch (erro) {
        showToast("Erro ao carregar dados: " + (erro?.message || erro), "error");
        return;
      }
      abaAtiva = aba;
      render();
    }

    // ------------------------------------------------------------------
    // Aba "Hoje" — visão da equipe
    // ------------------------------------------------------------------
    function renderHoje() {
      const rows = linhasHoje();
      const emDia = rows.filter((r) => r.status === "completo").length;
      const atrasos = rows.filter((r) => r.status === "atraso").length;
      const faltas = rows.filter((r) => r.status === "falta").length;
      const homeOffice = rows.filter((r) => r.local === "HOME_OFFICE").length;
      const presencial = rows.filter((r) => r.local === "PRESENCIAL").length;
      const saldoNegativo = rows.filter((r) => r.saldoBanco < 0).length;

      document.getElementById("aba-conteudo").innerHTML = `
        <div class="space-y">
          <div id="kpi-grid"></div>

          <div class="card card-p">
            <div class="row-between" style="margin-bottom:1rem;flex-wrap:wrap;gap:0.7rem">
              <div class="period-buttons">
                <button type="button" data-f="TODOS" class="${filtro === "TODOS" ? "active" : ""}">Todos</button>
                <button type="button" data-f="ATRASO" class="${filtro === "ATRASO" ? "active" : ""}">Atrasos</button>
                <button type="button" data-f="FALTA" class="${filtro === "FALTA" ? "active" : ""}">Faltas</button>
                <button type="button" data-f="HOME_OFFICE" class="${filtro === "HOME_OFFICE" ? "active" : ""}">Home office</button>
                <button type="button" data-f="PRESENCIAL" class="${filtro === "PRESENCIAL" ? "active" : ""}">Presencial</button>
                <button type="button" data-f="NEGATIVO" class="${filtro === "NEGATIVO" ? "active" : ""}">Banco negativo</button>
              </div>
            </div>
            <div id="table-wrap"></div>
          </div>
        </div>
      `;

      renderKpiGrid(document.getElementById("kpi-grid"), [
        { label: "Em dia hoje", value: emDia, tone: "green", icon: ICONS.checkCircle },
        { label: "Atrasos hoje", value: atrasos, tone: "amber", icon: ICONS.alertCircle },
        { label: "Faltas hoje", value: faltas, tone: "red", icon: ICONS.xCircle },
        { label: "Home office hoje", value: homeOffice, tone: "indigo", icon: ICONS.home },
        { label: "Presencial hoje", value: presencial, tone: "teal", icon: ICONS.mapPin },
        { label: "Banco de horas negativo", value: saldoNegativo, tone: "violet", icon: ICONS.clock },
      ], true);

      document.querySelectorAll("[data-f]").forEach((btn) =>
        btn.addEventListener("click", () => {
          filtro = btn.dataset.f;
          document.querySelectorAll("[data-f]").forEach((b) => b.classList.toggle("active", b.dataset.f === filtro));
          renderTable();
        })
      );
      renderTable();
    }

    // ------------------------------------------------------------------
    // Ajustes de ponto pendentes — solicitações de "Ajustar ponto" feitas
    // pelo colaborador (correção de horário ou lançamento atrasado) que
    // ainda não foram aprovadas nem recusadas. Aprovar aqui já aplica a
    // correção no histórico de ponto (o dia sai de "pendente" e passa a
    // exibir "Alterado pelo RH"); recusar libera o dia sem alterar nada.
    // ------------------------------------------------------------------
    const MODO_AJUSTE_LABEL = { dia: "Dia inteiro", pontos: "Pontos específicos" };

    // Aceita o formato atual (`ajuste_ponto.itens`, um ou mais registros por
    // solicitação) e o formato antigo, singular (`{campo, campoLabel,
    // horario}` direto no objeto) — solicitações pendentes criadas antes da
    // tela de ajuste passar a suportar múltiplos registros continuam
    // aparecendo certas aqui. Mesma lógica de rhItensAjustePonto em
    // js/rh-ponto-data.js.
    function itensAjustePonto(ajuste) {
      if (!ajuste) return [];
      if (Array.isArray(ajuste.itens) && ajuste.itens.length) return ajuste.itens;
      if (ajuste.campo) return [{ campo: ajuste.campo, campoLabel: ajuste.campoLabel, horario: ajuste.horario }];
      return [];
    }

    async function refrescarAjustes() {
      const { data, error } = await sb
        .from("solicitacoes")
        .select("id, protocolo, ajuste_ponto, colaboradores(nome)")
        .eq("categoria", "Ajuste de ponto")
        .eq("status", "PENDENTE")
        .order("created_at");
      if (error) throw error;
      cacheAjustes = (data || []).map((row) => ({
        id: row.id,
        protocolo: row.protocolo,
        colaborador: row.colaboradores?.nome || "—",
        modo: row.ajuste_ponto?.modo || "pontos",
        data: row.ajuste_ponto?.data,
        itens: itensAjustePonto(row.ajuste_ponto),
        justificativa: row.ajuste_ponto?.justificativa || "",
      }));
    }
    function ajustesPendentes() {
      return cacheAjustes;
    }

    function renderAjustesTab() {
      document.getElementById("aba-conteudo").innerHTML = `
        <div class="space-y">
          <div class="card card-p">
            <div class="row-between" style="margin-bottom:1rem">
              <div>
                <h2 style="margin:0">Ajustes de ponto pendentes</h2>
                <p class="page-sub" style="margin:0.25rem 0 0">Correções de horário e lançamentos atrasados solicitados pelos colaboradores, aguardando sua aprovação.</p>
              </div>
            </div>
            <div id="ajustes-pendentes-wrap"></div>
          </div>
        </div>
      `;
      renderAjustesPendentes();
    }

    function renderAjustesPendentes() {
      const rows = ajustesPendentes();
      document.getElementById("ajustes-pendentes-wrap").innerHTML = rows.length
        ? `
        <div class="table-scroll">
          <table>
            <thead><tr><th>Colaborador</th><th>Tipo</th><th>Data</th><th>Registros solicitados</th><th>Motivo</th><th></th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (s) => `<tr>
                <td><div class="person-cell"><span class="avatar avatar-sm ${avatarColorClass(s.colaborador)}">${initials(s.colaborador)}</span>${esc(s.colaborador)}</div></td>
                <td><span class="ajuste-modo-badge ${s.modo}">${MODO_AJUSTE_LABEL[s.modo] || s.modo}</span></td>
                <td>${fmtDate(s.data)}</td>
                <td><div class="ajuste-itens-list">${s.itens.map((it) => `<span class="ajuste-item-chip">${esc(it.campoLabel)} → <strong>${esc(it.horario)}</strong></span>`).join("")}</div></td>
                <td style="max-width:260px">${esc(s.justificativa || "—")}</td>
                <td style="text-align:right">
                  <div class="approve-reject">
                    <button type="button" class="approve" data-aprovar-ajuste="${esc(s.id)}" aria-label="Aprovar">${ICONS.check}</button>
                    <button type="button" class="reject" data-recusar-ajuste="${esc(s.id)}" aria-label="Recusar">${ICONS.x}</button>
                  </div>
                </td>
              </tr>`
                )
                .join("")}
            </tbody>
          </table>
        </div>`
        : emptyStateHtml({ icon: ICONS.checkCircle, title: "Nenhum ajuste pendente", desc: "Quando um colaborador solicitar correção ou lançamento atrasado de ponto, o pedido aparece aqui." });

      document.querySelectorAll("[data-aprovar-ajuste]").forEach((b) =>
        b.addEventListener("click", () => resolverAjustePonto(b.dataset.aprovarAjuste, true, b))
      );
      document.querySelectorAll("[data-recusar-ajuste]").forEach((b) =>
        b.addEventListener("click", () => resolverAjustePonto(b.dataset.recusarAjuste, false, b))
      );
    }

    async function resolverAjustePonto(solicitacaoId, aprovado, botao) {
      const item = ajustesPendentes().find((a) => a.id === solicitacaoId);
      if (botao) botao.closest(".approve-reject")?.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        // Grava de verdade: se aprovado, corrige rh.ponto_registros
        // (recalculando status/horas/atraso) e sempre atualiza o status da
        // solicitação em rh.solicitacoes — nada disso fica só em memória.
        await rhResolverAjustePonto(solicitacaoId, aprovado, `${session.name} (RH)`);
        await refrescarAjustes();
        showToast(item ? (aprovado ? `Ajuste de ${item.colaborador} aprovado.` : `Ajuste de ${item.colaborador} recusado.`) : "Ajuste resolvido.", aprovado ? "success" : "error");
        render();
      } catch (erro) {
        showToast("Não foi possível resolver o ajuste: " + (erro?.message || erro), "error");
        if (botao) botao.closest(".approve-reject")?.querySelectorAll("button").forEach((b) => (b.disabled = false));
      }
    }

    function renderTable() {
      const rows = linhasHoje().filter((r) => {
        if (filtro === "ATRASO") return r.status === "atraso";
        if (filtro === "FALTA") return r.status === "falta";
        if (filtro === "HOME_OFFICE") return r.local === "HOME_OFFICE";
        if (filtro === "PRESENCIAL") return r.local === "PRESENCIAL";
        if (filtro === "NEGATIVO") return r.saldoBanco < 0;
        return true;
      });

      document.getElementById("table-wrap").innerHTML = rows.length
        ? `
        <div class="table-scroll">
          <table>
            <thead><tr><th>Colaborador</th><th>Status hoje</th><th>Entrada</th><th>Local</th><th class="cell-num">Banco de horas</th><th></th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (r) => `<tr>
                <td><div class="person-cell"><span class="avatar avatar-sm ${avatarColorClass(r.nome)}">${initials(r.nome)}</span>${esc(r.nome)}</div></td>
                <td>${statusPill(r.status)}</td>
                <td>${r.entrada || "—"}</td>
                <td>${r.local ? localBadgeHtml(r.local) : '<span class="muted">—</span>'}</td>
                <td class="cell-num ${r.saldoBanco < 0 ? "" : "cell-green"}" style="color:${r.saldoBanco < 0 ? "var(--red-600)" : ""}">${r.saldoBanco >= 0 ? "+" : ""}${r.saldoBanco.toFixed(1).replace(".", ",")}h</td>
                <td style="text-align:right"><button type="button" class="btn-ghost" style="width:auto;padding:0.4rem 0.7rem" data-detalhe="${esc(r.nome)}">Ver histórico</button></td>
              </tr>`
                )
                .join("")}
            </tbody>
          </table>
        </div>`
        : emptyStateHtml({ icon: ICONS.clock, title: "Ninguém neste filtro", desc: "Tente outro filtro." });

      document.querySelectorAll("[data-detalhe]").forEach((b) =>
        b.addEventListener("click", async () => {
          colaboradorSelecionado = b.dataset.detalhe;
          periodoTipo = "mes";
          try { await refrescarHistorico(colaboradorSelecionado); } catch (erro) { showToast("Erro ao carregar histórico: " + (erro?.message || erro), "error"); return; }
          abaAtiva = "historico";
          render();
        })
      );
    }

    // ------------------------------------------------------------------
    // Aba "Histórico por colaborador"
    // ------------------------------------------------------------------
    function renderHistorico() {
      const nomes = COLABORADORES_ATIVOS.map((e) => e.nome).sort((a, b) => a.localeCompare(b, "pt-BR"));
      const registros = historicoDoColaborador(colaboradorSelecionado);

      document.getElementById("aba-conteudo").innerHTML = `
        <div class="space-y">
          <div class="card ponto-history-card">
            <div class="ponto-employee-bar">
              <div class="ponto-employee-main">
                <span class="avatar avatar-sm ${avatarColorClass(colaboradorSelecionado)}">${initials(colaboradorSelecionado)}</span>
                <div>
                  <p class="info-label" style="margin:0 0 .25rem">Colaborador</p>
                  <select id="colaborador-select">
                    ${nomes.map((n) => `<option value="${esc(n)}" ${n === colaboradorSelecionado ? "selected" : ""}>${esc(n)}</option>`).join("")}
                  </select>
                </div>
              </div>
              ${!registros.length ? `<span class="hint">Nenhum registro de ponto ainda para este colaborador.</span>` : ""}
            </div>
          </div>

          ${
            registros.length
              ? `
          <div class="card ponto-period-card">
            <div class="ponto-period-toolbar">
              <div class="period-buttons segmented-strong">
                <button type="button" data-periodo="dia" class="${periodoTipo === "dia" ? "active" : ""}">Dia</button>
                <button type="button" data-periodo="semana" class="${periodoTipo === "semana" ? "active" : ""}">Semana</button>
                <button type="button" data-periodo="mes" class="${periodoTipo === "mes" ? "active" : ""}">Mês</button>
                <button type="button" data-periodo="personalizado" class="${periodoTipo === "personalizado" ? "active" : ""}">Personalizado</button>
              </div>
              <div id="periodo-controles" class="ponto-period-controls"></div>
            </div>
            <div id="calendario-wrap"></div>
            <div class="ponto-legend">
              <span class="item"><span class="dot" style="background:var(--emerald-500)"></span>Trabalhado</span>
              <span class="item"><span class="dot" style="background:var(--indigo-500)"></span>Home office</span>
              <span class="item"><span class="dot" style="background:var(--amber-500)"></span>Atraso</span>
              <span class="item"><span class="dot" style="background:var(--red-500)"></span>Falta</span>
              <span class="item"><span class="dot" style="background:var(--indigo-500)"></span>Alterado pelo RH</span>
            </div>
          </div>

          <div class="card card-p table-scroll">
            <h2>Registros detalhados — ${esc(colaboradorSelecionado)}</h2>
            <div id="tabela-historico"></div>
          </div>`
              : emptyStateHtml({ icon: ICONS.calendar, title: "Ainda sem registros de ponto", desc: "Assim que este colaborador bater o primeiro ponto, o histórico aparece aqui." })
          }
        </div>
      `;

      document.getElementById("colaborador-select").addEventListener("change", async (e) => {
        colaboradorSelecionado = e.target.value;
        periodoTipo = "mes";
        try { await refrescarHistorico(colaboradorSelecionado); } catch (erro) { showToast("Erro ao carregar histórico: " + (erro?.message || erro), "error"); }
        renderHistorico();
      });

      document.querySelectorAll("[data-periodo]").forEach((btn) =>
        btn.addEventListener("click", () => {
          periodoTipo = btn.dataset.periodo;
          if (periodoTipo === "dia") diaSelecionado = todayIso();
          renderHistorico();
        })
      );

      if (registros.length) {
        renderControlesPeriodo();
        renderCalendario();
        renderTabelaHistorico();
      }
    }

    function renderControlesPeriodo() {
      const el = document.getElementById("periodo-controles");
      if (!el) return;

      const addDays = (iso, delta) => {
        const d = new Date(`${iso}T00:00:00`);
        d.setDate(d.getDate() + delta);
        return isoOf(d);
      };
      const startOfWeek = (iso) => {
        const d = new Date(`${iso}T00:00:00`);
        const dow = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - dow);
        return isoOf(d);
      };
      const endOfWeek = (iso) => addDays(startOfWeek(iso), 6);
      const labelDate = (iso) => {
        const d = new Date(`${iso}T00:00:00`);
        return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
      };

      if (periodoTipo === "mes") {
        el.innerHTML = `
          <div class="ponto-period-nav">
            <button type="button" id="mes-prev" aria-label="Mês anterior">${ICONS.chevronLeft}</button>
            <span class="ponto-period-label">${MESES[mesRef.mes]}/${mesRef.ano}</span>
            <button type="button" id="mes-next" aria-label="Próximo mês">${ICONS.chevronRight}</button>
          </div>`;
        document.getElementById("mes-prev").addEventListener("click", () => mudarMes(-1));
        document.getElementById("mes-next").addEventListener("click", () => mudarMes(1));
      } else if (periodoTipo === "dia") {
        el.innerHTML = `
          <div class="ponto-period-nav">
            <button type="button" id="dia-prev" aria-label="Dia anterior">${ICONS.chevronLeft}</button>
            <span class="ponto-period-label">${labelDate(diaSelecionado)}</span>
            <button type="button" id="dia-next" aria-label="Próximo dia">${ICONS.chevronRight}</button>
          </div>`;
        document.getElementById("dia-prev").addEventListener("click", () => { diaSelecionado = addDays(diaSelecionado, -1); renderHistorico(); });
        document.getElementById("dia-next").addEventListener("click", () => { diaSelecionado = addDays(diaSelecionado, 1); renderHistorico(); });
      } else if (periodoTipo === "semana") {
        const inicio = startOfWeek(diaSelecionado);
        const fim = endOfWeek(diaSelecionado);
        const d = new Date(`${inicio}T00:00:00`);
        const f = new Date(`${fim}T00:00:00`);
        const li = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
        const lf = f.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
        el.innerHTML = `
          <div class="ponto-period-nav">
            <button type="button" id="sem-prev" aria-label="Semana anterior">${ICONS.chevronLeft}</button>
            <span class="ponto-period-label">${li} – ${lf}</span>
            <button type="button" id="sem-next" aria-label="Próxima semana">${ICONS.chevronRight}</button>
          </div>`;
        document.getElementById("sem-prev").addEventListener("click", () => { diaSelecionado = addDays(diaSelecionado, -7); renderHistorico(); });
        document.getElementById("sem-next").addEventListener("click", () => { diaSelecionado = addDays(diaSelecionado, 7); renderHistorico(); });
      } else if (periodoTipo === "personalizado") {
        if (!rangeInicio) rangeInicio = "2026-09-01";
        if (!rangeFim) rangeFim = todayIso();
        el.innerHTML = `
          <div class="date-range-row">
            <input type="date" id="range-inicio" value="${rangeInicio}" />
            <span class="hint">até</span>
            <input type="date" id="range-fim" value="${rangeFim}" />
          </div>`;
        document.getElementById("range-inicio").addEventListener("change", (e) => { rangeInicio = e.target.value; renderCalendario(); renderTabelaHistorico(); });
        document.getElementById("range-fim").addEventListener("change", (e) => { rangeFim = e.target.value; renderCalendario(); renderTabelaHistorico(); });
      }
    }

    function mudarMes(delta) {
      mesRef.mes += delta;
      if (mesRef.mes < 0) { mesRef.mes = 11; mesRef.ano--; }
      if (mesRef.mes > 11) { mesRef.mes = 0; mesRef.ano++; }
      renderControlesPeriodo();
      renderCalendario();
      renderTabelaHistorico();
    }

    function diaClasse(rec, isToday) {
      let base = "futuro";
      if (rec) {
        if (rec.status === "falta") base = "falta";
        else if (rec.status === "atraso") base = "atraso";
        else if (rec.horasExtras > 0) base = "extra";
        else if (rec.status === "completo" || rec.status === "hoje") base = "completo";
      }
      return `${base}${isToday ? " hoje" : ""}${rec?.alteradoPeloRH ? " corrigido" : ""}`;
    }

    function porData(iso) {
      return historicoDoColaborador(colaboradorSelecionado).find((h) => h.data === iso);
    }

    function renderCalendario() {
      const wrap = document.getElementById("calendario-wrap");
      if (!wrap) return;

      const all = historicoDoColaborador(colaboradorSelecionado);
      const hoje = todayIso();
      const statusInfo = (rec) => {
        if (!rec) return { cls: "", label: "Previsto", dot: "", hours: "" };
        if (rec.status === "falta") return { cls: "status-falta", label: "Falta", dot: "absent", hours: "" };
        if (rec.status === "atraso") return { cls: "status-atraso", label: "Atraso", dot: "delay", hours: rec.atrasoMin ? `${rec.atrasoMin} min` : "" };
        if (rec.horasExtras > 0) return { cls: "status-extra", label: "Hora extra", dot: "extra", hours: `+${fmtHoras(rec.horasExtras)}` };
        if (rec.status === "hoje") return { cls: "status-completo", label: "Em andamento", dot: "complete", hours: rec.entrada ? `${rec.entrada} • em andamento` : "" };
        return { cls: "status-completo", label: "Trabalhado", dot: "complete", hours: rec.horasTrabalhadas != null ? fmtHoras(rec.horasTrabalhadas) : "" };
      };

      const dayNames = ["SEG","TER","QUA","QUI","SEX","SÁB","DOM"];
      const isoDate = (d) => isoOf(d);
      const dayCard = (iso, compact = false) => {
        const d = new Date(`${iso}T00:00:00`);
        const rec = all.find((h) => h.data === iso);
        const isToday = iso === hoje;
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const info = statusInfo(rec);
        const dow = dayNames[(d.getDay() + 6) % 7];
        const date = String(d.getDate()).padStart(2, "0");
        const home = rec?.local === "HOME_OFFICE";
        const rh = !!rec?.alteradoPeloRH;
        return `
          <div class="ponto-day-card ${info.cls} ${isToday ? "is-today" : ""} ${isWeekend ? "is-weekend" : ""}" data-dia="${iso}">
            <div class="ponto-day-top">
              <div>
                <div class="ponto-dow">${dow}</div>
                <div class="ponto-date">${date}</div>
              </div>
              ${isToday ? `<span class="ponto-today-badge">HOJE</span>` : ""}
            </div>
            <div class="ponto-day-middle">
              <span class="ponto-day-status">${!rec && isWeekend ? "Fim de semana" : info.label}</span>
              <span class="ponto-day-hours">${info.hours || ""}</span>
            </div>
            <div class="ponto-day-footer">
              <span class="ponto-status-dot ${home ? "complete" : (info.dot || "")}"></span>
              <span>${home ? "Home office" : (rh ? "Alterado pelo RH" : (rec ? "Registro" : "Sem registro"))}</span>
            </div>
          </div>`;
      };

      const bindCards = () => {
        wrap.querySelectorAll("[data-dia]").forEach((cell) => {
          cell.addEventListener("click", () => {
            diaSelecionado = cell.dataset.dia;
            if (periodoTipo !== "dia") periodoTipo = "dia";
            renderHistorico();
          });
        });
      };

      if (periodoTipo === "dia") {
        wrap.innerHTML = `
          <div class="ponto-single-wrap">
            ${dayCard(diaSelecionado)}
          </div>`;
        bindCards();
        return;
      }

      if (periodoTipo === "semana") {
        const base = new Date(`${diaSelecionado}T00:00:00`);
        const dow = (base.getDay() + 6) % 7;
        const inicio = new Date(base);
        inicio.setDate(base.getDate() - dow);
        const days = Array.from({ length: 7 }, (_, i) => {
          const d = new Date(inicio);
          d.setDate(inicio.getDate() + i);
          return isoDate(d);
        });
        wrap.innerHTML = `<div class="ponto-days">${days.map((iso) => dayCard(iso)).join("")}</div>`;
        bindCards();
        return;
      }

      if (periodoTipo === "personalizado") {
        const start = new Date(`${rangeInicio}T00:00:00`);
        const end = new Date(`${rangeFim}T00:00:00`);
        const days = [];
        if (!Number.isNaN(start.getTime()) && !Number.isNaN(end.getTime()) && start <= end) {
          const cursor = new Date(start);
          while (cursor <= end && days.length < 62) {
            days.push(isoDate(cursor));
            cursor.setDate(cursor.getDate() + 1);
          }
        }
        wrap.innerHTML = days.length
          ? `<div class="ponto-custom-grid">${days.map((iso) => dayCard(iso)).join("")}</div>`
          : emptyStateHtml({ icon: ICONS.calendar, title: "Intervalo inválido", desc: "Escolha uma data inicial anterior à data final." });
        bindCards();
        return;
      }

      // Mês: grade compacta de 7 colunas, sem o efeito de "blocos gigantes".
      const ano = mesRef.ano, mes = mesRef.mes;
      const daysInMonth = new Date(ano, mes + 1, 0).getDate();
      const firstDow = (new Date(ano, mes, 1).getDay() + 6) % 7;
      const blanks = Array.from({ length: firstDow }, () => `<div></div>`).join("");
      const cells = Array.from({ length: daysInMonth }, (_, i) => {
        const iso = `${ano}-${String(mes + 1).padStart(2, "0")}-${String(i + 1).padStart(2, "0")}`;
        return dayCard(iso, true);
      }).join("");
      wrap.innerHTML = `
        <div class="ponto-month-head">${dayNames.map((d) => `<span>${d}</span>`).join("")}</div>
        <div class="ponto-custom-grid">${blanks}${cells}</div>`;
      bindCards();
    }

    function registrosDoPeriodo() {
      const all = historicoDoColaborador(colaboradorSelecionado).filter((h) => h.status !== "futuro");
      if (periodoTipo === "dia") return all.filter((h) => h.data === diaSelecionado);
      if (periodoTipo === "semana") {
        const d = new Date(diaSelecionado + "T00:00:00");
        const dow = (d.getDay() + 6) % 7;
        const inicio = new Date(d); inicio.setDate(d.getDate() - dow);
        const fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);
        return all.filter((h) => h.data >= isoOf(inicio) && h.data <= isoOf(fim));
      }
      if (periodoTipo === "personalizado") return all.filter((h) => h.data >= rangeInicio && h.data <= rangeFim);
      // mês
      const prefixo = `${mesRef.ano}-${String(mesRef.mes + 1).padStart(2, "0")}`;
      return all.filter((h) => h.data.startsWith(prefixo));
    }

    function renderTabelaHistorico() {
      const rows = registrosDoPeriodo().slice().reverse();
      document.getElementById("tabela-historico").innerHTML = rows.length
        ? `
        <table>
          <thead><tr><th>Data</th><th>Entrada</th><th>Saída</th><th>Intervalo</th><th class="cell-num">Horas</th><th class="cell-num">Extras</th><th class="cell-num">Atraso</th><th>Local</th><th>Status</th><th>RH</th></tr></thead>
          <tbody>
            ${rows
              .map(
                (h) => `<tr>
              <td>${fmtDate(h.data)}</td>
              <td>${h.entrada || "—"}</td>
              <td>${h.saida || (h.status === "hoje" ? "Em andamento" : "—")}</td>
              <td>${h.intervaloSaida && h.intervaloVolta ? `${h.intervaloSaida}–${h.intervaloVolta}` : "—"}</td>
              <td class="cell-num">${h.horasTrabalhadas != null ? fmtHoras(h.horasTrabalhadas) : "—"}</td>
              <td class="cell-num">${h.horasExtras ? fmtHoras(h.horasExtras) : "—"}</td>
              <td class="cell-num">${h.atrasoMin ? `${h.atrasoMin} min` : "—"}</td>
              <td>${localBadgeHtml(h.local)}${geoLinkForPonto(h.geo, h.data)}</td>
              <td>${statusPillPonto(h.status)}</td>
              <td>${h.alteradoPeloRH ? `<span class="badge-alterado" title="${esc(h.alteradoPeloRH.motivo)} — ${fmtDate(h.alteradoPeloRH.em.slice(0,10))}">${ICONS.edit}Alterado</span>` : "—"}</td>
            </tr>`
              )
              .join("")}
          </tbody>
        </table>`
        : emptyStateHtml({ icon: ICONS.clock, title: "Nenhum registro neste período", desc: "Escolha outro dia, semana ou intervalo." });
    }

    if (session) {
      renderShell(session, withBadges(NAV_RH, await rhNavBadges()));
      renderTopHeader(document.getElementById("top-header"), session, { notifications: [] });
      try {
        await carregarColaboradoresAtivos();
        colaboradorSelecionado = COLABORADORES_ATIVOS[0]?.nome || "";
        await Promise.all([refrescarHoje(), refrescarAjustes()]);
        render();
      } catch (erro) {
        document.getElementById("content").innerHTML = emptyStateHtml({
          icon: ICONS.alertCircle || ICONS.clock,
          title: "Não foi possível carregar os dados de ponto",
          desc: erro?.message || String(erro),
        });
      }
    }

})();
</script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
