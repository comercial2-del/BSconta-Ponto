<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relatórios — BSconta+ RH</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
  <style>
    /* Redesign visual dos relatórios: letras maiores/mais legíveis, mais
       espaçamento e uma disposição em seções (cabeçalho + indicadores +
       tabela) em vez do bloco de texto corrido único de antes. O texto
       corrido continua existindo só como fonte do "Baixar (.txt)". */
    .report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:1rem;margin-bottom:1.1rem;border-bottom:1px solid var(--border)}
    .report-head h2{margin:0;font-size:1.28rem;font-weight:800;letter-spacing:-.01em}
    .report-head .report-meta{margin:.35rem 0 0;font-size:.86rem;color:var(--text-faint);line-height:1.55}
    .report-section{margin-top:1.6rem}
    .report-section:first-child{margin-top:0}
    .report-section-title{font-size:.96rem;font-weight:800;color:var(--text);margin:0 0 .8rem}
    .report-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.85rem}
    .report-table-wrap table{font-size:.86rem}
    .report-table-wrap th{font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;color:var(--text-faint);padding:.7rem .9rem;font-weight:800}
    .report-table-wrap td{padding:.75rem .9rem;line-height:1.5}
    .report-table-wrap tbody tr:nth-child(even){background:var(--surface-2)}
    .report-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
    .report-list li{font-size:.87rem;line-height:1.55;padding:.7rem .9rem;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
    .report-toggle-txt{margin-top:1.4rem;padding-top:1rem;border-top:1px dashed var(--border)}
    .report-toggle-txt summary{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--text-soft)}
    .report-toggle-txt summary:hover{color:var(--text)}
    .report-pre{margin-top:.8rem;font-size:.86rem;line-height:1.65;letter-spacing:.01em}
    @media print {
      .top-header, #app-header, #cards-grid, .period-buttons, #btn-baixar { display: none !important; }
      .report-pre { display: none !important; }
    }
  </style>
  <style>
    .period-buttons button[data-p="custom"] { display: inline-flex; align-items: center; gap: .35rem; }
    .period-buttons button[data-p="custom"] svg { width: 15px; height: 15px; }
    .periodo-custom-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .75rem 1rem; }
    .periodo-custom-bar[hidden] { display: none; }
    .periodo-custom-bar .field { margin: 0; min-width: 160px; }
    .periodo-atalhos { display: flex; gap: .4rem; flex-wrap: wrap; }
    .periodo-atalhos .btn-ghost { width: auto; padding: .45rem .7rem; font-size: .8rem; }
    .periodo-custom-resumo { flex-basis: 100%; margin: 0; font-size: .8rem; color: var(--text-faint); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/rh-supabase-auth.js"></script>
  <script src="../js/rh-ponto-data.js"></script>
  <script src="../js/rh-ferias-data.js"></script>
  <script src="../js/rh-solicitacoes-data.js"></script>
  <script src="../js/rh-documentos-data.js"></script>
  <script src="../js/rh-historia-data.js"></script>
  <script src="../js/rh-ocorrencias-data.js"></script>
  <script>
(async function () {
    const session = await requireRoleReal("RH");
    if (!session) return;
    let periodo = "mes";
    // Período personalizado (datas escolhidas pelo RH) — padrão: mês atual.
    const periodoCustom = {
      inicio: (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`; })(),
      fim: rhTodayIso(),
    };
    let selecionado = null;

    // Cartões da tela (só rótulo/ícone — não é "dado" a ser relatado, é o
    // menu de relatórios disponíveis). O conteúdo de cada um vem de
    // rh.colaboradores / rh.ferias_solicitacoes / rh.solicitacoes /
    // rh.documentos / rh.ponto_registros — substitui DEMO.rhRelatorios +
    // todos os DEMO.* que os geradores liam (colaboradores, rhDepartamentos,
    // rhFerias, rhFeriasProximas, rhSolicitacoesTodas, rhDocumentos,
    // rhPontoHoje), que eram listas fixas em memória.
    const REPORTS_CARDS = [
      { id: "colaboradores", nome: "Colaboradores", desc: "Total, status e distribuição por departamento.", icon: "users", tone: "indigo" },
      { id: "presenca", nome: "Presença e Home Office", desc: "Dias presenciais, em home office e com alteração do RH, por colaborador.", icon: "mapPin", tone: "blue" },
      { id: "ferias", nome: "Férias", desc: "Solicitações aprovadas, pendentes e recusadas.", icon: "palmTree", tone: "green" },
      { id: "solicitacoes", nome: "Solicitações", desc: "Volume, status e categorias das solicitações ao RH.", icon: "messageSquare", tone: "amber" },
      { id: "documentos", nome: "Documentos", desc: "Holerites e documentos enviados, pendentes e assinados.", icon: "fileText", tone: "violet" },
      { id: "ponto", nome: "Jornada / Ponto", desc: "Situação do ponto de hoje e banco de horas.", icon: "clock", tone: "teal" },
      { id: "faltas", nome: "Faltas e justificativas", desc: "Faltas justificadas e não justificadas, com o motivo de cada uma.", icon: "xCircle", tone: "red" },
      { id: "abonos", nome: "Abonos, atestados e férias", desc: "Ocorrências registradas pelo RH e o status de cada uma.", icon: "clipboardCheck", tone: "violet" },
      { id: "personalizado", nome: "Pesquisa personalizada", desc: "Escolha os critérios (colaborador, departamento, tipo, período...) e gere só o que precisa.", icon: "filter", tone: "indigo" },
    ];

    // Dados reais carregados uma vez ao abrir a tela (recarregados sempre
    // que a tela reabre — não há cache entre sessões).
    let base = { colaboradores: [], ferias: [], solicitacoes: [], documentos: [], pontoHoje: [], pontoRegistros: [] };

    function periodoInicioIso() {
      if (periodo === "custom") return periodoCustom.inicio;
      const d = new Date();
      if (periodo === "mes") d.setDate(d.getDate() - 30);
      else if (periodo === "trimestre") d.setDate(d.getDate() - 90);
      else d.setFullYear(d.getFullYear() - 1);
      return d.toISOString().slice(0, 10);
    }
    function periodoFimIso() {
      return periodo === "custom" ? periodoCustom.fim : rhTodayIso();
    }

    async function carregarBase() {
      const hojeIso = rhTodayIso();
      const [{ data: colabRows, error: e1 }, ferias, solicitacoes, documentos, { data: pontoHojeRows, error: e2 }, { data: pontoRestoRows, error: e3 }, { data: pontoRegistrosRows, error: e4 }, intervaloMinimoMin] = await Promise.all([
        sb.from("colaboradores").select(`id, nome, departamento, status, admissao, data_desligamento, ${RH_COLABORADOR_JORNADA_COLS}`).order("nome"),
        rhCarregarFeriasRH(),
        rhCarregarSolicitacoesRH(),
        rhListarDocumentosRH(),
        sb.from("ponto_registros").select("colaborador_id, entrada, local").eq("data", hojeIso),
        sb.from("ponto_registros").select("colaborador_id, data, entrada, intervalo_saida, intervalo_volta, saida, atraso_min, horas_extras").neq("data", hojeIso),
        // Histórico completo (colaborador, data, local, alteração do RH) —
        // usado pelo relatório "Presença e Home Office", que precisa contar
        // dias por período, não só o status de hoje.
        sb.from("ponto_registros").select("colaborador_id, data, local, alterado_pelo_rh").order("data"),
        rhIntervaloMinimoConfigurado(),
      ]);
      if (e1) throw e1;
      if (e2) throw e2;
      if (e3) throw e3;
      if (e4) throw e4;

      const colaboradores = colabRows || [];
      const pontoPorId = {};
      (pontoHojeRows || []).forEach((r) => { pontoPorId[r.colaborador_id] = r; });
      const saldoPorId = {};
      const jornadaPorId = {};
      colaboradores.forEach((c) => { jornadaPorId[c.id] = rhConfigJornada(c); });
      // Banco de horas: + horas extras − atraso − almoço acima do mínimo não compensado.
      (pontoRestoRows || []).forEach((r) => { saldoPorId[r.colaborador_id] = (saldoPorId[r.colaborador_id] || 0) + (Number(r.horas_extras) || 0) - (Number(r.atraso_min) || 0) / 60 - rhDescontoAlmocoHoras(r, jornadaPorId[r.colaborador_id], intervaloMinimoMin); });
      const pontoHoje = colaboradores
        .filter((c) => c.status !== "INATIVO")
        .map((c) => {
          const row = pontoPorId[c.id];
          const entrada = row ? rhHoraCurta(row.entrada) : null;
          const config = rhConfigJornada(c);
          const status = c.status === "AFASTADO" ? "afastado" : rhClassificarStatusHoje({ entradaReal: entrada, config, dataIso: hojeIso });
          return { nome: c.nome, status, saldoBanco: saldoPorId[c.id] || 0 };
        });

      base = { colaboradores, ferias, solicitacoes, documentos, pontoHoje, pontoRegistros: pontoRegistrosRows || [], ocorrencias: [], ocorrenciasInicio: null, ocorrenciasErro: "" };
      await carregarOcorrencias(umAnoAtrasIso());
    }

    // Ocorrências consolidadas (faltas, atrasos, abonos, férias, ajustes) —
    // ver js/rh-ocorrencias-data.js. Carregadas para o último ano; a
    // Pesquisa Personalizada recarrega se o período pedido for mais antigo.
    function umAnoAtrasIso() {
      const d = new Date();
      d.setFullYear(d.getFullYear() - 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    async function carregarOcorrencias(inicioIso) {
      try {
        const r = await rhCarregarOcorrencias({ inicio: inicioIso, fim: rhTodayIso() });
        base.ocorrencias = r.linhas;
        base.ocorrenciasInicio = inicioIso;
        base.ocorrenciasControle = r.controleInicio;
        base.ocorrenciasErro = "";
      } catch (err) {
        base.ocorrencias = [];
        base.ocorrenciasErro = rhMensagemErroSupabase(err);
      }
    }
    function tabelaOcorrencias(linhas, colunas) {
      const cols = RH_OCORRENCIA_COLUNAS.filter((c) => colunas.includes(c.id));
      return { headers: cols.map((c) => c.label), rows: linhas.map((l) => cols.map((c) => c.valor(l))) };
    }

    // ------------------------------------------------------------------
    // Cada gerador devolve uma estrutura só de DADOS (título, indicadores,
    // seções com tabela ou lista) — usada tanto para desenhar a tela nova
    // (KPIs + tabelas, mais legível) quanto para montar o .txt do botão
    // "Baixar", sem duplicar a lógica em dois lugares.
    // ------------------------------------------------------------------
    function gerarRelatorio(id) {
      const hoje = new Date().toLocaleDateString("pt-BR");
      const periodoLabel = periodo === "custom"
        ? `${fmtDate(periodoCustom.inicio)} a ${fmtDate(periodoCustom.fim)}`
        : { mes: "últimos 30 dias", trimestre: "último trimestre", ano: "ano corrente" }[periodo];
      const inicioPeriodo = periodoInicioIso();
      const fimPeriodo = periodoFimIso();
      // Data (YYYY-MM-DD ou timestamp) dentro do período escolhido.
      const noPeriodoData = (v) => { if (!v) return false; const d = String(v).slice(0, 10); return d >= inicioPeriodo && d <= fimPeriodo; };
      const metaPadrao = `Período: ${periodoLabel} · Gerado em ${hoje} por ${session.name}`;

      const geradores = {
        colaboradores: () => {
          const total = base.colaboradores.length;
          const ativos = base.colaboradores.filter((c) => c.status === "ATIVO").length;
          const afastados = base.colaboradores.filter((c) => c.status === "AFASTADO").length;
          const admissoesPeriodo = base.colaboradores.filter((c) => noPeriodoData(c.admissao)).length;
          const desligamentosPeriodo = base.colaboradores.filter((c) => noPeriodoData(c.data_desligamento)).length;
          const porDeptoMap = {};
          base.colaboradores.forEach((c) => { const d = c.departamento || "Sem departamento"; porDeptoMap[d] = (porDeptoMap[d] || 0) + 1; });
          const porDept = Object.entries(porDeptoMap).sort((a, b) => b[1] - a[1]);
          return {
            titulo: "Relatório de Colaboradores",
            meta: metaPadrao,
            kpis: [
              { label: "Total de colaboradores", value: total, tone: "indigo", icon: ICONS.users },
              { label: "Ativos", value: ativos, tone: "green", icon: ICONS.checkCircle },
              { label: "Afastados", value: afastados, tone: "amber", icon: ICONS.alertCircle },
              { label: "Admissões no período", value: admissoesPeriodo, tone: "teal", icon: ICONS.users },
              { label: "Desligamentos no período", value: desligamentosPeriodo, tone: "red", icon: ICONS.xCircle },
            ],
            secoes: [
              { titulo: "Distribuição por departamento", tabela: { headers: ["Departamento", "Colaboradores"], rows: porDept.length ? porDept.map(([nome, qtd]) => [nome, String(qtd)]) : [] }, vazio: "Nenhum colaborador cadastrado." },
            ],
          };
        },
        presenca: () => {
          // Item 1 do pedido do RH: para cada colaborador, no período
          // selecionado — dias presenciais, dias em home office e dias com
          // alguma alteração feita pelo RH (rh.ponto_registros.alterado_pelo_rh).
          const ativos = base.colaboradores.filter((c) => c.status !== "INATIVO");
          const noPeriodo = base.pontoRegistros.filter((r) => noPeriodoData(r.data));
          const porColab = {};
          ativos.forEach((c) => { porColab[c.id] = { nome: c.nome, presencial: 0, homeOffice: 0, alteradoRH: 0 }; });
          noPeriodo.forEach((r) => {
            const linha = porColab[r.colaborador_id];
            if (!linha) return; // colaborador inativo/removido — não entra no relatório
            if (r.local === "PRESENCIAL") linha.presencial++;
            else if (r.local === "HOME_OFFICE") linha.homeOffice++;
            if (r.alterado_pelo_rh) linha.alteradoRH++;
          });
          const linhas = Object.values(porColab).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
          const totalPresencial = linhas.reduce((a, l) => a + l.presencial, 0);
          const totalHome = linhas.reduce((a, l) => a + l.homeOffice, 0);
          const totalAlterado = linhas.reduce((a, l) => a + l.alteradoRH, 0);
          return {
            titulo: "Relatório de Presença e Home Office",
            meta: metaPadrao,
            kpis: [
              { label: "Dias presenciais (equipe)", value: totalPresencial, tone: "blue", icon: ICONS.building || ICONS.mapPin },
              { label: "Dias em home office (equipe)", value: totalHome, tone: "green", icon: ICONS.home },
              { label: "Dias alterados pelo RH", value: totalAlterado, tone: "indigo", icon: ICONS.edit || ICONS.alertCircle },
              { label: "Colaboradores no relatório", value: linhas.length, tone: "teal", icon: ICONS.users },
            ],
            secoes: [
              {
                titulo: "Por colaborador",
                tabela: {
                  headers: ["Colaborador", "Dias presenciais", "Dias home office", "Dias alterados pelo RH"],
                  rows: linhas.map((l) => [l.nome, String(l.presencial), String(l.homeOffice), String(l.alteradoRH)]),
                },
                vazio: "Nenhum colaborador ativo cadastrado.",
              },
            ],
          };
        },
        ferias: () => {
          const noPeriodo = base.ferias.filter((f) => noPeriodoData(f.solicitadoEm));
          const aprov = noPeriodo.filter((f) => f.status === "APROVADA").length;
          const pend = noPeriodo.filter((f) => f.status === "PENDENTE" || f.status === "EM_ANALISE").length;
          const rec = noPeriodo.filter((f) => f.status === "RECUSADA").length;
          const diasTotal = noPeriodo.filter((f) => f.status === "APROVADA").reduce((a, f) => a + (f.dias || 0), 0);
          const hojeIso = rhTodayIso();
          const proximas = base.ferias.filter((f) => f.status === "APROVADA" && f.fim >= hojeIso).sort((a, b) => (a.inicio < b.inicio ? -1 : 1)).slice(0, 10);
          return {
            titulo: "Relatório de Férias",
            meta: metaPadrao,
            kpis: [
              { label: "Aprovadas no período", value: aprov, tone: "green", icon: ICONS.checkCircle },
              { label: "Pendentes no período", value: pend, tone: "amber", icon: ICONS.alertCircle },
              { label: "Recusadas no período", value: rec, tone: "red", icon: ICONS.xCircle },
              { label: "Dias de férias aprovados", value: diasTotal, tone: "indigo", icon: ICONS.palmTree },
            ],
            secoes: [
              {
                titulo: "Próximas férias aprovadas (todas as futuras, não só do período)",
                tabela: { headers: ["Colaborador", "Início", "Fim", "Dias"], rows: proximas.map((v) => [v.colaborador, fmtDate(v.inicio), fmtDate(v.fim), String(v.dias)]) },
                vazio: "Nenhuma férias aprovada futura.",
              },
            ],
          };
        },
        solicitacoes: () => {
          const noPeriodo = base.solicitacoes.filter((s) => noPeriodoData(s.data));
          const total = noPeriodo.length;
          const resolvidas = noPeriodo.filter((s) => (s.statusExibicao || s.status) === "RESOLVIDA" || s.status === "RECUSADA").length;
          const abertas = total - resolvidas;
          const porCategoria = {};
          noPeriodo.forEach((s) => (porCategoria[s.categoria] = (porCategoria[s.categoria] || 0) + 1));
          const temposResposta = noPeriodo
            .filter((s) => s.origem === "geral" && s.respostas && s.respostas.length && s.data)
            .map((s) => (new Date(s.respostas[s.respostas.length - 1].data) - new Date(s.data)) / 86400000)
            .filter((d) => d >= 0);
          const tempoMedio = temposResposta.length ? (temposResposta.reduce((a, b) => a + b, 0) / temposResposta.length).toFixed(1).replace(".", ",") + " dia(s)" : "sem dados suficientes";
          return {
            titulo: "Relatório de Solicitações",
            meta: metaPadrao,
            kpis: [
              { label: "Total no período", value: total, tone: "indigo", icon: ICONS.messageSquare },
              { label: "Resolvidas/recusadas", value: resolvidas, tone: "green", icon: ICONS.checkCircle },
              { label: "Em aberto", value: abertas, tone: "amber", icon: ICONS.alertCircle },
              { label: "Tempo médio de resposta", value: tempoMedio, tone: "teal", icon: ICONS.clock, format: "text" },
            ],
            secoes: [
              { titulo: "Por categoria", tabela: { headers: ["Categoria", "Solicitações"], rows: Object.entries(porCategoria).sort((a, b) => b[1] - a[1]).map(([c, n]) => [c, String(n)]) }, vazio: "Nenhuma solicitação no período." },
            ],
          };
        },
        documentos: () => {
          const noPeriodo = base.documentos.filter((d) => noPeriodoData(d.data));
          const publicadosOuAssinados = noPeriodo.filter((d) => d.status === "PUBLICADO" || d.status === "ASSINADO").length;
          const pendentesRows = base.documentos.filter((d) => d.status === "PENDENTE" || d.status === "AGUARDANDO_IMPORTACAO");
          const vencendo15 = base.documentos.filter((d) => d.prazo && d.status !== "ASSINADO" && d.status !== "PUBLICADO" && d.prazo >= rhTodayIso() && d.prazo <= new Date(Date.now() + 15 * 86400000).toISOString().slice(0, 10)).length;
          const labelsStatus = { ...STATUS_LABELS, PENDENTE: "Pendente de assinatura", AGUARDANDO_IMPORTACAO: "Aguardando importação" };
          return {
            titulo: "Relatório de Documentos",
            meta: metaPadrao,
            kpis: [
              { label: "Enviados no período", value: publicadosOuAssinados, tone: "green", icon: ICONS.fileText },
              { label: "Pendentes (total)", value: pendentesRows.length, tone: "amber", icon: ICONS.alertCircle },
              { label: "Vencendo em 15 dias", value: vencendo15, tone: "red", icon: ICONS.xCircle },
            ],
            secoes: [
              { titulo: "Pendências", tabela: { headers: ["Colaborador", "Documento", "Status"], rows: pendentesRows.map((d) => [d.colaborador, d.titulo || d.tipo, labelsStatus[d.status] || d.status]) }, vazio: "Nenhuma pendência." },
            ],
          };
        },
        ponto: () => {
          const emDia = base.pontoHoje.filter((r) => r.status === "completo").length;
          const atrasos = base.pontoHoje.filter((r) => r.status === "atraso").length;
          const faltas = base.pontoHoje.filter((r) => r.status === "falta").length;
          const negativo = base.pontoHoje.filter((r) => r.saldoBanco < 0).length;
          return {
            titulo: "Relatório de Jornada / Ponto",
            meta: `Situação de hoje (${hoje}) — o período selecionado não se aplica a este relatório · Gerado por ${session.name}`,
            kpis: [
              { label: "Em dia hoje", value: emDia, tone: "green", icon: ICONS.checkCircle },
              { label: "Atrasos hoje", value: atrasos, tone: "amber", icon: ICONS.alertCircle },
              { label: "Faltas hoje", value: faltas, tone: "red", icon: ICONS.xCircle },
              { label: "Banco de horas negativo", value: negativo, tone: "violet", icon: ICONS.clock },
            ],
            secoes: [
              { titulo: "Detalhe por colaborador", tabela: { headers: ["Colaborador", "Status hoje", "Banco de horas"], rows: base.pontoHoje.map((r) => [r.nome, r.status, `${r.saldoBanco >= 0 ? "+" : ""}${r.saldoBanco.toFixed(1)}h`]) }, vazio: "Nenhum colaborador ativo cadastrado." },
            ],
          };
        },
      };
      geradores.faltas = () => {
        const faltas = base.ocorrencias.filter((l) => l.categoria === "FALTA" && noPeriodoData(l.data));
        const just = faltas.filter((l) => l.justificacao === "JUSTIFICADA").length;
        const naoJust = faltas.filter((l) => l.justificacao === "NAO_JUSTIFICADA").length;
        const emAnalise = faltas.filter((l) => l.justificacao === "EM_ANALISE").length;
        const porColab = {};
        faltas.forEach((l) => {
          const k = l.colaborador;
          porColab[k] = porColab[k] || { j: 0, n: 0, a: 0, depto: l.departamento };
          if (l.justificacao === "JUSTIFICADA") porColab[k].j++; else if (l.justificacao === "EM_ANALISE") porColab[k].a++; else porColab[k].n++;
        });
        return {
          titulo: "Relatório de Faltas e Justificativas",
          meta: `${metaPadrao}${base.ocorrenciasControle ? ` · Dias sem registro contam como falta a partir de ${fmtDate(base.ocorrenciasControle)}` : ""}`,
          kpis: [
            { label: "Faltas no período", value: faltas.length, tone: "red", icon: ICONS.xCircle },
            { label: "Justificadas", value: just, tone: "green", icon: ICONS.checkCircle },
            { label: "Não justificadas", value: naoJust, tone: "amber", icon: ICONS.alertCircle },
            { label: "Aguardando abono", value: emAnalise, tone: "violet", icon: ICONS.hourglass },
          ],
          secoes: [
            { titulo: "Por colaborador", tabela: { headers: ["Colaborador", "Departamento", "Justificadas", "Não justificadas", "Aguardando abono"], rows: Object.entries(porColab).sort((a, b) => (b[1].n - a[1].n) || a[0].localeCompare(b[0], "pt-BR")).map(([n, v]) => [n, v.depto || "—", String(v.j), String(v.n), String(v.a)]) }, vazio: base.ocorrenciasErro || "Nenhuma falta no período." },
            { titulo: "Detalhe", tabela: tabelaOcorrencias(faltas, ["data", "colaborador", "situacao", "justificacao", "motivo"]), vazio: base.ocorrenciasErro || "Nenhuma falta no período." },
          ],
        };
      };
      geradores.abonos = () => {
        const linhas = base.ocorrencias.filter((l) => ["ABONO", "ATESTADO", "FERIAS"].includes(l.categoria) && String(l.dataFim || l.data || "").slice(0, 10) >= inicioPeriodo && String(l.dataInicio || l.data || l.dataFim || "").slice(0, 10) <= fimPeriodo);
        const atestados = linhas.filter((l) => l.categoria === "ATESTADO");
        return {
          titulo: "Relatório de Abonos, Atestados e Férias",
          meta: metaPadrao,
          kpis: [
            { label: "Ocorrências no período", value: linhas.length, tone: "indigo", icon: ICONS.clipboardCheck },
            { label: "Atestados", value: atestados.length, tone: "red", icon: ICONS.fileText },
            { label: "Abonos aprovados", value: linhas.filter((l) => l.categoria !== "FERIAS" && l.status === "APROVADO").length, tone: "green", icon: ICONS.checkCircle },
            { label: "Pendentes / pré-aprovados", value: linhas.filter((l) => l.status === "PENDENTE" || l.status === "PRE_APROVADO").length, tone: "amber", icon: ICONS.hourglass },
          ],
          secoes: [
            { titulo: "Ocorrências", tabela: tabelaOcorrencias(linhas, ["data", "colaborador", "departamento", "situacao", "justificacao", "motivo", "dias", "status"]), vazio: base.ocorrenciasErro || "Nenhuma ocorrência no período." },
          ],
        };
      };
      geradores.personalizado = () => relPersonalizado || { titulo: "Pesquisa personalizada", meta: "Defina os critérios acima e clique em Gerar relatório.", kpis: [], secoes: [] };
      return (geradores[id] || (() => ({ titulo: "Relatório indisponível", meta: "", kpis: [], secoes: [] })))();
    }

    function relatorioParaTexto(rel) {
      const linhas = [rel.titulo.toUpperCase(), rel.meta, ""];
      rel.kpis.forEach((k) => linhas.push(`${k.label}: ${k.value}`));
      rel.secoes.forEach((s) => {
        linhas.push("", s.titulo.toUpperCase() + ":");
        const rows = s.tabela?.rows || [];
        if (!rows.length) { linhas.push(`  ${s.vazio || "Sem dados."}`); return; }
        rows.forEach((r) => linhas.push(`  - ${r.join(" · ")}`));
      });
      return linhas.join("\n");
    }

    function relatorioParaHtml(rel) {
      const kpisHtml = rel.kpis.length ? `<div class="report-kpi-grid">${rel.kpis.map(kpiCardHtml).join("")}</div>` : "";
      const secoesHtml = rel.secoes
        .map((s) => {
          const rows = s.tabela?.rows || [];
          const tabelaHtml = rows.length
            ? `<div class="table-scroll report-table-wrap"><table class="table-cards"><thead><tr>${s.tabela.headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td data-label="${esc(s.tabela.headers[i] || "")}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
            : emptyStateHtml({ icon: ICONS.reports, title: s.vazio || "Sem dados", desc: "" });
          return `<div class="report-section"><h3 class="report-section-title">${esc(s.titulo)}</h3>${tabelaHtml}</div>`;
        })
        .join("");
      return `
        <div class="report-head">
          <div>
            <h2>${esc(rel.titulo)}</h2>
            <p class="report-meta">${esc(rel.meta)}</p>
          </div>
        </div>
        ${kpisHtml}
        ${secoesHtml}
        <details class="report-toggle-txt">
          <summary>Ver como texto simples</summary>
          <pre class="report-pre">${esc(relatorioParaTexto(rel))}</pre>
        </details>
      `;
    }

    function render() {
      document.getElementById("content").innerHTML = `
        <div class="space-y">
          <div class="row-between">
            <div>
              <h1 class="page-title">Relatórios</h1>
              <p class="page-sub">Gere relatórios com os principais indicadores de RH.</p>
            </div>
            <div class="period-buttons">
              <button type="button" data-p="mes" class="active">30 dias</button>
              <button type="button" data-p="trimestre">Trimestre</button>
              <button type="button" data-p="ano">Ano</button>
              <button type="button" data-p="custom">${ICONS.calendar || ""}<span>Personalizado</span></button>
            </div>
          </div>

          <div class="card card-p periodo-custom-bar" id="periodo-custom" hidden>
            <div class="field"><label>Data inicial</label><input type="date" id="pc-inicio" value="${periodoCustom.inicio}" max="${rhTodayIso()}" /></div>
            <div class="field"><label>Data final</label><input type="date" id="pc-fim" value="${periodoCustom.fim}" /></div>
            <div class="periodo-atalhos">
              <button type="button" class="btn-ghost" data-atalho="mes-atual">Mês atual</button>
              <button type="button" class="btn-ghost" data-atalho="mes-anterior">Mês anterior</button>
              <button type="button" class="btn-ghost" data-atalho="ano-atual">Este ano</button>
            </div>
            <button type="button" class="btn-primary auto" id="pc-aplicar">${ICONS.checkCircle}<span>Aplicar período</span></button>
            <p class="periodo-custom-resumo" id="pc-resumo"></p>
          </div>

          <div class="grid-3-even" id="cards-grid"></div>

          <div class="card card-p" id="resultado-wrap" style="display:none">
            <div class="row-between" style="margin-bottom:0.4rem">
              <div></div>
              <div style="display:flex;gap:0.5rem">
                <button type="button" class="btn-ghost" style="width:auto" id="btn-baixar">${ICONS.download}<span>Baixar (.txt)</span></button>
              </div>
            </div>
            <div id="resultado-conteudo"></div>
          </div>
        </div>
      `;

      document.getElementById("cards-grid").innerHTML = REPORTS_CARDS
        .map(
          (r) => `
        <div class="card card-p">
          <div class="row-between" style="align-items:flex-start">
            <div class="kpi-icon tone-${r.tone}">${ICONS[r.icon] || ICONS.reports}</div>
          </div>
          <h3 style="margin:0.7rem 0 0.2rem">${esc(r.nome)}</h3>
          <p style="margin:0;font-size:0.83rem;color:var(--text-faint);min-height:2.4em">${esc(r.desc)}</p>
          <button type="button" class="btn-primary auto" style="margin-top:0.9rem" data-gerar="${r.id}" data-nome="${esc(r.nome)}">${ICONS.reports}<span>Gerar relatório</span></button>
        </div>`
        )
        .join("");

      document.querySelectorAll("[data-p]").forEach((btn) =>
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-p]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          periodo = btn.dataset.p;
          document.getElementById("periodo-custom").hidden = periodo !== "custom";
          atualizarResumoPeriodo();
          if (selecionado) mostrarResultado(selecionado.id, selecionado.nome);
        })
      );

      const pcInicio = document.getElementById("pc-inicio");
      const pcFim = document.getElementById("pc-fim");
      function atualizarResumoPeriodo() {
        const el = document.getElementById("pc-resumo");
        if (!el) return;
        const dias = Math.round((new Date(periodoCustom.fim) - new Date(periodoCustom.inicio)) / 86400000) + 1;
        el.textContent = `Relatórios de ${fmtDate(periodoCustom.inicio)} a ${fmtDate(periodoCustom.fim)} (${dias} dia${dias === 1 ? "" : "s"}).`;
      }
      async function aplicarPeriodoCustom() {
        const ini = pcInicio.value, fim = pcFim.value;
        if (!ini || !fim) { showToast("Informe a data inicial e a data final.", "error"); return; }
        if (ini > fim) { showToast("A data inicial não pode ser depois da data final.", "error"); return; }
        periodoCustom.inicio = ini;
        periodoCustom.fim = fim;
        // Ocorrências vêm carregadas só do último ano — período mais antigo recarrega.
        if (!base.ocorrenciasInicio || ini < base.ocorrenciasInicio) {
          const btn = document.getElementById("pc-aplicar");
          btn.disabled = true;
          await carregarOcorrencias(ini);
          btn.disabled = false;
        }
        atualizarResumoPeriodo();
        if (selecionado) mostrarResultado(selecionado.id, selecionado.nome);
        else showToast("Período aplicado. Agora clique em “Gerar relatório” no relatório desejado.", "success");
      }
      document.getElementById("pc-aplicar").addEventListener("click", aplicarPeriodoCustom);
      document.querySelectorAll("[data-atalho]").forEach((b) => b.addEventListener("click", () => {
        const hoje = new Date();
        const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        if (b.dataset.atalho === "mes-atual") { pcInicio.value = iso(new Date(hoje.getFullYear(), hoje.getMonth(), 1)); pcFim.value = rhTodayIso(); }
        else if (b.dataset.atalho === "mes-anterior") { pcInicio.value = iso(new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1)); pcFim.value = iso(new Date(hoje.getFullYear(), hoje.getMonth(), 0)); }
        else { pcInicio.value = `${hoje.getFullYear()}-01-01`; pcFim.value = rhTodayIso(); }
        aplicarPeriodoCustom();
      }));
      atualizarResumoPeriodo();

      document.querySelectorAll("[data-gerar]").forEach((btn) =>
        btn.addEventListener("click", () => mostrarResultado(btn.dataset.gerar, btn.dataset.nome))
      );
    }

    // ------------------------------------------------------------------
    // Pesquisa personalizada — o RH escolhe os critérios e as colunas, e o
    // relatório é gerado só com aquilo. A estrutura de relatórios acima foi
    // apenas ampliada (mesmo formato título/indicadores/seções).
    // ------------------------------------------------------------------
    let relPersonalizado = null;
    let linhasPersonalizado = [];
    const filtroPers = {
      inicio: (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`; })(),
      fim: rhTodayIso(), colaboradorId: "", codigo: "", departamento: "", cargo: "", categorias: ["FALTA"], justificacao: "", status: "", busca: "",
      colunas: RH_OCORRENCIA_COLUNAS.filter((c) => c.padrao).map((c) => c.id),
    };

    function builderHtml() {
      const deptos = [...new Set(base.colaboradores.map((c) => c.departamento).filter(Boolean))].sort();
      const cargos = [...new Set((base.ocorrencias || []).map((l) => l.cargo).filter(Boolean))].sort();
      return `
        <div class="report-head" style="margin-bottom:1rem">
          <div><h2>Pesquisa personalizada</h2><p class="report-meta">Selecione os critérios desejados e gere o relatório somente com essas informações.</p></div>
        </div>
        <div class="report-builder">
          <div class="field"><label>Data inicial</label><input type="date" id="rp-inicio" value="${filtroPers.inicio}" /></div>
          <div class="field"><label>Data final</label><input type="date" id="rp-fim" value="${filtroPers.fim}" /></div>
          <div class="field"><label>Colaborador</label><select id="rp-colab"><option value="">Todos</option>${base.colaboradores.map((c) => `<option value="${c.id}" ${c.id === filtroPers.colaboradorId ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select></div>
          <div class="field"><label>Código</label><input type="text" id="rp-codigo" value="${esc(filtroPers.codigo)}" placeholder="Ex.: 001" /></div>
          <div class="field"><label>Departamento</label><select id="rp-depto"><option value="">Todos</option>${deptos.map((d) => `<option ${d === filtroPers.departamento ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
          <div class="field"><label>Cargo</label><select id="rp-cargo"><option value="">Todos</option>${cargos.map((d) => `<option ${d === filtroPers.cargo ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
          <div class="field"><label>Justificação</label><select id="rp-just"><option value="">Todas</option>${Object.entries(RH_JUSTIFICACAO).map(([k, v]) => `<option value="${k}" ${k === filtroPers.justificacao ? "selected" : ""}>${v}</option>`).join("")}</select></div>
          <div class="field"><label>Status</label><select id="rp-status"><option value="">Todos</option>${Object.entries(RH_OCORRENCIA_STATUS).map(([k, v]) => `<option value="${k}" ${k === filtroPers.status ? "selected" : ""}>${v}</option>`).join("")}</select></div>
          <div class="field" style="grid-column:1/-1"><label>Tipo de ocorrência</label>
            <div class="report-cols">${Object.entries(RH_OCORRENCIA_CATEGORIAS).map(([k, v]) => `<label class="check-row"><input type="checkbox" data-rp-cat="${k}" ${filtroPers.categorias.includes(k) ? "checked" : ""} /> ${v}</label>`).join("")}</div>
          </div>
          <div class="field" style="grid-column:1/-1"><label>Colunas do relatório</label>
            <div class="report-cols">${RH_OCORRENCIA_COLUNAS.map((c) => `<label class="check-row"><input type="checkbox" data-rp-col="${c.id}" ${filtroPers.colunas.includes(c.id) ? "checked" : ""} /> ${c.label}</label>`).join("")}</div>
          </div>
          <div class="field" style="grid-column:1/-1"><label>Busca livre (nome, motivo)</label><input type="text" id="rp-busca" value="${esc(filtroPers.busca)}" placeholder="Opcional" /></div>
        </div>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem">
          <button type="button" class="btn-primary auto" id="rp-gerar">${ICONS.reports}<span>Gerar relatório</span></button>
          <button type="button" class="btn-ghost" style="width:auto" id="rp-csv" ${linhasPersonalizado.length ? "" : "disabled"}>${ICONS.download}<span>Exportar planilha (.csv)</span></button>
          <button type="button" class="btn-ghost" style="width:auto" id="rp-limpar">${ICONS.refresh}<span>Limpar filtros</span></button>
        </div>
        <div id="rp-resultado" style="margin-top:1.4rem">${relPersonalizado ? relatorioParaHtml(relPersonalizado) : ""}</div>`;
    }

    function lerFiltrosPers() {
      const v = (id) => document.getElementById(id).value;
      Object.assign(filtroPers, {
        inicio: v("rp-inicio"), fim: v("rp-fim"), colaboradorId: v("rp-colab"), codigo: v("rp-codigo").trim(), departamento: v("rp-depto"),
        cargo: v("rp-cargo"), justificacao: v("rp-just"), status: v("rp-status"), busca: v("rp-busca"),
        categorias: [...document.querySelectorAll("[data-rp-cat]:checked")].map((i) => i.dataset.rpCat),
        colunas: [...document.querySelectorAll("[data-rp-col]:checked")].map((i) => i.dataset.rpCol),
      });
    }

    async function gerarPersonalizado() {
      lerFiltrosPers();
      if (!filtroPers.colunas.length) { showToast("Selecione pelo menos uma coluna.", "error"); return; }
      if (filtroPers.inicio && filtroPers.fim && filtroPers.fim < filtroPers.inicio) { showToast("A data final não pode ser anterior à inicial.", "error"); return; }
      const btn = document.getElementById("rp-gerar");
      btn.disabled = true;
      try {
        if (filtroPers.inicio && (!base.ocorrenciasInicio || filtroPers.inicio < base.ocorrenciasInicio)) await carregarOcorrencias(filtroPers.inicio);
        linhasPersonalizado = rhFiltrarOcorrencias(base.ocorrencias, filtroPers);
        const colab = base.colaboradores.find((c) => c.id === filtroPers.colaboradorId);
        const criterios = [
          `Período: ${fmtDate(filtroPers.inicio)} a ${fmtDate(filtroPers.fim)}`,
          colab && `Colaborador: ${colab.nome}`, filtroPers.codigo && `Código: ${filtroPers.codigo}`,
          filtroPers.departamento && `Departamento: ${filtroPers.departamento}`, filtroPers.cargo && `Cargo: ${filtroPers.cargo}`,
          filtroPers.categorias.length && `Tipo: ${filtroPers.categorias.map((c) => RH_OCORRENCIA_CATEGORIAS[c]).join(", ")}`,
          filtroPers.justificacao && `Justificação: ${RH_JUSTIFICACAO[filtroPers.justificacao]}`,
          filtroPers.status && `Status: ${RH_OCORRENCIA_STATUS[filtroPers.status]}`,
        ].filter(Boolean);
        const TITULOS = { FALTA: "Relatório de faltas", ATRASO: "Relatório de atrasos", ATESTADO: "Relatório de atestados", ABONO: "Relatório de abonos", FERIAS: "Relatório de férias", AJUSTE: "Relatório de ajustes de ponto" };
        const mesRef = filtroPers.inicio && filtroPers.fim && filtroPers.inicio.slice(0, 7) === filtroPers.fim.slice(0, 7)
          ? ` — ${new Date(filtroPers.inicio + "T00:00:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" }).replace(/^./, (c) => c.toUpperCase()).replace(" de ", "/")}`
          : "";
        relPersonalizado = {
          titulo: (filtroPers.categorias.length === 1 ? TITULOS[filtroPers.categorias[0]] : "Relatório personalizado") + mesRef,
          meta: `${criterios.join(" · ")} · Gerado em ${new Date().toLocaleDateString("pt-BR")} por ${session.name}`,
          kpis: [
            { label: "Registros encontrados", value: linhasPersonalizado.length, tone: "indigo", icon: ICONS.reports },
            { label: "Colaboradores", value: new Set(linhasPersonalizado.map((l) => l.colaboradorId)).size, tone: "teal", icon: ICONS.users },
            { label: "Justificadas", value: linhasPersonalizado.filter((l) => l.justificacao === "JUSTIFICADA").length, tone: "green", icon: ICONS.checkCircle },
            { label: "Não justificadas", value: linhasPersonalizado.filter((l) => l.justificacao === "NAO_JUSTIFICADA").length, tone: "red", icon: ICONS.xCircle },
          ],
          secoes: [{ titulo: "Resultado", tabela: tabelaOcorrencias(linhasPersonalizado, filtroPers.colunas), vazio: base.ocorrenciasErro || "Nenhum registro encontrado com esses critérios." }],
        };
        selecionado = { id: "personalizado", nome: "Pesquisa personalizada", rel: relPersonalizado };
        mostrarBuilder();
      } finally {
        const b = document.getElementById("rp-gerar");
        if (b) b.disabled = false;
      }
    }

    function mostrarBuilder() {
      document.getElementById("resultado-wrap").style.display = "";
      document.getElementById("resultado-conteudo").innerHTML = builderHtml();
      document.getElementById("rp-gerar").addEventListener("click", gerarPersonalizado);
      document.getElementById("rp-limpar").addEventListener("click", () => {
        Object.assign(filtroPers, { colaboradorId: "", codigo: "", departamento: "", cargo: "", categorias: [], justificacao: "", status: "", busca: "" });
        relPersonalizado = null; linhasPersonalizado = [];
        mostrarBuilder();
      });
      document.getElementById("rp-csv").addEventListener("click", () => {
        const blob = new Blob([rhOcorrenciasParaCsv(linhasPersonalizado, filtroPers.colunas)], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `relatorio-personalizado-${rhTodayIso()}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        showToast("Planilha exportada.", "success");
      });
    }

    function mostrarResultado(id, nome) {
      if (id === "personalizado") {
        selecionado = { id, nome, rel: gerarRelatorio(id) };
        mostrarBuilder();
        document.getElementById("resultado-wrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
        return;
      }
      selecionado = { id, nome, rel: gerarRelatorio(id) };
      document.getElementById("resultado-wrap").style.display = "";
      document.getElementById("resultado-conteudo").innerHTML = relatorioParaHtml(selecionado.rel);
      document.getElementById("resultado-wrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    if (session) {
      renderShell(session, withBadges(NAV_RH, await rhNavBadges()));
      renderTopHeader(document.getElementById("top-header"), session, { notifications: [] });
      try {
        await carregarBase();
      } catch (err) {
        rhShowFatalError(rhMensagemErroSupabase(err));
        return;
      }
      render();
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#btn-baixar") || !selecionado) return;
        const conteudo = relatorioParaTexto(selecionado.rel);
        const blob = new Blob([conteudo], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `relatorio-${selecionado.id}-${rhTodayIso()}.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast("Relatório baixado.", "success");
      });
    }
  
})();
</script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
