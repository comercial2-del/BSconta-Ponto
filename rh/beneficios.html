<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benefícios — BSconta+ RH</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
  <!-- Estilos próprios da tela de Benefícios (prefixo bf-, escopo .bnf) para
       não interferir no restante do sistema. -->
  <style>
.bnf{--green-50:#ecfdf3;--green-600:#079455;--green-700:#067647;--orange-50:#fff6ed;--orange-600:#e04f16;--red-50:#fef3f2;--red-500:#f04438;--red-600:#d92d20;--pink-500:#e8456b;--violet-50:#f4f3ff;--violet-600:#6941c6;--teal-50:#effcfb;--teal-600:#0e9384;--blue-50:#eef4ff;--blue-100:#dfeaff;--blue-500:#3967e8;--blue-600:#2f5bd3;--blue-700:#2347ad;--shadow-md:0 10px 26px rgba(16,24,40,.06);--shadow-lg:0 22px 55px rgba(16,24,40,.14)}
.bnf button{font-family:inherit;cursor:pointer}
.bnf .bf-avatar{overflow:hidden}
.bnf .bf-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.bnf .bf-toolbar .bf-inp{width:auto;margin:0}
.bnf .bf-toolbar{justify-content:flex-end}
.bnf .bf-btn{font-size:.85rem;font-weight:700}
.bnf .bf-btn-sm{font-size:.78rem}
.bnf input.bf-inp,.bnf select.bf-inp{margin:0;font-size:.88rem}
.bnf .bf-money input.bf-inp{min-height:0}
@media (max-width:640px){.bnf .bf-toolbar .bf-inp{flex:1 1 45%}}.bnf svg{display:block}
.bnf .bf-inp,.bnf select.bf-inp,.bnf input.bf-inp{font:inherit;color:var(--text)}


/* ---------- Shell (igual ao sistema) ---------- */

/* ---------- Elementos ---------- */
.bf-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;flex-shrink:0}
.bf-c1{background:#eef4ff;color:#2f5bd3}.bf-c2{background:#ecfdf3;color:#067647}.bf-c3{background:#fff6ed;color:#c4320a}.bf-c4{background:#f4f3ff;color:#5925dc}.bf-c5{background:#fdf2fa;color:#c11574}
.bf-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:10px;font-weight:700;font-size:.85rem;padding:.62rem .95rem;border:1px solid transparent;transition:background .15s,box-shadow .15s,transform .15s,border-color .15s;white-space:nowrap}
.bf-btn svg{width:16px;height:16px}
.bf-btn-primary{background:var(--blue-600);color:#fff;box-shadow:0 6px 14px rgba(47,91,211,.18)}
.bf-btn-primary:hover{background:#294fb8;transform:translateY(-1px)}
.bf-btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.bf-btn-ghost:hover{background:var(--surface-2);border-color:#d5dbe7}
.bf-btn-danger-ghost{background:#fff;border-color:#fecdca;color:var(--red-600)}
.bf-btn-sm{padding:.42rem .7rem;font-size:.78rem;border-radius:9px}
.bf-icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--text-soft)}
.bf-icon-btn:hover{background:var(--surface-2);color:var(--blue-600)}
.bf-icon-btn svg{width:16px;height:16px}
.bf-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;padding:.22rem .55rem;border-radius:999px}
.bf-b-green{background:var(--green-50);color:var(--green-700)}.bf-b-gray{background:#f2f4f7;color:#475467}.bf-b-blue{background:var(--blue-50);color:var(--blue-700)}.bf-b-orange{background:var(--orange-50);color:var(--orange-600)}.bf-b-pink{background:#fff0f3;color:#c01048}
.bf-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}

.bf-toolbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.bf-month-nav{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:11px;height:40px}
.bf-month-nav button{border:0;background:transparent;width:36px;height:100%;display:grid;place-items:center;color:var(--text-soft)}
.bf-month-nav button:hover{color:var(--blue-600)}
.bf-month-nav button svg{width:16px;height:16px}
.bf-month-nav span{min-width:150px;text-align:center;font-weight:700;font-size:.85rem;display:flex;flex-direction:column;line-height:1.1}
.bf-month-nav span small{font-size:.63rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
select.bf-inp,input.bf-inp{height:40px;border:1px solid var(--border);border-radius:10px;background:#fff;padding:0 .75rem;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
select.bf-inp:focus,input.bf-inp:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(57,103,232,.14)}

.bf-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-bottom:1.2rem}
.bf-kpi{padding:1rem 1.1rem}
.bf-kpi-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem}
.bf-kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.bf-kpi-ico svg{width:17px;height:17px}
.bf-kpi-label{margin:0;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.bf-kpi-value{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.bf-kpi-sub{font-size:.75rem;color:var(--text-faint);margin-top:.15rem}

.bf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.bf-bcard{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.bf-bcard:hover{border-color:#c9d6f6;box-shadow:var(--shadow-md);transform:translateY(-1px)}
.bf-bcard.bf-inactive{opacity:.72}
.bf-bcard-top{display:flex;gap:.85rem;padding:1.05rem 1.1rem .8rem}
.bf-b-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.bf-b-ico svg{width:20px;height:20px}
.bf-bcard h3{margin:0;font-size:1rem;font-weight:800}
.bf-bcard .bf-desc{margin:.2rem 0 0;color:var(--text-soft);font-size:.82rem;line-height:1.4}
.bf-bcard-stats{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;padding:0 1.1rem .9rem}
.bf-stat{background:var(--surface-2);border:1px solid #eef1f6;border-radius:10px;padding:.55rem .7rem}
.bf-stat small{display:block;font-size:.66rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
.bf-stat b{font-size:.95rem}
.bf-foot-actions{display:flex;gap:.4rem;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.bf-bcard-foot .bf-chip{white-space:nowrap}
.bf-btn-launch{background:var(--green-50);color:var(--green-700);border-color:#abefc6}
.bf-btn-launch:hover{background:#dcfae6}
.bf-icon-btn.bf-danger{color:var(--red-600);border-color:#fecdca}
.bf-icon-btn.bf-danger:hover{background:var(--red-50);color:var(--red-600)}
.bf-confirm-ico.bf-danger{background:var(--red-50);color:var(--red-600)}
.bf-confirm-ico.bf-ok{background:var(--green-50);color:var(--green-700)}
.bf-bcard-foot{margin-top:auto;display:flex;flex-wrap:wrap;row-gap:.5rem;align-items:center;justify-content:space-between;gap:.5rem;padding:.65rem 1.1rem;border-top:1px solid var(--border);background:var(--surface-2)}
.bf-chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:600;color:var(--text-soft)}
.bf-chip svg{width:14px;height:14px;color:var(--text-faint)}
.bf-empty{padding:3rem 1rem;text-align:center;color:var(--text-soft)}
.bf-empty .bf-e-ico{width:52px;height:52px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;margin:0 auto .8rem;color:var(--text-faint)}

/* ---------- Modal ---------- */
.bf-overlay{position:fixed;inset:0;background:rgba(16,24,40,.48);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:1.2rem;z-index:50}
.bf-overlay.bf-open{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.bf-modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:940px;max-height:min(90vh,820px);display:flex;flex-direction:column;animation:pop .18s ease;overflow:hidden}
.bf-modal-sm{max-width:440px}
.bf-modal-head{padding:1.1rem 1.3rem .9rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:.8rem;flex-shrink:0}
.bf-modal-head h2{margin:0;font-size:1.15rem;font-weight:800}
.bf-modal-head p{margin:.2rem 0 0;color:var(--text-soft);font-size:.82rem}
.bf-modal-head .bf-x{margin-left:auto}
.bf-tabs{display:flex;gap:.25rem;padding:0 1.3rem;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.bf-tabs button{border:0;background:transparent;padding:.8rem .2rem;margin-right:1rem;font-weight:700;font-size:.84rem;color:var(--text-soft);border-bottom:2px solid transparent;display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.bf-tabs button .bf-n{width:20px;height:20px;border-radius:50%;background:#f2f4f7;color:var(--text-soft);display:grid;place-items:center;font-size:.7rem}
.bf-tabs button.bf-active{color:var(--blue-700);border-bottom-color:var(--blue-600)}
.bf-tabs button.bf-active .bf-n{background:var(--blue-600);color:#fff}
.bf-modal-body{padding:1.2rem 1.3rem;overflow-y:auto;flex:1;min-height:0}
.bf-modal-foot{padding:.85rem 1.3rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;align-items:center;gap:.6rem;flex-shrink:0;background:#fff}
.bf-modal-foot .bf-hint{margin-right:auto;font-size:.78rem;color:var(--text-faint)}
.bf-sec{margin-bottom:1.3rem}
.bf-sec-title{display:flex;align-items:center;gap:.5rem;margin:0 0 .7rem;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft)}
.bf-sec-title .bf-dot{width:6px;height:6px;border-radius:50%;background:var(--pink-500)}
.bf-form-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:.9rem}
.bf-field label{display:block;font-size:.78rem;font-weight:700;color:var(--text-soft);margin-bottom:.35rem}
.bf-field .bf-inp{width:100%}
.bf-field.bf-full{grid-column:1/-1}
.bf-swatches{display:flex;flex-wrap:wrap;gap:.45rem}
.bf-sw-icon{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--text-soft);transition:border-color .12s,background .12s,color .12s}
.bf-sw-icon svg{width:18px;height:18px}
.bf-sw-icon:hover{border-color:#c9d6f6}
.bf-sw-icon.bf-active{border-color:var(--blue-600);background:var(--blue-50);color:var(--blue-600)}
.bf-sw-tone{width:32px;height:32px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(15,23,42,.06);transition:transform .12s}
.bf-sw-tone:hover{transform:scale(1.08)}
.bf-sw-tone.bf-active{border-color:var(--text);box-shadow:0 0 0 2px #fff inset}
.bf-preview-card{display:flex;gap:.7rem;align-items:center;border:1px dashed var(--border);border-radius:12px;padding:.7rem .85rem;background:var(--surface-2)}
.bf-preview-card b{display:block;font-size:.9rem}.bf-preview-card small{color:var(--text-faint);font-size:.75rem}
.bf-seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.2rem;height:40px}
.bf-seg button{border:0;background:transparent;border-radius:8px;padding:0 .9rem;font-weight:700;font-size:.8rem;color:var(--text-soft);display:flex;align-items:center;gap:.4rem}
.bf-seg button.bf-active{background:#fff;box-shadow:var(--shadow-sm)}
.bf-seg button.bf-active.bf-on{color:var(--green-700)}.bf-seg button.bf-active.bf-off{color:var(--red-600)}
.bf-seg button i{width:7px;height:7px;border-radius:50%;background:currentColor}
.bf-radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.bf-rcard{border:1.5px solid var(--border);border-radius:12px;padding:.85rem .95rem;display:flex;gap:.7rem;align-items:flex-start;cursor:pointer;background:#fff;text-align:left;transition:border-color .15s,background .15s}
.bf-rcard:hover{border-color:#c9d6f6}
.bf-rcard.bf-active{border-color:var(--blue-600);background:var(--blue-50)}
.bf-rcard .bf-rd{width:18px;height:18px;border-radius:50%;border:2px solid #d0d5dd;flex-shrink:0;margin-top:.1rem;display:grid;place-items:center}
.bf-rcard.bf-active .bf-rd{border-color:var(--blue-600)}
.bf-rcard.bf-active .bf-rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue-600)}
.bf-rcard b{display:block;font-size:.88rem}
.bf-rcard small{color:var(--text-soft);font-size:.76rem;line-height:1.35}
.bf-picker{margin-top:.8rem;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.bf-picker-head{display:flex;gap:.6rem;align-items:center;padding:.6rem .7rem;background:var(--surface-2);border-bottom:1px solid var(--border)}
.bf-picker-head .bf-inp{flex:1;height:36px}
.bf-picker-list{max-height:210px;overflow-y:auto}
.bf-pick{display:flex;align-items:center;gap:.65rem;padding:.55rem .8rem;border-bottom:1px solid #f2f4f7;cursor:pointer}
.bf-pick:last-child{border-bottom:0}
.bf-pick:hover{background:var(--surface-2)}
.bf-pick input{width:17px;height:17px;accent-color:var(--blue-600)}
.bf-pick small{color:var(--text-faint);margin-left:auto;font-size:.75rem}

.bf-values-bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.bf-values-bar .bf-spacer{flex:1}
.bf-apply-all{display:flex;gap:.4rem;align-items:center}
.bf-money{position:relative;display:flex;align-items:center}
.bf-money span{position:absolute;left:.6rem;font-size:.78rem;color:var(--text-faint);font-weight:600;pointer-events:none}
.bf-money input{padding-left:2rem !important;width:100%}
.bf-money.bf-fixo input{background:var(--blue-50);border-color:#c9d6f6;font-weight:700;color:var(--blue-700)}
.bf-from-fixo{font-size:.62rem;font-weight:700;color:var(--blue-600);display:block;margin-top:.15rem}
.bf-fixo-lbl{display:none;font-size:.66rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:.2rem}
.bf-colab-list{border:1px solid var(--border);border-radius:12px;max-height:380px;overflow-y:auto;background:#fff}
.bf-colab-row{padding:.8rem .9rem;border-bottom:1px solid #eef1f6}
.bf-colab-row:last-child{border-bottom:0}
.bf-colab-main{display:grid;grid-template-columns:minmax(160px,1.2fr) 112px 104px 104px 110px 112px;gap:.6rem;align-items:center}
.bf-colab-name{display:flex;gap:.6rem;align-items:center;min-width:0}
.bf-colab-name b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf-colab-name small{color:var(--text-faint);font-size:.73rem}
.bf-colab-main .bf-inp{height:36px;width:100%}
.bf-recv{font-weight:800;font-size:.92rem}
.bf-recv small{display:block;font-size:.66rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em}
.bf-recv.bf-pos{color:var(--green-700)}.bf-recv.bf-wait{color:var(--text-faint)}
.bf-toggle{display:inline-flex;align-items:center;gap:.45rem;font-size:.76rem;font-weight:700;color:var(--text-soft);cursor:pointer;user-select:none}
.bf-toggle input{display:none}
.bf-toggle .bf-tr{width:34px;height:20px;border-radius:999px;background:#d0d5dd;position:relative;transition:background .15s;flex-shrink:0}
.bf-toggle .bf-tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.bf-toggle input:checked + .bf-tr{background:var(--green-600)}
.bf-toggle input:checked + .bf-tr::after{transform:translateX(14px)}
.bf-col-head{display:grid;grid-template-columns:minmax(160px,1.2fr) 112px 104px 104px 110px 112px;gap:.6rem;padding:.55rem .9rem;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);background:var(--surface-2);border:1px solid var(--border);border-bottom:0;border-radius:12px 12px 0 0}
.bf-col-head + .bf-colab-list{border-radius:0 0 12px 12px}
.bf-next-line{margin-top:.6rem;margin-left:2.6rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.78rem;color:var(--text-soft);background:var(--blue-50);border:1px dashed #c9d6f6;border-radius:10px;padding:.45rem .6rem}
.bf-next-line b{color:var(--blue-700)}
.bf-next-line .bf-money{width:120px}.bf-next-line .bf-money input{height:32px}
.bf-hist-link{border:0;background:transparent;color:var(--blue-600);font-weight:700;font-size:.76rem;padding:0;margin-left:auto;display:inline-flex;gap:.3rem;align-items:center}
.bf-hist-link svg{width:13px;height:13px;transition:transform .15s}
.bf-hist-link.bf-open svg{transform:rotate(180deg)}
.bf-hist-box{margin:.6rem 0 0 2.6rem;border-left:2px solid var(--blue-100);padding-left:.8rem;display:grid;gap:.35rem}
.bf-hist-item{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;color:var(--text-soft)}
.bf-hist-item b{color:var(--text);min-width:110px}
.bf-hist-item .bf-neg{color:var(--red-600)}.bf-hist-item .bf-ok{color:var(--green-700);font-weight:700}
.bf-note{display:flex;gap:.55rem;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.65rem .8rem;font-size:.8rem;color:var(--text-soft);margin-bottom:.9rem}
.bf-note svg{width:16px;height:16px;flex-shrink:0;color:var(--blue-600);margin-top:.05rem}
.bf-err{color:var(--red-600);font-size:.75rem;font-weight:600;margin-top:.3rem;display:none}
.bf-err.bf-show{display:block}
.bf-inp.bf-invalid{border-color:var(--red-500) !important;box-shadow:0 0 0 3px rgba(240,68,56,.12) !important}

table.bf-tbl{width:100%;border-collapse:collapse;font-size:.83rem}
.bf-tbl th{text-align:left;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);padding:.6rem .7rem;background:var(--surface-2);border-bottom:1px solid var(--border);position:sticky;top:0}
.bf-tbl td{padding:.65rem .7rem;border-bottom:1px solid #eef1f6;vertical-align:middle}
.bf-tbl td.bf-num,.bf-tbl th.bf-num{text-align:right;white-space:nowrap}
.bf-tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:400px}
.bf-month-group td{background:#fbfcfe;font-weight:800;color:var(--blue-700);font-size:.78rem}

.bf-confirm-ico{width:52px;height:52px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;margin-bottom:.8rem}
.bf-confirm-ico svg{width:24px;height:24px}
.bf-sum-list{display:grid;gap:.4rem;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:.8rem .9rem;font-size:.84rem}
.bf-sum-list div{display:flex;justify-content:space-between;gap:1rem}
.bf-sum-list span{color:var(--text-soft)}


/* ---------- Visão do colaborador ---------- */
.bf-stat.bf-fixo{background:#fff;border:1.5px solid #c9d6f6}.bf-stat.bf-fixo b{color:var(--blue-700)}

/* ---------- Responsivo ---------- */
@media (max-width:1100px){.bf-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .bf-col-head{display:none}
  .bf-col-head + .bf-colab-list{border-radius:12px}
  .bf-colab-main{grid-template-columns:1fr 1fr;row-gap:.55rem}
  .bf-colab-name{grid-column:1/-1}
  .bf-next-line,.bf-hist-box{margin-left:0}
  .bf-fixo-lbl{display:block}
  .bf-colab-main > div:nth-child(2){grid-column:1/-1}
}
@media (max-width:640px){
  .bf-kpis{grid-template-columns:1fr 1fr;gap:.6rem}
  .bf-kpi-value{font-size:1.15rem}
  .bf-form-grid,.bf-radio-cards{grid-template-columns:1fr}
  .bf-toolbar{width:100%}
  .bf-toolbar > *{flex:1 1 auto}
  .bf-month-nav span{min-width:0;flex:1}
  .bf-overlay{padding:0;align-items:flex-end}
  .bf-modal{max-height:94vh;border-radius:18px 18px 0 0}
  .bf-modal-foot .bf-hint{display:none}
  .bf-modal-foot .bf-btn{flex:1}
  .bf-grid{grid-template-columns:1fr}
}

  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>

/* =========================================================================

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const COMPETENCIA_ATUAL = rhCompetenciaAtual();
const brl = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const addMes = (k, n) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const rotuloMes = (k) => { const [y, m] = k.split("-").map(Number); return `${MESES[m - 1]}/${y}`; };
const iniciais = (n) => avatarInner(n); // foto do colaborador quando houver (js/ui.js)
const corAvatar = (n) => "bf-c" + ((n.split("").reduce((a, c) => a + c.charCodeAt(0), 0) % 5) + 1);
const clone = (o) => JSON.parse(JSON.stringify(o));
const num = (v) => { const n = parseFloat(String(v).replace(/\./g, "").replace(",", ".")); return Number.isFinite(n) ? n : null; };
const fmtInput = (v) => (v === null || v === undefined || v === "" ? "" : Number(v).toFixed(2).replace(".", ","));
function situacaoMes(k) { return k === COMPETENCIA_ATUAL ? { t: "Atual", c: "bf-b-blue" } : k < COMPETENCIA_ATUAL ? { t: "Histórico", c: "bf-b-gray" } : { t: "Próxima", c: "bf-b-orange" }; }

const CATEGORIAS = {

/* =========================================================================
   Dados fictícios
   Estrutura pensada para o banco: o VALOR mora em
   BENEFÍCIO + COLABORADOR + COMPETÊNCIA (aaaa-mm) — nunca só no benefício.
   lancado=true → valor já pago/lançado (recebido = valor − desconto)
   lancado=false → valor previsto (recebido = R$ 0,00 até lançar)
   ========================================================================= */
let COLABS = [];      // colaboradores ativos (id, nome, depto)
let BENEFICIOS = [];  // benefícios no formato unificado (js/rh-beneficios-data.js)
async function recarregar() {
  const [colabs, beneficios] = await Promise.all([
    sb.from("colaboradores").select("id, nome, departamento, status").neq("status", "INATIVO").order("nome").then((r) => { if (r.error) throw r.error; return r.data || []; }),
    rhCarregarBeneficiosUnificados(),
  ]);
  COLABS = colabs.map((c) => ({ id: c.id, nome: c.nome, depto: c.departamento || "" }));
  BENEFICIOS = beneficios;
}

/* =========================================================================
   Regras
   ========================================================================= */
// Valor do colaborador no mês: o que o RH lançou/ajustou para aquele mês;
// se não houver e o mês for o atual ou futuro, usa o VALOR FIXO mensal
// (histórico passado nunca é inventado a partir do fixo).
function lanc(b, id, k) {
  const l = b.valores[id]?.[k];
  if (l) return l;
  const fixo = Number(b.fixos?.[id]) || 0;
  if (fixo > 0 && k >= COMPETENCIA_ATUAL) return { valor: fixo, desconto: 0, lancado: false, doFixo: true };
  return null;
}
// Garante uma entrada real (materializa o fixo) antes de editar/lançar.
function lancReal(b, id, k) {
  b.valores[id] = b.valores[id] || {};
  if (!b.valores[id][k]) { const v = lanc(b, id, k); b.valores[id][k] = v ? { valor: v.valor, desconto: v.desconto, lancado: false } : { valor: 0, desconto: 0, lancado: false }; }
  return b.valores[id][k];
}
const recebido = (l) => (l && l.lancado ? Math.max(0, (l.valor || 0) - (l.desconto || 0)) : 0);
const idsDo = (b) => (b.publico === "TODOS" ? COLABS.map((c) => c.id) : b.colaboradores.filter((id) => COLABS.some((c) => c.id === id)));
const colab = (id) => COLABS.find((c) => c.id === id) || { id, nome: "Colaborador inativo", depto: "" };
function totaisDoMes(b, k) {
  let bruto = 0, desc = 0, rec = 0, previsto = 0, qtd = 0;
  idsDo(b).forEach((id) => {
    const l = lanc(b, id, k); if (!l) return; qtd++;
    bruto += l.valor || 0; desc += l.desconto || 0; rec += recebido(l); if (!l.lancado) previsto += Math.max(0, (l.valor || 0) - (l.desconto || 0));
  });
  return { bruto, desc, rec, previsto, qtd };
}
function pendentesDoMes(b, k) {
  return idsDo(b).filter((id) => { const l = lanc(b, id, k); return l && !l.lancado && (l.valor || 0) > 0; });
}
function mesesDe(b, idFiltro = null) {
  const set = new Set();
  Object.entries(b.valores).forEach(([id, meses]) => { if (!idFiltro || id === idFiltro) Object.keys(meses).forEach((k) => set.add(k)); });
  return [...set].sort().reverse();
}

/* =========================================================================
   Estado da tela
   ========================================================================= */
const ui = { mes: COMPETENCIA_ATUAL, filtroColab: "", filtroStatus: "" };

// Aviso: usa o toast padrão do sistema (showToast, js/ui.js).
function toast(msg, tipo = "success") { showToast(msg, tipo); }
function abrir(id) { const o = document.getElementById(id); o.classList.add("bf-open"); o.setAttribute("aria-hidden", "false"); }
function fechar(id) { const o = document.getElementById(id); o.classList.remove("bf-open"); o.setAttribute("aria-hidden", "true"); }
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => fechar(b.dataset.close)));
document.querySelectorAll(".bf-overlay").forEach((o) => o.addEventListener("mousedown", (e) => { if (e.target === o) fechar(o.id); }));
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; const abertos = [...document.querySelectorAll(".bf-overlay.bf-open")]; if (abertos.length) fechar(abertos[abertos.length - 1].id); });

function monthNavHtml(k, id) {
  const s = situacaoMes(k);
  return `<div class="bf-month-nav"><button type="button" data-mes="${id}" data-d="-1" aria-label="Mês anterior">${I.left}</button><span>${rotuloMes(k)}<small>${s.t === "Atual" ? "Competência atual" : s.t === "Próxima" ? "Próxima competência" : "Histórico"}</small></span><button type="button" data-mes="${id}" data-d="1" aria-label="Próximo mês">${I.right}</button></div>`;
}

/* =========================================================================
   TELA PRINCIPAL (RH)
   ========================================================================= */
function render() { return renderRH(); }

function renderRH() {
  const k = ui.mes;
  const ativos = BENEFICIOS.filter((b) => b.status === "ATIVO");
  let bruto = 0, desc = 0, rec = 0; const atendidos = new Set();
  ativos.forEach((b) => { const t = totaisDoMes(b, k); bruto += t.bruto; desc += t.desc; rec += t.rec; idsDo(b).forEach((id) => { if (lanc(b, id, k)) atendidos.add(id); }); });

  let lista = BENEFICIOS.slice();
  if (ui.filtroStatus) lista = lista.filter((b) => b.status === ui.filtroStatus);
  if (ui.filtroColab) lista = lista.filter((b) => idsDo(b).includes(ui.filtroColab));

  document.getElementById("content").innerHTML = `<div class="bnf">
    <div class="row-between" style="flex-wrap:wrap;gap:1rem;align-items:flex-end;margin-bottom:1.2rem">
      <div><h1 class="page-title">Benefícios</h1><p class="page-sub">Cadastre os benefícios, escolha quem recebe e controle o valor de cada colaborador mês a mês.</p></div>
      <div class="bf-toolbar">
        ${monthNavHtml(k, "main")}
        <select class="bf-inp" id="f-colab" aria-label="Filtrar por colaborador"><option value="">Todos os colaboradores</option>${COLABS.map((c) => `<option value="${c.id}" ${c.id === ui.filtroColab ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select>
        <select class="bf-inp" id="f-status" aria-label="Filtrar por status"><option value="">Todos os status</option><option value="ATIVO" ${ui.filtroStatus === "ATIVO" ? "selected" : ""}>Ativos</option><option value="INATIVO" ${ui.filtroStatus === "INATIVO" ? "selected" : ""}>Inativos</option></select>
        <button type="button" class="bf-btn bf-btn-primary" id="btn-novo">${I.plus}<span>Novo benefício</span></button>
      </div>
    </div>
    <div class="bf-kpis">
      ${kpi("Benefícios ativos", ativos.length, `${BENEFICIOS.length - ativos.length} inativo(s)`, I.heart, "var(--blue-50)", "var(--blue-600)")}
      ${kpi("Colaboradores atendidos", atendidos.size, `em ${rotuloMes(k)}`, I.users, "var(--violet-50)", "var(--violet-600)")}
      ${kpi("Descontos no mês", brl(desc), `de ${brl(bruto)} concedidos`, I.minus, "var(--red-50)", "var(--red-600)")}
      ${kpi("Total recebido", brl(rec), situacaoMes(k).t === "Próxima" ? "ainda não lançado" : "valores já lançados", I.wallet, "var(--green-50)", "var(--green-700)")}
    </div>
    <div class="bf-grid">${lista.length ? lista.map((b) => cardHtml(b, k)).join("") : `<div class="bf-card bf-empty" style="grid-column:1/-1"><div class="bf-e-ico">${I.heart}</div><b>${BENEFICIOS.length ? "Nenhum benefício encontrado" : "Nenhum benefício cadastrado"}</b><p>${BENEFICIOS.length ? "Ajuste os filtros ou clique em “Novo benefício”." : "Clique em “Novo benefício” para começar."}</p></div>`}</div>
  </div>`;
  document.getElementById("btn-novo").addEventListener("click", () => abrirForm(null));
  document.getElementById("f-colab").addEventListener("change", (e) => { ui.filtroColab = e.target.value; renderRH(); });
  document.getElementById("f-status").addEventListener("change", (e) => { ui.filtroStatus = e.target.value; renderRH(); });
  document.querySelectorAll('[data-mes="main"]').forEach((b) => b.addEventListener("click", () => { ui.mes = addMes(ui.mes, Number(b.dataset.d)); renderRH(); }));
  document.querySelectorAll("[data-card]").forEach((c) => c.addEventListener("click", (e) => {
    if (e.target.closest("[data-editar]")) { e.stopPropagation(); abrirForm(c.dataset.card, "valores"); return; }
    if (e.target.closest("[data-excluir]")) { e.stopPropagation(); excluirBeneficio(c.dataset.card); return; }
    if (e.target.closest("[data-lancar]")) { e.stopPropagation(); lancarMes(c.dataset.card, ui.mes); return; }

}

let det = null;
function abrirDetalhes(id) {
  const b = BENEFICIOS.find((x) => x.id === id);

  renderDetalhes();
  abrir("ov-det");
}
function renderDetalhes() {

  document.getElementById("det-sub").textContent = `${(CATEGORIAS[b.categoria] || CATEGORIAS.OUTROS).label} · ${b.publico === "TODOS" ? "Todos os colaboradores" : "Colaboradores específicos"}`;
  document.getElementById("det-tabs").innerHTML = [["valores", "Valores por colaborador"], ["historico", "Histórico"]]
    .map(([k, t]) => `<button type="button" class="${det.aba === k ? "bf-active" : ""}" data-dtab="${k}">${t}</button>`).join("");
  const body = document.getElementById("det-body");
  if (det.aba === "valores") {
    const k = det.mes, prox = addMes(k, 1), t = totaisDoMes(b, k);
    body.innerHTML = `
      <div class="bf-values-bar">${monthNavHtml(k, "det")}<span class="bf-spacer"></span>
        <span class="bf-badge bf-b-gray">Concedido ${brl(t.bruto)}</span><span class="bf-badge bf-b-pink">Descontos ${brl(t.desc)}</span><span class="bf-badge bf-b-green">Recebido ${brl(t.rec)}</span></div>
      <div class="bf-tbl-wrap"><table class="bf-tbl"><thead><tr><th>Colaborador</th><th class="bf-num">Fixo/mês</th><th class="bf-num">Valor</th><th class="bf-num">Desconto</th><th class="bf-num">Recebido</th><th class="bf-num">${rotuloMes(prox)}</th><th></th></tr></thead>
      <tbody>${idsDo(b).map((id) => {
        const c = colab(id), l = lanc(b, id, k), n = lanc(b, id, prox);
        const aberto = det.abertos[id];
        const linhas = aberto ? mesesDe(b, id).map((m) => { const x = b.valores[id][m]; return `<tr><td colspan="7" style="padding:.35rem .7rem .35rem 3.3rem;background:#fbfcfe"><div class="bf-hist-item"><b>${rotuloMes(m)}</b><span>Valor ${brl(x.valor)}</span><span class="${bf-x.desconto ? "bf-neg" : ""}">Desconto ${brl(x.desconto)}</span><span class="${bf-x.lancado ? "bf-ok" : ""}">${x.lancado ? "Recebido " + brl(recebido(x)) : "Previsto (não lançado)"}</span></div></td></tr>`; }).join("") : "";
        return `<tr>
          <td><div class="bf-colab-name"><span class="bf-avatar ${corAvatar(c.nome)}">${iniciais(c.nome)}</span><div><b>${esc(c.nome)}</b><small>${esc(c.depto)}</small></div></div></td>
          <td class="bf-num" style="color:var(--blue-700);font-weight:700">${b.fixos?.[id] ? brl(b.fixos[id]) : "—"}</td>
          <td class="bf-num">${l ? brl(l.valor) : "—"}</td>
          <td class="bf-num" style="${l?.desconto ? "color:var(--red-600)" : ""}">${l ? brl(l.desconto) : "—"}</td>
          <td class="bf-num"><b style="color:${l?.lancado ? "var(--green-700)" : "var(--text-faint)"}">${l ? (l.lancado ? brl(recebido(l)) : "Previsto") : "—"}</b></td>

    body.querySelectorAll("[data-dhist]").forEach((x) => x.addEventListener("click", () => { det.abertos[x.dataset.dhist] = !det.abertos[x.dataset.dhist]; renderDetalhes(); }));
  } else {
    body.innerHTML = historicoHtml(b, det.filtroHist || "");

  tg.className = b.status === "ATIVO" ? "btn btn-danger-ghost" : "btn btn-ghost";
  tg.onclick = async () => {
    const novo = b.status === "ATIVO" ? "INATIVO" : "ATIVO";
    tg.disabled = true;
    try {
      await rhDefinirStatusBeneficio(b.id, novo);
      await recarregar();
      toast(`${b.nome} ${novo === "ATIVO" ? "ativado" : "desativado"}.`, "success");
      renderDetalhes(); renderRH();
    } catch (err) { toast(rhErroMigracao26(err), "error"); }
    finally { tg.disabled = false; }
  };
  const ex = document.getElementById("det-excluir");
  ex.innerHTML = I.trash; ex.onclick = () => excluirBeneficio(b.id);
  const la = document.getElementById("det-lancar");
  const pend = pendentesDoMes(b, det.mes);
  la.style.display = pend.length && det.mes <= COMPETENCIA_ATUAL ? "" : "none";
  la.innerHTML = `${I.send}<span>Lançar ${rotuloMes(det.mes)}</span>`;
  la.onclick = () => lancarMes(b.id, det.mes, () => renderDetalhes());
  const ed = document.getElementById("det-edit");
  ed.innerHTML = `${I.edit}<span>Editar benefício</span>`;
  ed.onclick = () => { fechar("ov-det"); abrirForm(b.id, "valores", det.mes); };
}

function historicoHtml(b, filtro) {
  const meses = mesesDe(b, filtro || null);
  const ids = idsDo(b).filter((id) => !filtro || id === filtro);
  // inclui quem tem histórico mas saiu do público (não some do histórico)
  Object.keys(b.valores).forEach((id) => { if (!ids.includes(id) && (!filtro || id === filtro)) ids.push(id); });
  const rows = meses.map((m) => {
    const itens = ids.filter((id) => b.valores[id]?.[m]);
    if (!itens.length) return "";
    const tot = itens.reduce((a, id) => a + recebido(b.valores[id][m]), 0);
    return `<tr class="bf-month-group"><td colspan="3">${rotuloMes(m)} <span class="bf-badge ${situacaoMes(m).c}" style="margin-left:.4rem">${situacaoMes(m).t}</span></td><td class="bf-num" colspan="2">Recebido no mês: ${brl(tot)}</td></tr>` +
      itens.map((id) => { const l = b.valores[id][m]; const c = colab(id); return `<tr><td>${esc(c.nome)}</td><td class="bf-num">${brl(l.valor)}</td><td class="bf-num" style="${l.desconto ? "color:var(--red-600)" : ""}">${brl(l.desconto)}</td><td class="bf-num"><b style="color:${l.lancado ? "var(--green-700)" : "var(--text-faint)"}">${l.lancado ? brl(recebido(l)) : "—"}</b></td><td>${l.lancado ? '<span class="bf-badge bf-b-green">Lançado</span>' : '<span class="bf-badge bf-b-orange">Previsto</span>'}</td></tr>`; }).join("");
  }).join("");
  return `
    <div class="bf-note">${I.info}<span>O histórico nunca é apagado: cada mês é uma competência separada. Mudar o valor de um mês não altera os meses anteriores.</span></div>
    <div class="bf-values-bar"><select class="bf-inp" id="hist-filtro" style="min-width:240px"><option value="">Todos os colaboradores</option>${Object.keys(b.valores).map((id) => `<option value="${id}" ${id === filtro ? "selected" : ""}>${esc(colab(id).nome)}</option>`).join("")}</select></div>
    ${rows ? `<div class="bf-tbl-wrap"><table class="bf-tbl"><thead><tr><th>Colaborador</th><th class="bf-num">Valor</th><th class="bf-num">Desconto</th><th class="bf-num">Recebido</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="bf-empty"><div class="bf-e-ico">${I.calendar}</div><b>Sem histórico ainda</b><p>Os meses aparecem aqui assim que você informar valores.</p></div>`}`;
}
function wireHistorico(root, onFiltro) { root.querySelector("#hist-filtro")?.addEventListener("change", (e) => onFiltro(e.target.value)); }

    </div>
    ${ids.length ? `
    <div class="bf-note" style="margin-bottom:.8rem">${I.info}<span>${situacaoMes(k).t === "Histórico" ? `Você está editando <b>${rotuloMes(k)}</b> (mês anterior). Os outros meses não mudam.` : `O <b>valor fixo/mês</b> preenche sozinho este mês e os próximos. Para um mês diferente, digite em <b>Valor do mês</b>. Marque <b>Lançado</b> quando for pago — aí o <b>Recebido</b> passa a contar.`}</span></div>
    <div class="bf-col-head"><span>Colaborador</span><span title="Valor que se repete todo mês">Valor fixo/mês</span><span>Valor do mês</span><span>Desconto</span><span>Recebido</span><span>Situação</span></div>
    <div class="bf-colab-list">${ids.map((id) => linhaValor(b, id, k, prox, eAtual)).join("")}</div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;margin-top:.8rem" id="ff-totais">${totaisBadges(t)}</div>`
    : `<div class="bf-empty"><div class="bf-e-ico">${I.users}</div><b>Nenhum colaborador selecionado</b><p>Volte em “Para quem é” e escolha os colaboradores.</p></div>`}`;

  body.querySelectorAll('[data-mes="form"]').forEach((x) => x.addEventListener("click", () => { form.mes = addMes(form.mes, Number(x.dataset.d)); renderForm(); }));
  body.querySelector("#ff-copiar").addEventListener("click", () => {
    let n = 0;
    ids.forEach((id) => { const a = b.valores[id]?.[ant]; if (!a) return; b.valores[id] = b.valores[id] || {}; b.valores[id][k] = { valor: a.valor, desconto: a.desconto, lancado: false }; n++; });
    n ? toast(`Valores de ${rotuloMes(ant)} copiados para ${rotuloMes(k)} (${n}).`) : toast(`Não há valores em ${rotuloMes(ant)} para copiar.`, "error");
    renderForm();
  });
  body.querySelector("#ff-lancar-todos").addEventListener("click", () => {
    const alvo = ids.filter((id) => { const l = lanc(b, id, k); return l && !l.lancado && (l.valor || 0) > 0; });
    if (!alvo.length) { toast(`Nada pendente para lançar em ${rotuloMes(k)}.`, "error"); return; }
    if (k > COMPETENCIA_ATUAL) { toast(`${rotuloMes(k)} ainda não chegou — lance quando o mês começar.`, "error"); return; }
    alvo.forEach((id) => { lancReal(b, id, k).lancado = true; });
    toast(`${alvo.length} valor(es) marcados como lançados. Clique em “Salvar benefício” para confirmar.`, "success");
    renderForm();
  });
  body.querySelector("#ff-aplicar-btn").addEventListener("click", () => {
    const v = num(body.querySelector("#ff-aplicar").value);
    if (v === null || v < 0) { toast("Informe um valor válido para aplicar.", "error"); return; }
    ids.forEach((id) => { b.valores[id] = b.valores[id] || {}; const cur = b.valores[id][k] || { desconto: 0, lancado: false }; b.valores[id][k] = { ...cur, valor: v, desconto: Math.min(cur.desconto || 0, v) }; });
    toast(`${brl(v)} aplicado a ${ids.length} colaborador(es) em ${rotuloMes(k)}.`, "success");
    renderForm();
  });
  body.querySelectorAll("[data-fixo]").forEach((inp) => {
    inp.addEventListener("input", () => {
      const id = inp.dataset.fixo, v = num(inp.value);
      b.fixos = b.fixos || {};
      if (v === null || v <= 0) delete b.fixos[id]; else b.fixos[id] = v;
      // atualiza os campos do mês que ainda seguem o fixo
      const val = body.querySelector(`[data-v="valor"][data-id="${id}"]`);
      if (!b.valores[id]?.[k]) { val.value = ""; val.placeholder = v ? fmtInput(v) : "0,00"; }
      const px = body.querySelector(`[data-v="proximo"][data-id="${id}"]`);
      if (px && !b.valores[id]?.[addMes(k, 1)]) { px.value = ""; px.placeholder = v ? fmtInput(v) : "0,00"; }
      refreshLinha(id);
    });
    inp.addEventListener("blur", () => { const n = num(inp.value); if (n !== null) inp.value = fmtInput(n); });
  });
  body.querySelectorAll("[data-v]").forEach((inp) => {
    inp.addEventListener("input", () => atualizarLinha(inp));
    inp.addEventListener("blur", () => { const n = num(inp.value); if (n !== null) inp.value = fmtInput(n); });
  });
  body.querySelectorAll("[data-lanc]").forEach((x) => x.addEventListener("change", () => {
    const id = x.dataset.lanc; lancReal(b, id, k).lancado = x.checked; refreshLinha(id);
  }));
  body.querySelectorAll("[data-fhist]").forEach((x) => x.addEventListener("click", () => { form.abertos[x.dataset.fhist] = !form.abertos[x.dataset.fhist]; const sc = body.scrollTop; renderForm(); document.getElementById("form-body").scrollTop = sc; }));
}
function linhaValor(b, id, k, prox, eAtual) {
  const c = colab(id), l = lanc(b, id, k), n = lanc(b, id, prox);
  const anterior = b.valores[id]?.[addMes(k, -1)];
  const aberto = form.abertos[id];
  const hist = aberto ? `<div class="bf-hist-box">${mesesDe(b, id).filter((m) => m !== k).map((m) => { const x = b.valores[id][m]; return `<div class="bf-hist-item"><b>${rotuloMes(m)}</b><span>Valor ${brl(x.valor)}</span><span class="${bf-x.desconto ? "bf-neg" : ""}">Desconto ${brl(x.desconto)}</span><span class="${bf-x.lancado ? "bf-ok" : ""}">${x.lancado ? "Recebido " + brl(recebido(x)) : "Previsto"}</span></div>`; }).join("") || '<div class="bf-hist-item">Sem outros meses registrados.</div>'}</div>` : "";
  return `
    <div class="bf-colab-row" data-row="${id}">
      <div class="bf-colab-main">
        <div class="bf-colab-name"><span class="bf-avatar ${corAvatar(c.nome)}">${iniciais(c.nome)}</span><div style="min-width:0"><b>${esc(c.nome)}</b><small>${esc(c.depto)}</small></div></div>
        <div><span class="bf-fixo-lbl">Valor fixo/mês</span><div class="bf-money bf-fixo"><span>R$</span><input class="bf-inp" data-fixo="${id}" inputmode="decimal" aria-label="Valor fixo mensal de ${esc(c.nome)}" value="${fmtInput(b.fixos?.[id])}" placeholder="0,00" title="Valor que se repete todo mês" /></div></div>
        <div class="bf-money"><span>R$</span><input class="bf-inp" data-v="valor" data-id="${id}" inputmode="decimal" aria-label="Valor de ${esc(c.nome)}" value="${l && !l.doFixo ? fmtInput(l.valor) : ""}" placeholder="${l?.doFixo ? fmtInput(l.valor) : anterior ? fmtInput(anterior.valor) : "0,00"}" /></div>
        <div class="bf-money"><span>R$</span><input class="bf-inp" data-v="desconto" data-id="${id}" inputmode="decimal" aria-label="Desconto de ${esc(c.nome)}" value="${l && !l.doFixo ? fmtInput(l.desconto) : ""}" placeholder="0,00" /></div>
        <div class="bf-recv ${l?.lancado ? "bf-pos" : "bf-wait"}" data-recv="${id}">${recvHtml(l)}</div>
        <label class="bf-toggle"><input type="checkbox" data-lanc="${id}" ${l?.lancado ? "checked" : ""} /><span class="bf-tr"></span><span data-lanc-txt="${id}">${l?.lancado ? "Lançado" : "Previsto"}</span></label>
      </div>
      <div class="bf-err" data-err="${id}">O desconto não pode ser maior que o valor.</div>
      ${eAtual ? `<div class="bf-next-line">${I.calendar.replace("<svg", '<svg style="width:14px;height:14px;color:var(--blue-600)"')}<span>Próxima competência <b>${rotuloMes(prox)}</b> — valor a receber:</span><div class="bf-money"><span>R$</span><input class="bf-inp" data-v="proximo" data-id="${id}" inputmode="decimal" value="${n && !n.doFixo ? fmtInput(n.valor) : ""}" placeholder="${n?.doFixo ? fmtInput(n.valor) : fmtInput(l?.valor) || "0,00"}" /></div><button type="button" class="bf-hist-link ${aberto ? "bf-open" : ""}" data-fhist="${id}">Histórico ${I.down}</button></div>` : `<div style="margin:.45rem 0 0 2.6rem"><button type="button" class="bf-hist-link ${aberto ? "bf-open" : ""}" data-fhist="${id}" style="margin-left:0">Ver histórico ${I.down}</button></div>`}
      ${hist}
    </div>`;
}
function recvHtml(l) {
  if (!l || (!l.valor && !l.desconto)) return `<small>Recebido</small>—`;
  if (l.doFixo) return `<small>A receber</small>${brl(l.valor)}<span class="bf-from-fixo">do valor fixo</span>`;
  return l.lancado ? `<small>Recebido</small>${brl(recebido(l))}` : `<small>A receber</small>${brl(Math.max(0, (l.valor || 0) - (l.desconto || 0)))}`;
}
function totaisBadges(t) { return `<span class="bf-badge bf-b-gray">Concedido ${brl(t.bruto)}</span><span class="bf-badge bf-b-pink">Descontos ${brl(t.desc)}</span><span class="bf-badge bf-b-green">Recebido ${brl(t.rec)}</span>`; }
function atualizarLinha(inp) {
  const b = form.b, id = inp.dataset.id, campo = inp.dataset.v;
  const alvo = campo === "proximo" ? addMes(form.mes, 1) : form.mes;
  b.valores[id] = b.valores[id] || {};
  const cur = b.valores[id][alvo] || (() => { const v = lanc(b, id, alvo); return v ? { valor: v.valor, desconto: v.desconto, lancado: false } : { valor: 0, desconto: 0, lancado: false }; })();
  const v = num(inp.value);
  if (campo === "proximo") cur.valor = v ?? 0;
  else cur[campo] = v ?? 0;
  if (inp.value.trim() === "" && campo !== "desconto" && !cur.desconto && !cur.lancado && (campo === "proximo" || campo === "valor")) {
    if (campo === "proximo" || !cur.valor) { delete b.valores[id][alvo]; }
    else b.valores[id][alvo] = cur;
  } else b.valores[id][alvo] = cur;
  refreshLinha(id);
}
function refreshLinha(id) {
  const b = form.b, l = lanc(b, id, form.mes);
  const el = document.querySelector(`[data-recv="${id}"]`); if (!el) return;
  el.innerHTML = recvHtml(l); el.className = `bf-recv ${l?.lancado ? "bf-pos" : "bf-wait"}`;
  document.querySelector(`[data-lanc-txt="${id}"]`).textContent = l?.lancado ? "Lançado" : "Previsto";
  const erro = l && (l.desconto || 0) > (l.valor || 0);
  document.querySelector(`[data-err="${id}"]`).classList.toggle("bf-show", !!erro);
  document.querySelector(`[data-v="desconto"][data-id="${id}"]`).classList.toggle("bf-invalid", !!erro);
  document.getElementById("ff-totais").innerHTML = totaisBadges(totaisDoMes(b, form.mes));
}
function formHistorico(body) {
  body.innerHTML = historicoHtml(form.b, form.filtroHist);
  wireHistorico(body, (v) => { form.filtroHist = v; renderForm(); });
}

/* ---------- Salvar ---------- */
function validar() {
  const b = form.b; form.erros = {};
  if (!b.nome.trim()) { form.erros.nome = true; form.aba = "info"; renderForm(); toast("Informe o nome do benefício.", "error"); return false; }
  if (BENEFICIOS.some((x) => x.id !== b.id && x.nome.trim().toLowerCase() === b.nome.trim().toLowerCase())) { form.erros.nome = true; form.aba = "info"; renderForm(); toast("Já existe um benefício com esse nome.", "error"); return false; }
  if (b.publico === "ESPECIFICO" && !b.colaboradores.length) { form.erros.publico = true; form.aba = "publico"; renderForm(); toast("Selecione pelo menos um colaborador.", "error"); return false; }
  for (const id of idsDo(b)) for (const [m, l] of Object.entries(b.valores[id] || {})) {
    if ((l.desconto || 0) > (l.valor || 0)) { form.aba = "valores"; form.mes = m; renderForm(); refreshLinha(id); toast(`${colab(id).nome}: desconto maior que o valor em ${rotuloMes(m)}.`, "error"); return false; }
  }
  return true;
}
document.getElementById("btn-salvar").addEventListener("click", () => {
  if (!validar()) return;
  const b = form.b, ids = idsDo(b), t = totaisDoMes(b, form.mes), semValor = ids.filter((id) => !lanc(b, id, form.mes)).length;
  document.getElementById("confirm-body").innerHTML = `
    <div class="bf-confirm-ico">${I.checkCircle}</div>
    <h2 style="margin:0 0 .3rem;font-size:1.1rem">${b.id ? "Salvar alterações?" : "Cadastrar benefício?"}</h2>
    <p style="margin:0 0 .9rem;color:var(--text-soft);font-size:.86rem">Confira o resumo antes de confirmar.</p>
    <div class="bf-sum-list">
      <div><span>Benefício</span><b>${esc(b.nome)}</b></div>
      <div><span>Status</span><b style="color:${b.status === "ATIVO" ? "var(--green-700)" : "var(--red-600)"}">${b.status === "ATIVO" ? "Ativo" : "Inativo"}</b></div>
      <div><span>Para quem</span><b>${b.publico === "TODOS" ? "Todos" : "Específicos"} (${ids.length})</b></div>
      <div><span>${rotuloMes(form.mes)} — concedido</span><b>${brl(t.bruto)}</b></div>
      <div><span>Descontos</span><b style="color:var(--red-600)">${brl(t.desc)}</b></div>
    </div>
    ${semValor ? `<p style="margin:.8rem 0 0;font-size:.78rem;color:var(--orange-600);display:flex;gap:.4rem">${I.alert.replace("<svg", '<svg style="width:15px;height:15px;flex-shrink:0"')}<span>${semValor} colaborador(es) ainda sem valor em ${rotuloMes(form.mes)} — dá para preencher depois.</span></p>` : ""}`;
  confirmAcao = salvarConfirmado;
  prepararBotaoConfirmar(`${I.check}<span>${b.id ? "Salvar" : "Cadastrar"}</span>`, false);
  abrir("ov-confirm");
});
let confirmAcao = null;
function prepararBotaoConfirmar(html, perigo) {
  const btn = document.getElementById("btn-confirmar");
  btn.innerHTML = html; btn.disabled = false;
  btn.className = "bf-btn bf-btn-primary";
  btn.style.background = perigo ? "var(--red-600)" : ""; btn.style.boxShadow = perigo ? "0 6px 14px rgba(217,45,32,.2)" : "";
}
function confirmar({ icone, tom = "", titulo, texto, resumo = "", botao, perigo = false, acao }) {
  document.getElementById("confirm-body").innerHTML = `<div class="bf-confirm-ico ${tom ? "bf-" + tom : ""}">${icone}</div><h2 style="margin:0 0 .3rem;font-size:1.1rem">${titulo}</h2><p style="margin:0 0 .9rem;color:var(--text-soft);font-size:.86rem;line-height:1.45">${texto}</p>${resumo}`;
  confirmAcao = acao;
  prepararBotaoConfirmar(botao, perigo);
  abrir("ov-confirm");
}
document.getElementById("btn-confirmar").addEventListener("click", () => {
  const btn = document.getElementById("btn-confirmar");
  btn.disabled = true; btn.innerHTML = "<span>Aguarde...</span>";
  setTimeout(() => { fechar("ov-confirm"); confirmAcao && confirmAcao(); }, 350);
});
async function salvarConfirmado() {
  const b = form.b, novo = !b.id;
  const btnSalvar = document.getElementById("btn-salvar");
  btnSalvar.disabled = true;
  try {
    b.nome = b.nome.trim();
    if (b.publico === "TODOS") b.colaboradores = [];
    const original = novo ? null : BENEFICIOS.find((x) => x.id === b.id) || null;
    b.id = await rhSalvarBeneficioUnificado(b, original);
    await recarregar();
    fechar("ov-form");
    toast(novo ? "Benefício cadastrado com sucesso." : "Benefício atualizado com sucesso.");
    render();
    const card = document.querySelector(`[data-card="${b.id}"]`);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.animate([{ boxShadow: "0 0 0 4px rgba(57,103,232,.35)" }, { boxShadow: "0 0 0 0 rgba(57,103,232,0)" }], { duration: 1400 }); }
  } catch (err) {
    toast(rhErroMigracao26(err), "error");
  } finally {
    btnSalvar.disabled = false;
  }
}

/* ---------- Lançar valores do mês (marca como pagos) ---------- */
function lancarMes(id, k, depois) {
  const b = BENEFICIOS.find((x) => x.id === id);
  const pend = pendentesDoMes(b, k);
  if (!pend.length) { toast(`Nada pendente para lançar em ${rotuloMes(k)}.`, "error"); return; }
  const total = pend.reduce((a, cid) => { const l = lanc(b, cid, k); return a + Math.max(0, l.valor - (l.desconto || 0)); }, 0);
  confirmar({
    icone: I.send, tom: "ok",
    titulo: `Lançar valores de ${rotuloMes(k)}?`,
    texto: `Os valores previstos de <b>${esc(b.nome)}</b> passam a contar como <b>recebidos</b> pelos colaboradores. O mês fica registrado no histórico.`,
    resumo: `<div class="bf-sum-list">${pend.map((cid) => { const l = lanc(b, cid, k); return `<div><span>${esc(colab(cid).nome)}</span><b>${brl(l.valor - (l.desconto || 0))}</b></div>`; }).join("")}<div style="border-top:1px solid var(--border);padding-top:.4rem"><span><b>Total a lançar</b></span><b style="color:var(--green-700)">${brl(total)}</b></div></div>`,
    botao: `${I.check}<span>Lançar ${pend.length} valor${pend.length > 1 ? "es" : ""}</span>`,
    acao: async () => {
      try {
        await rhLancarCompetenciaBeneficio(b.id, k, pend.map((cid) => { const l = lanc(b, cid, k); return { colaboradorId: cid, valor: l.valor, desconto: l.desconto }; }));
        await recarregar();
        toast(`${rotuloMes(k)} lançado: ${brl(total)} para ${pend.length} colaborador(es).`, "success");
        render(); depois && depois();
      } catch (err) { toast(rhErroMigracao26(err), "error"); }
    },
  });
}

/* ---------- Excluir benefício ---------- */
function excluirBeneficio(id) {
  const b = BENEFICIOS.find((x) => x.id === id);
  const meses = mesesDe(b).length;
  confirmar({
    icone: I.trash, tom: "danger", perigo: true,
    titulo: `Excluir “${esc(b.nome)}”?`,
    texto: `O benefício e <b>todo o histórico</b> (${meses} competência${meses === 1 ? "" : "s"}) serão apagados, inclusive da tela dos colaboradores. Esta ação não pode ser desfeita.`,
    resumo: b.status === "ATIVO" ? `<div class="bf-note" style="margin:0">${I.info}<span>Quer só parar de conceder e manter o histórico? Use <b>Desativar</b> nos detalhes do benefício.</span></div>` : "",
    botao: `${I.trash}<span>Excluir benefício</span>`,
    acao: async () => {
      try {
        await rhExcluirBeneficio(id);
        await recarregar();
        fechar("ov-det"); fechar("ov-form"); toast(`${b.nome} excluído.`, "success"); render();
      } catch (err) { toast(rhErroMigracao26(err), "error"); }
    },
  });
}

// ---------------------------------------------------------------------------
// Inicialização
// ---------------------------------------------------------------------------
try {
  await recarregar();
  render();
} catch (err) {
  document.getElementById("content").innerHTML = `<div class="bnf"><div class="bf-card bf-empty"><div class="bf-e-ico">${I.alert}</div><b>Não foi possível carregar os benefícios</b><p>${esc(rhErroMigracao26(err))}</p></div></div>`;
}


})();
  </script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
