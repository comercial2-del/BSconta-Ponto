<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard RH — BSconta+ RH</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
  <link rel="stylesheet" href="../css/dark-mode.css?v=20261006c" />
  <script src="../js/theme.js?v=20261006c"></script>
  <style>
    .dash{display:flex;flex-direction:column;gap:1.1rem}
    .dash-hero{display:grid;grid-template-columns:1fr auto;gap:1rem 1.5rem;align-items:center;padding:1.4rem 1.5rem;border-radius:18px;background:linear-gradient(135deg,#eef3ff 0%,#f6f3ff 55%,#fff 100%);border:1px solid #e3e9fb}
    .dash-hero h1{margin:.35rem 0 .2rem;font-size:1.65rem;font-weight:800;letter-spacing:-.02em;color:#101828}
    .dash-hero p{margin:0;color:#475467;font-size:.9rem}
    .dash-hero p b{color:#101828}
    .dash-date{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:800;color:#2f5bea;text-transform:uppercase;letter-spacing:.05em}
    .dash-date svg{width:14px;height:14px}
    .dash-quick{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6rem}
    .dash-quick-a{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;border-radius:12px;background:rgba(255,255,255,.85);border:1px solid #e7ecf5;color:#344054;font-weight:700;font-size:.82rem;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
    .dash-quick-a:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,24,40,.08);border-color:#c7d4fb}
    .dash-ic{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px}
    .dash-ic svg{width:16px;height:16px}
    .dash-ic.indigo{background:#eef2ff;color:#4338ca}.dash-ic.teal{background:#ecfdf8;color:#0f766e}.dash-ic.violet{background:#f4f0ff;color:#6d28d9}.dash-ic.amber{background:#fff8eb;color:#b45309}.dash-ic.green{background:#ecfdf3;color:#067647}.dash-ic.rose{background:#fff1f3;color:#c01048}
    .dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.1rem;align-items:start}
    .dash-col{display:flex;flex-direction:column;gap:1.1rem}
    .dash-card{padding:1.1rem 1.2rem}
    .dash-card-h{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.9rem}
    .dash-card-h h2{display:flex;align-items:center;gap:.55rem;margin:0;font-size:.98rem}
    .dash-card-h .card-link{display:inline-flex;align-items:center;gap:.15rem;white-space:nowrap}
    .dash-card-h .card-link svg{width:14px;height:14px}
    .dash-count{display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.4rem;padding:0 .4rem;border-radius:999px;background:#f2f4f7;color:#475467;font-size:.72rem;font-weight:800}
    .dash-ponto-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
    .dash-num{padding:.75rem .9rem;border-radius:12px;border:1px solid #eef0f4}
    .dash-num b{display:block;font-size:1.6rem;line-height:1.1;font-weight:800}
    .dash-num span{font-size:.75rem;font-weight:700;color:#667085}
    .dash-num.green{background:#f3fcf7}.dash-num.green b{color:#067647}
    .dash-num.amber{background:#fffaf0}.dash-num.amber b{color:#b45309}
    .dash-num.red{background:#fff6f5}.dash-num.red b{color:#d92d20}
    .dash-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#f2f4f7;margin:.9rem 0 .75rem}
    .dash-bar i{display:block;height:100%}
    .dash-bar i.green{background:#12b76a}.dash-bar i.amber{background:#f79009}.dash-bar i.red{background:#f04438}
    .dash-chips{display:flex;flex-wrap:wrap;gap:.45rem}
    .dash-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .6rem;border-radius:999px;background:#f8fafc;border:1px solid #eef0f4;font-size:.76rem;font-weight:600;color:#475467}
    .dash-chip svg{width:13px;height:13px}.dash-chip b{color:#101828}.dash-chip.muted{color:#98a2b3}
    .dash-attn{margin-top:1rem;padding-top:.8rem;border-top:1px dashed #e4e7ec}
    .dash-attn-t{margin:0 0 .35rem;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#98a2b3}
    .dash-list{display:flex;flex-direction:column}
    .dash-person{display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid #f2f4f7}
    .dash-person:last-child{border-bottom:0}
    .dash-person-n{flex:1;min-width:0;font-weight:600;font-size:.85rem;color:#1d2939;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dash-person-n small{display:block;font-weight:500;font-size:.74rem;color:#98a2b3}
    .dash-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
    .dash-pill svg{width:12px;height:12px}
    .dash-pill.red{background:#fef3f2;color:#d92d20}.dash-pill.amber{background:#fffaeb;color:#b54708}.dash-pill.rose{background:#fff1f3;color:#c01048}.dash-pill.teal{background:#ecfdf8;color:#0f766e}
    .dash-req{display:flex;align-items:center;gap:.7rem;padding:.65rem .55rem;margin:0 -.55rem;border-radius:10px;text-decoration:none;color:inherit;border-bottom:1px solid #f2f4f7}
    .dash-req:last-child{border-bottom:0}
    .dash-req:hover{background:#f8fafc}
    .dash-req-main{flex:1;min-width:0}
    .dash-req-main b{display:block;font-size:.85rem;color:#1d2939;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dash-req-main small{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem;font-size:.74rem;color:#98a2b3;margin-top:.15rem}
    .dash-cat{display:inline-flex;align-items:center;gap:.25rem;font-weight:700}
    .dash-cat svg{width:12px;height:12px}
    .dash-cat.amber{color:#b45309}.dash-cat.teal{color:#0f766e}.dash-cat.indigo{color:#4338ca}.dash-cat.violet{color:#6d28d9}
    .dash-req-go{display:inline-flex;align-items:center;gap:.1rem;font-size:.76rem;font-weight:700;color:#2f5bea;white-space:nowrap}
    .dash-req-go svg{width:14px;height:14px}
    .dash-depts{display:flex;flex-direction:column;gap:.6rem}
    .dash-dept{display:grid;grid-template-columns:minmax(0,9rem) 1fr 1.6rem;align-items:center;gap:.6rem;font-size:.82rem}
    .dash-dept-n{font-weight:600;color:#344054;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dash-dept-bar{height:8px;border-radius:999px;background:#f2f4f7;overflow:hidden}
    .dash-dept-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4f7cff,#2f5bea)}
    .dash-dept b{text-align:right;color:#101828}
    .dash-empty{display:flex;align-items:center;gap:.55rem;padding:.9rem;border-radius:12px;background:#f9fafb;color:#98a2b3;font-size:.82rem;font-weight:600}
    .dash-empty svg{width:18px;height:18px;flex:none}
    html[data-theme="dark"] .dash-hero{background:linear-gradient(135deg,rgba(47,91,234,.16),rgba(124,58,237,.08) 60%,transparent);border-color:var(--border)}
    html[data-theme="dark"] .dash-hero h1,html[data-theme="dark"] .dash-hero p b,html[data-theme="dark"] .dash-person-n,html[data-theme="dark"] .dash-req-main b,html[data-theme="dark"] .dash-dept b,html[data-theme="dark"] .dash-chip b{color:#f2f4f7}
    html[data-theme="dark"] .dash-hero p,html[data-theme="dark"] .dash-dept-n{color:#cbd5e1}
    html[data-theme="dark"] .dash-quick-a{background:rgba(255,255,255,.04);border-color:var(--border);color:#e4e7ec}
    html[data-theme="dark"] .dash-num,html[data-theme="dark"] .dash-chip,html[data-theme="dark"] .dash-empty{background:rgba(255,255,255,.04);border-color:var(--border)}
    html[data-theme="dark"] .dash-bar,html[data-theme="dark"] .dash-dept-bar,html[data-theme="dark"] .dash-count{background:rgba(255,255,255,.08);color:#cbd5e1}
    html[data-theme="dark"] .dash-person,html[data-theme="dark"] .dash-req{border-bottom-color:var(--border)}
    html[data-theme="dark"] .dash-req:hover{background:rgba(255,255,255,.04)}
    html[data-theme="dark"] .dash-ic{filter:saturate(.9) brightness(.95)}
    @media (max-width:1100px){.dash-quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:980px){.dash-grid{grid-template-columns:1fr}}
    @media (max-width:640px){.dash-hero{grid-template-columns:1fr;padding:1.1rem}.dash-hero h1{font-size:1.35rem}.dash-quick{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-req-go{display:none}}
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js?v=20261013a"></script>
  <script src="../js/ui.js?v=20261013b"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/rh-supabase-auth.js"></script>
  <script src="../js/rh-ponto-data.js?v=20261013a"></script>
  <script src="../js/rh-ferias-data.js"></script>
  <script src="../js/rh-solicitacoes-data.js"></script>
  <script src="../js/rh-historia-data.js?v=20261013a"></script>
  <script>
(async function () {
    const session = await requireRoleReal("RH");
    if (!session) return;
    function firstName(n) { return (n || "").split(" ")[0]; }

    // Dados agregados reais (rh.colaboradores, rh.ponto_registros,
    // rh.ferias_solicitacoes, rh.solicitacoes) — substitui DEMO.rhKpis /
    // DEMO.rhDepartamentos / DEMO.rhPontoHoje / DEMO.rhAniversariantes /
    // DEMO.rhSolicitacoesPendentes / DEMO.rhFeriasProximas, que eram só
    // dados fixos em memória (js/demo-data.js).
    let dash = {
      totalColaboradores: 0, ativos: 0, afastados: 0, feriasProximas: 0, solicitacoesPendentes: 0,
      departamentos: [], aniversariantes: [], pontoHoje: [], solicitacoesPendentesRows: [], feriasProximasRows: [], avisosFerias: [],
    };

    async function refrescarDashboard() {
      const hojeIso = rhTodayIso();
      const mesAtual = new Date().getMonth() + 1;
      const em30dias = new Date();
      em30dias.setDate(em30dias.getDate() + 30);
      const em30diasIso = em30dias.toISOString().slice(0, 10);

      const [{ data: colabRows, error: e1 }, { data: pontoHojeRows, error: e2 }, feriasRH, solicitacoesRH, { data: dadosPessoaisRows, error: e3 }] = await Promise.all([
        sb.from("colaboradores").select(`id, nome, departamento, status, admissao, ferias_aviso_ignorar_ate, ${RH_COLABORADOR_JORNADA_COLS}`).order("nome"),
        sb.from("ponto_registros").select("colaborador_id, entrada, local").eq("data", hojeIso),
        rhCarregarFeriasRH(),
        rhCarregarSolicitacoesRH(),
        // Data de nascimento é cifrada no banco (ver
        // db/supabase/19_criptografia_dados_pessoais.sql). Como quem está
        // vendo este dashboard é RH/RH_ADMIN, chamar sem colaborador_id
        // devolve a data de nascimento decifrada de TODOS os colaboradores,
        // só para montar o card de aniversariantes.
        sb.rpc("colaboradores_dados_pessoais"),
      ]);
      if (e1) throw e1;
      if (e2) throw e2;
      if (e3) throw e3;

      const colaboradores = colabRows || [];
      dash.totalColaboradores = colaboradores.length;
      dash.ativos = colaboradores.filter((c) => c.status === "ATIVO").length;
      dash.afastados = colaboradores.filter((c) => c.status === "AFASTADO").length;

      // Lembrete de férias (mesma regra de rh/ferias.html): colaboradores
      // ativos cujo período aquisitivo está a até 60 dias de vencer (ou já
      // venceu) e que ainda não têm férias programadas para esse período.
      dash.avisosFerias = colaboradores
        .filter((c) => c.status !== "INATIVO")
        .map((c) => rhAvisoFeriasColaborador(c, feriasRH.filter((f) => f.colaboradorId === c.id), hojeIso))
        .filter(Boolean)
        .sort((a, b) => a.diasParaVencer - b.diasParaVencer);

      const porDepto = {};
      colaboradores.forEach((c) => { const d = c.departamento || "Sem departamento"; porDepto[d] = (porDepto[d] || 0) + 1; });
      dash.departamentos = Object.entries(porDepto).map(([nome, qtd]) => ({ nome, qtd })).sort((a, b) => b.qtd - a.qtd);

      const nascimentoPorId = new Map((dadosPessoaisRows || []).map((d) => [d.id, d.data_nascimento]));
      dash.aniversariantes = colaboradores
        .map((c) => ({ nome: c.nome, nascimento: nascimentoPorId.get(c.id) || null }))
        .filter((c) => c.nascimento && Number(c.nascimento.slice(5, 7)) === mesAtual)
        .map((c) => ({ nome: c.nome, data: fmtDate(c.nascimento).slice(0, 5) }))
        .sort((a, b) => a.data.localeCompare(b.data));

      // Classificação real por pessoa (jornada configurada em
      // rh/colaboradores.html) — substitui o "h*60+m-8*60>5" fixo que
      // assumia 08:00 pra todo mundo, e agora respeita dia de descanso
      // (dias_trabalho) em vez de contar como falta.
      const pontoPorId = {};
      (pontoHojeRows || []).forEach((r) => { pontoPorId[r.colaborador_id] = r; });
      // Abonos aprovados de hoje (migração 22): quem está abonado não conta como falta.
      let abonosHoje = [];
      try { abonosHoje = await rhListarAbonos({ status: "APROVADO", inicio: hojeIso, fim: hojeIso }); } catch (e) { abonosHoje = []; }
      dash.pontoHoje = colaboradores
        .filter((c) => c.status !== "INATIVO")
        .map((c) => {
          const row = pontoPorId[c.id];
          const entrada = row ? rhHoraCurta(row.entrada) : null;
          const config = rhConfigJornada(c);
          let status = c.status === "AFASTADO" ? "afastado" : rhClassificarStatusHoje({ entradaReal: entrada, config, dataIso: hojeIso });
          if (status === "falta" && rhAbonoDoDia(abonosHoje, c.id, hojeIso)) status = "abonado";
          return { nome: c.nome, status, local: row?.local || null };
        });

      dash.feriasProximasRows = feriasRH
        .filter((f) => f.status === "APROVADA" && f.inicio >= hojeIso && f.inicio <= em30diasIso)
        .sort((a, b) => (a.inicio < b.inicio ? -1 : 1));
      dash.feriasProximas = dash.feriasProximasRows.length;

      dash.solicitacoesPendentesRows = solicitacoesRH.filter((s) => s.status === "PENDENTE");
      dash.solicitacoesPendentes = dash.solicitacoesPendentesRows.length;
    }

    function render() {
      const k = dash;
      const maxDept = Math.max(1, ...dash.departamentos.map((d) => d.qtd));
      const pontoRows = dash.pontoHoje;
      const esperados = pontoRows.filter((r) => ["completo", "atraso", "falta"].includes(r.status));
      const qtd = (st) => pontoRows.filter((r) => r.status === st).length;
      const emDia = qtd("completo"), atraso = qtd("atraso"), falta = qtd("falta");
      const homeOffice = pontoRows.filter((r) => r.local === "HOME_OFFICE").length;
      const presencial = pontoRows.filter((r) => r.local === "PRESENCIAL").length;
      const totalEsp = Math.max(1, esperados.length);
      const pct = (n) => Math.round((n / totalEsp) * 100);
      const atencao = pontoRows.filter((r) => r.status === "atraso" || r.status === "falta");

      const hoje = new Date();
      const dataLonga = hoje.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
      const hora = hoje.getHours();
      const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

      const catIcon = (c) => /ponto/i.test(c) ? ICONS.clock : /f[ée]rias/i.test(c) ? ICONS.palmTree : /document/i.test(c) ? ICONS.fileText : ICONS.messageSquare;
      const catTone = (c) => /ponto/i.test(c) ? "amber" : /f[ée]rias/i.test(c) ? "teal" : /document/i.test(c) ? "indigo" : "violet";
      const diasAtras = (iso) => { const d = Math.round((new Date(rhTodayIso() + "T12:00:00") - new Date(iso + "T12:00:00")) / 86400000); return d <= 0 ? "hoje" : d === 1 ? "ontem" : `há ${d} dias`; };
      const vazio = (icon, txt) => `<div class="dash-empty">${icon}<span>${txt}</span></div>`;

      document.getElementById("content").innerHTML = `
        <div class="dash">
          <section class="dash-hero">
            <div class="dash-hero-txt">
              <span class="dash-date">${ICONS.calendar}${esc(dataLonga.charAt(0).toUpperCase() + dataLonga.slice(1))}</span>
              <h1>${saudacao}, ${esc(firstName(session.name))} 👋</h1>
              <p>Visão geral da equipe BSconta+ · <b>${k.ativos}</b> de ${k.totalColaboradores} colaboradores ativos</p>
            </div>
            <div class="dash-hero-actions">
              <a href="colaboradores.html?novo=1" class="btn-primary auto">${ICONS.plus}<span>Novo colaborador</span></a>
            </div>
            <nav class="dash-quick">
              ${quick("ponto.html", ICONS.clock, "Jornada / Ponto", "indigo")}
              ${quick("ferias.html", ICONS.palmTree, "Aprovar férias", "teal")}
              ${quick("comunicados.html", ICONS.megaphone, "Novo comunicado", "violet")}
              ${quick("documentos.html", ICONS.fileText, "Enviar documento", "amber")}
              ${quick("relatorios.html", ICONS.reports, "Relatórios", "green")}
            </nav>
          </section>

          <div id="kpi-grid"></div>

          <div class="dash-grid">
            <div class="dash-col">
              <section class="card dash-card">
                <header class="dash-card-h">
                  <h2><span class="dash-ic indigo">${ICONS.clock}</span>Jornada de hoje</h2>
                  <a href="ponto.html" class="card-link">Ver detalhes ${ICONS.chevronRight}</a>
                </header>
                <div class="dash-ponto">
                  <div class="dash-ponto-nums">
                    <div class="dash-num green"><b>${emDia}</b><span>Em dia</span></div>
                    <div class="dash-num amber"><b>${atraso}</b><span>Atraso</span></div>
                    <div class="dash-num red"><b>${falta}</b><span>Falta</span></div>
                  </div>
                  <div class="dash-bar" title="${emDia} em dia · ${atraso} atraso · ${falta} falta">
                    <i class="green" style="width:${pct(emDia)}%"></i><i class="amber" style="width:${pct(atraso)}%"></i><i class="red" style="width:${pct(falta)}%"></i>
                  </div>
                  <div class="dash-chips">
                    <span class="dash-chip">${ICONS.mapPin}Presencial <b>${presencial}</b></span>
                    <span class="dash-chip">${ICONS.home}Home office <b>${homeOffice}</b></span>
                    <span class="dash-chip muted">${esperados.length} esperados hoje</span>
                  </div>
                  ${atencao.length ? `
                  <div class="dash-attn">
                    <p class="dash-attn-t">Precisam de atenção</p>
                    ${atencao.map((r) => `
                      <div class="dash-person">
                        <span class="avatar avatar-sm ${avatarColorClass(r.nome)}">${avatarInner(r.nome)}</span>
                        <span class="dash-person-n">${esc(r.nome)}</span>
                        <span class="dash-pill ${r.status === "falta" ? "red" : "amber"}">${r.status === "falta" ? "Falta" : "Atraso"}</span>
                      </div>`).join("")}
                  </div>` : ""}
                </div>
              </section>

              <section class="card dash-card">
                <header class="dash-card-h">
                  <h2><span class="dash-ic violet">${ICONS.messageSquare}</span>Solicitações pendentes ${k.solicitacoesPendentes ? `<span class="dash-count">${k.solicitacoesPendentes}</span>` : ""}</h2>
                  <a href="solicitacoes.html" class="card-link">Ver todas ${ICONS.chevronRight}</a>
                </header>
                ${dash.solicitacoesPendentesRows.length
                  ? `<div class="dash-list">${dash.solicitacoesPendentesRows.slice(0, 6).map((s) => `
                    <a href="solicitacoes.html" class="dash-req">
                      <span class="avatar avatar-sm ${avatarColorClass(s.colaborador)}">${avatarInner(s.colaborador)}</span>
                      <span class="dash-req-main"><b>${esc(s.colaborador)}</b><small><span class="dash-cat ${catTone(s.categoria)}">${catIcon(s.categoria)}${esc(s.categoria)}</span> · ${fmtDate(s.data)} · ${diasAtras(s.data)}</small></span>
                      <span class="dash-req-go">Resolver ${ICONS.chevronRight}</span>
                    </a>`).join("")}</div>`
                  : vazio(ICONS.checkCircle, "Nenhuma solicitação pendente. Tudo em dia!")}
              </section>
            </div>

            <div class="dash-col">
              <section class="card dash-card">
                <header class="dash-card-h">
                  <h2><span class="dash-ic rose">${ICONS.cake}</span>Aniversariantes do mês</h2>
                  <span class="dash-count">${dash.aniversariantes.length}</span>
                </header>
                ${dash.aniversariantes.length
                  ? `<div class="dash-list">${dash.aniversariantes.map((a) => `
                    <div class="dash-person">
                      <span class="avatar avatar-sm ${avatarColorClass(a.nome)}">${avatarInner(a.nome)}</span>
                      <span class="dash-person-n">${esc(a.nome)}</span>
                      <span class="dash-pill rose">${ICONS.cake}${a.data}</span>
                    </div>`).join("")}</div>`
                  : vazio(ICONS.cake, "Nenhum aniversário este mês.")}
              </section>

              <section class="card dash-card">
                <header class="dash-card-h">
                  <h2><span class="dash-ic teal">${ICONS.palmTree}</span>Férias nos próximos 30 dias</h2>
                  <a href="ferias.html" class="card-link">Ver ${ICONS.chevronRight}</a>
                </header>
                ${dash.feriasProximasRows.length
                  ? `<div class="dash-list">${dash.feriasProximasRows.slice(0, 5).map((v) => `
                    <div class="dash-person">
                      <span class="avatar avatar-sm ${avatarColorClass(v.colaborador)}">${avatarInner(v.colaborador)}</span>
                      <span class="dash-person-n">${esc(v.colaborador)}<small>${fmtDate(v.inicio)} a ${fmtDate(v.fim)}</small></span>
                      <span class="dash-pill teal">${v.dias} dias</span>
                    </div>`).join("")}</div>`
                  : vazio(ICONS.palmTree, "Nenhuma férias aprovada para os próximos 30 dias.")}
              </section>

              <section class="card dash-card">
                <header class="dash-card-h">
                  <h2><span class="dash-ic green">${ICONS.building}</span>Equipe por departamento</h2>
                  <a href="colaboradores.html" class="card-link">Ver ${ICONS.chevronRight}</a>
                </header>
                ${dash.departamentos.length
                  ? `<div class="dash-depts">${dash.departamentos.map((d) => `
                    <div class="dash-dept">
                      <span class="dash-dept-n">${esc(d.nome)}</span>
                      <span class="dash-dept-bar"><i style="width:${Math.max(6, (d.qtd / maxDept) * 100)}%"></i></span>
                      <b>${d.qtd}</b>
                    </div>`).join("")}</div>`
                  : vazio(ICONS.users, "Nenhum colaborador cadastrado ainda.")}
              </section>
            </div>
          </div>
        </div>
      `;

      renderKpiGrid(document.getElementById("kpi-grid"), [
        { label: "Total de colaboradores", value: k.totalColaboradores, tone: "indigo", icon: ICONS.users },
        { label: "Ativos", value: k.ativos, tone: "green", icon: ICONS.checkCircle },
        { label: "Afastados", value: k.afastados, tone: "amber", icon: ICONS.alertCircle },
        { label: "Férias próximas (30 dias)", value: k.feriasProximas, tone: "teal", icon: ICONS.palmTree },
        { label: "Solicitações pendentes", value: k.solicitacoesPendentes, tone: "violet", icon: ICONS.messageSquare },
      ], true);
    }

    function quick(href, icon, label, tone) {
      return `<a href="${href}" class="dash-quick-a"><span class="dash-ic ${tone}">${icon}</span><span>${label}</span></a>`;
    }

    if (session) {
      renderShell(session, withBadges(NAV_RH, await rhNavBadges()));
      try {
        await refrescarDashboard();
      } catch (err) {
        rhShowFatalError(rhMensagemErroSupabase(err));
        return;
      }
      const notificacoes = [];
      if (dash.solicitacoesPendentes > 0) {
        notificacoes.push({ text: `${dash.solicitacoesPendentes} solicitação${dash.solicitacoesPendentes === 1 ? "" : "ões"} aguardando análise.`, time: "agora", unread: true, icon: ICONS.messageSquare });
      }
      if (dash.afastados > 0) {
        notificacoes.push({ text: `${dash.afastados} colaborador${dash.afastados === 1 ? "" : "es"} afastado${dash.afastados === 1 ? "" : "s"} atualmente.`, time: "agora", unread: false, icon: ICONS.alertCircle });
      }
      dash.avisosFerias.forEach((a) => {
        notificacoes.push({
          text: `<strong>${esc(a.colaboradorNome)}</strong> precisa programar férias — período aquisitivo de ${fmtDate(a.periodoAquisitivoInicio)} a ${fmtDate(a.periodoAquisitivoFim)}.`,
          time: a.vencido ? `Vencido há ${Math.abs(a.diasParaVencer)} dia(s)` : `Vence em ${a.diasParaVencer} dia(s)`,
          unread: true,
          icon: ICONS.palmTree,
        });
      });
      renderTopHeader(document.getElementById("top-header"), session, { notifications: notificacoes });
      render();
    }
  
})();
</script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
