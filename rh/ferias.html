<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Férias — BSconta+ RH</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
  <style>
    .report-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
    .report-list li{font-size:.85rem;line-height:1.55;padding:.6rem .8rem;border-radius:10px;background:rgba(255,255,255,.6);border:1px solid rgba(217,119,6,.18)}
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-lancar">
    <div class="modal" style="max-width:620px">
      <div class="modal-header"><h3>Lançar férias</h3><button class="modal-close" data-close-modal>${''}</button></div>
      <form id="form-lancar">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field full">
              <label>Colaborador</label>
              <select id="lancar-colaborador" required></select>
            </div>
            <div class="field full">
              <label>Tipo de lançamento</label>
              <div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.3rem">
                <label style="display:flex;align-items:flex-start;gap:.5rem;font-weight:400;cursor:pointer">
                  <input type="radio" name="lancar-tipo" value="unico" checked style="margin-top:.2rem" />
                  <span>Período único — informo a data de início e fim.</span>
                </label>
                <label style="display:flex;align-items:flex-start;gap:.5rem;font-weight:400;cursor:pointer">
                  <input type="radio" name="lancar-tipo" value="fracionado" style="margin-top:.2rem" />
                  <span>Férias fracionadas — dividir em blocos de 15 em 15 dias (2 a 4 períodos).</span>
                </label>
              </div>
            </div>
          </div>
          <div id="lancar-unico-wrap" class="form-grid" style="margin-top:.9rem">
            <div class="field"><label>Data de início</label><input type="date" id="lancar-inicio" /></div>
            <div class="field"><label>Data de fim</label><input type="date" id="lancar-fim" /></div>
          </div>
          <div id="lancar-fracionado-wrap" style="display:none;margin-top:.9rem">
            <div class="field" style="max-width:220px">
              <label>Quantidade de períodos</label>
              <select id="lancar-qtd-blocos">
                <option value="2">2 períodos (30 dias)</option>
                <option value="3">3 períodos (45 dias)</option>
                <option value="4">4 períodos (60 dias)</option>
              </select>
            </div>
            <div id="lancar-blocos-list" style="display:flex;flex-direction:column;gap:.6rem;margin-top:.8rem"></div>
            <p class="hint" style="margin-top:.4rem">Cada bloco tem 15 dias corridos — ajuste a data de início de cada um; a data de fim é calculada automaticamente.</p>
          </div>
          <p class="field-hint" id="lancar-resumo" style="margin-top:.9rem"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-close-modal>Cancelar</button>
          <button type="submit" class="btn-primary auto" id="lancar-btn-submit">Lançar férias</button>
        </div>
      </form>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/rh-supabase-auth.js"></script>
  <script src="../js/rh-ferias-data.js"></script>
  <script src="../js/rh-historia-data.js"></script>
  <script>
(async function () {
    const session = await requireRoleReal("RH");
    if (!session) return;
    let filtro = "PENDENTES";
    let cacheFerias = [];
    let colaboradoresAtivos = [];
    let avisosFerias = [];

    async function refrescarFerias() {
      cacheFerias = await rhCarregarFeriasRH();
    }

    async function carregarColaboradoresAtivos() {
      const { data, error } = await sb.from("colaboradores").select("id, nome, admissao").neq("status", "INATIVO").order("nome");
      if (error) throw error;
      colaboradoresAtivos = data || [];
    }

    function recalcularAvisosFerias() {
      const hojeIso = rhTodayIso();
      avisosFerias = colaboradoresAtivos
        .map((c) => rhAvisoFeriasColaborador(c, cacheFerias.filter((f) => f.colaboradorId === c.id), hojeIso))
        .filter(Boolean)
        .sort((a, b) => a.diasParaVencer - b.diasParaVencer);
      atualizarNotificacoes();
    }

    // Sino de notificações do topo (renderTopHeader) — um item por
    // colaborador que precisa programar férias (mesmos dados do banner
    // avisosHtml abaixo, só que no formato que o sino espera).
    function atualizarNotificacoes() {
      const notifications = avisosFerias.map((a) => ({
        text: `<strong>${esc(a.colaboradorNome)}</strong> precisa programar férias — período aquisitivo de ${fmtDate(a.periodoAquisitivoInicio)} a ${fmtDate(a.periodoAquisitivoFim)}.`,
        time: a.vencido ? `Vencido há ${Math.abs(a.diasParaVencer)} dia(s)` : `Vence em ${a.diasParaVencer} dia(s)`,
        unread: true,
        icon: ICONS.palmTree,
      }));
      renderTopHeader(document.getElementById("top-header"), session, { notifications });
    }

    function mesAtualIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function render() {
      const pendentesCount = cacheFerias.filter((f) => f.status === "PENDENTE" || f.status === "EM_ANALISE").length;
      const preAprovadasCount = cacheFerias.filter((f) => f.status === "PRE_APROVADA").length;
      const aprovadasCount = cacheFerias.filter((f) => f.status === "APROVADA").length;
      const recusadasCount = cacheFerias.filter((f) => f.status === "RECUSADA").length;

      document.getElementById("content").innerHTML = `
        <div class="space-y">
          <div class="row-between">
            <div>
              <h1 class="page-title">Gestão de Férias</h1>
              <p class="page-sub">Analise e acompanhe as solicitações de férias de toda a equipe.</p>
            </div>
            <button type="button" class="btn-primary auto" id="btn-lancar">${ICONS.plus}<span>Lançar férias</span></button>
          </div>


          <div id="kpi-grid"></div>

          <div class="card card-p">
            <div class="row-between" style="margin-bottom:1rem">
              <div class="period-buttons">
                <button type="button" data-f="PENDENTES" class="active">Pendentes</button>
                <button type="button" data-f="PRE_APROVADAS">Pré-aprovadas${preAprovadasCount ? ` (${preAprovadasCount})` : ""}</button>
                <button type="button" data-f="APROVADAS">Aprovadas</button>
                <button type="button" data-f="RECUSADAS">Recusadas</button>
                <button type="button" data-f="TODAS">Todas</button>
              </div>
            </div>
            <div id="view-wrap"></div>
          </div>
        </div>
      `;

      document.getElementById("btn-lancar").addEventListener("click", () => abrirModalLancar());

      renderKpiGrid(document.getElementById("kpi-grid"), [
        { label: "Aguardando análise", value: pendentesCount, tone: "amber", icon: ICONS.messageSquare },
        { label: "Pré-aprovadas", value: preAprovadasCount, tone: "violet", icon: ICONS.hourglass },
        { label: "Aprovadas (período atual)", value: aprovadasCount, tone: "green", icon: ICONS.checkCircle },
        { label: "Recusadas", value: recusadasCount, tone: "red", icon: ICONS.xCircle },
        { label: "Dias de férias no mês", value: cacheFerias.filter((f) => f.inicio.startsWith(mesAtualIso()) || f.fim.startsWith(mesAtualIso())).reduce((a, f) => a + f.dias, 0), tone: "indigo", icon: ICONS.palmTree },
      ], true);

      document.querySelectorAll("[data-f]").forEach((btn) =>
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-f]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          filtro = btn.dataset.f;
          renderView();
        })
      );
      renderView();
    }

    // ------------------------------------------------------------------
    // Lembrete de férias — banner com os colaboradores cujo período
    // aquisitivo (admissão + 1 ano) está a até 60 dias de vencer, ou já
    // vencido, e que ainda não têm férias programadas para esse período.
    // ------------------------------------------------------------------
    function avisosHtml() {
      if (!avisosFerias.length) return "";
      return `
        <div class="card card-p" style="border-color:rgba(245,158,11,.35);background:var(--amber-50)">
          <div class="row-between" style="align-items:flex-start;margin-bottom:.6rem">
            <div style="display:flex;align-items:center;gap:.6rem">
              <span style="color:var(--amber-700)">${ICONS.alertCircle}</span>
              <h3 style="margin:0;color:var(--amber-700)">Lembrete de férias — ${avisosFerias.length} colaborador${avisosFerias.length > 1 ? "es" : ""} precisa${avisosFerias.length > 1 ? "m" : ""} programar</h3>
            </div>
          </div>
          <div class="report-list">
            ${avisosFerias
              .map(
                (a) => `<li>
                <strong>${esc(a.colaboradorNome)}</strong> — período aquisitivo ${fmtDate(a.periodoAquisitivoInicio)} a ${fmtDate(a.periodoAquisitivoFim)}
                ${a.vencido ? ` — <span style="color:var(--red-600);font-weight:700">vencido há ${Math.abs(a.diasParaVencer)} dia(s)</span>` : ` — vence em ${a.diasParaVencer} dia(s)`}
              </li>`
              )
              .join("")}
          </div>
        </div>`;
    }

    function filteredRows() {
      if (filtro === "TODAS") return cacheFerias;
      if (filtro === "APROVADAS") return cacheFerias.filter((f) => f.status === "APROVADA");
      if (filtro === "PRE_APROVADAS") return cacheFerias.filter((f) => f.status === "PRE_APROVADA");
      if (filtro === "RECUSADAS") return cacheFerias.filter((f) => f.status === "RECUSADA");
      return cacheFerias.filter((f) => f.status === "PENDENTE" || f.status === "EM_ANALISE");
    }

    async function resolverFerias(solicitacaoId, aprovado, botao) {
      const f = cacheFerias.find((x) => x.id === solicitacaoId);
      const botoesLinha = botao.closest(".approve-reject")?.querySelectorAll("button");
      if (botoesLinha) botoesLinha.forEach((b) => (b.disabled = true));
      try {
        await rhResolverFerias(solicitacaoId, aprovado);
        if (f) await rhNotificarSilencioso({ colaboradorId: f.colaboradorId, tipo: "FERIAS", titulo: aprovado ? "Férias aprovadas" : "Férias recusadas", mensagem: `Sua solicitação de férias de ${fmtDate(f.inicio)} a ${fmtDate(f.fim)} (${f.dias} dias) foi ${aprovado ? "aprovada" : "recusada"}.`, referenciaTabela: "ferias_solicitacoes", referenciaId: f.id, autor: session.name });
        await refrescarFerias();
        recalcularAvisosFerias();
        showToast(aprovado ? `Férias de ${f?.colaborador || "colaborador"} aprovadas.` : `Férias de ${f?.colaborador || "colaborador"} recusadas.`, aprovado ? "success" : "error");
        render();
      } catch (err) {
        showToast(rhMensagemErroSupabase(err), "error");
        if (botoesLinha) botoesLinha.forEach((b) => (b.disabled = false));
      }
    }

    function renderView() {
      document.getElementById("view-wrap").innerHTML = listHtml();
      document.querySelectorAll("[data-approve]").forEach((b) =>
        b.addEventListener("click", () => resolverFerias(b.dataset.approve, true, b))
      );
      document.querySelectorAll("[data-reject]").forEach((b) =>
        b.addEventListener("click", () => resolverFerias(b.dataset.reject, false, b))
      );
      document.querySelectorAll("[data-preaprovar]").forEach((b) =>
        b.addEventListener("click", () => preAprovarFerias(b.dataset.preaprovar, b))
      );
    }

    /** Pré-aprovação: a solicitação continua registrada e fica claramente
     * identificada como "Pré-aprovada" — a aprovação definitiva (que debita
     * o saldo) ou a recusa continuam disponíveis depois. */
    async function preAprovarFerias(solicitacaoId, botao) {
      const f = cacheFerias.find((x) => x.id === solicitacaoId);
      const botoesLinha = botao.closest(".approve-reject")?.querySelectorAll("button");
      if (botoesLinha) botoesLinha.forEach((b) => (b.disabled = true));
      try {
        await rhPreAprovarFerias(solicitacaoId, session.name);
        if (f) await rhNotificarSilencioso({ colaboradorId: f.colaboradorId, tipo: "FERIAS", titulo: "Férias pré-aprovadas", mensagem: `Sua solicitação de férias de ${fmtDate(f.inicio)} a ${fmtDate(f.fim)} (${f.dias} dias) foi pré-aprovada pelo RH e aguarda a aprovação final.`, referenciaTabela: "ferias_solicitacoes", referenciaId: f.id, autor: session.name });
        await refrescarFerias();
        recalcularAvisosFerias();
        showToast(`Férias de ${f?.colaborador || "colaborador"} pré-aprovadas.`, "success");
        render();
      } catch (err) {
        showToast(rhErroMigracao22(err), "error");
        if (botoesLinha) botoesLinha.forEach((b) => (b.disabled = false));
      }
    }

    function listHtml() {
      const rows = filteredRows();
      if (!rows.length) return emptyStateHtml({ icon: ICONS.palmTree, title: "Nada por aqui", desc: "Nenhuma solicitação neste filtro." });
      return `
        <div class="table-scroll">
          <table>
            <thead><tr><th>Colaborador</th><th>Contratação</th><th>Período aquisitivo</th><th class="cell-num">Dias disponíveis</th><th>Período solicitado</th><th class="cell-num">Dias</th><th>Status</th><th>Solicitado em</th><th></th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (f) => `<tr>
                <td><div class="person-cell"><span class="avatar avatar-sm ${avatarColorClass(f.colaborador)}">${avatarInner(f.colaborador)}</span>${esc(f.colaborador)}</div></td>
                <td>${fmtDate(f.colaboradorAdmissao)}</td>
                <td>${f.periodoAquisitivoInicio ? `${fmtDate(f.periodoAquisitivoInicio)} a ${fmtDate(f.periodoAquisitivoFim)}` : "—"}</td>
                <td class="cell-num">${f.saldoDiasDisponiveis ?? "—"}</td>
                <td>${fmtDate(f.inicio)} a ${fmtDate(f.fim)}</td>
                <td class="cell-num">${f.dias}</td>
                <td>${statusBadgeHtml(f.status, STATUS_LABELS)}${f.status === "PRE_APROVADA" && f.preAprovadaPor ? `<br><span class="hint">por ${esc(f.preAprovadaPor)}</span>` : ""}</td>
                <td>${fmtDate(f.solicitadoEm)}</td>
                <td style="text-align:right">
                  ${
                    f.status === "PENDENTE" || f.status === "EM_ANALISE" || f.status === "PRE_APROVADA"
                      ? `<div class="approve-reject">
                        ${f.status !== "PRE_APROVADA" ? `<button type="button" class="approve" style="background:var(--violet-50);color:var(--violet-600)" data-preaprovar="${f.id}" title="Pré-aprovar" aria-label="Pré-aprovar">${ICONS.hourglass}</button>` : ""}
                        <button type="button" class="approve" data-approve="${f.id}" title="Aprovar" aria-label="Aprovar">${ICONS.check}</button>
                        <button type="button" class="reject" data-reject="${f.id}" aria-label="Recusar">${ICONS.x}</button>
                      </div>`
                      : ""
                  }
                </td>
              </tr>`
                )
                .join("")}
            </tbody>
          </table>
        </div>`;
    }

    // ------------------------------------------------------------------
    // Modal "Lançar férias" — período único, ou fracionado em blocos de 15
    // dias (ver rhLancarFeriasRH / rhBlocosFerias15 em rh-ferias-data.js).
    // ------------------------------------------------------------------
    function tipoLancamentoSelecionado() {
      return document.querySelector('input[name="lancar-tipo"]:checked')?.value || "unico";
    }

    function renderBlocosFracionado() {
      const qtd = Number(document.getElementById("lancar-qtd-blocos").value);
      const wrap = document.getElementById("lancar-blocos-list");
      const hojeIso = rhTodayIso();
      wrap.innerHTML = Array.from({ length: qtd }, (_, i) => `
        <div class="field">
          <label>Bloco ${i + 1} — data de início (15 dias)</label>
          <input type="date" class="lancar-bloco-inicio" data-bloco="${i}" value="${i === 0 ? hojeIso : ""}" />
        </div>`).join("");
      wrap.querySelectorAll(".lancar-bloco-inicio").forEach((input) => input.addEventListener("change", atualizarResumoLancamento));
      atualizarResumoLancamento();
    }

    function atualizarResumoLancamento() {
      const resumo = document.getElementById("lancar-resumo");
      const tipo = tipoLancamentoSelecionado();
      if (tipo === "unico") {
        const inicio = document.getElementById("lancar-inicio").value;
        const fim = document.getElementById("lancar-fim").value;
        if (!inicio || !fim || fim < inicio) { resumo.textContent = ""; return; }
        resumo.innerHTML = `Período: <strong>${fmtDate(inicio)} a ${fmtDate(fim)}</strong> (${rhDiasEntre(inicio, fim)} dias).`;
        return;
      }
      const inicios = Array.from(document.querySelectorAll(".lancar-bloco-inicio")).map((i) => i.value).filter(Boolean);
      if (!inicios.length) { resumo.textContent = ""; return; }
      const periodos = inicios.map((iniIso) => {
        const fimDate = new Date(iniIso + "T00:00:00");
        fimDate.setDate(fimDate.getDate() + 14);
        return `${fmtDate(iniIso)} a ${fmtDate(`${fimDate.getFullYear()}-${String(fimDate.getMonth() + 1).padStart(2, "0")}-${String(fimDate.getDate()).padStart(2, "0")}`)}`;
      });
      resumo.innerHTML = `${inicios.length} período(s) de 15 dias — total de <strong>${inicios.length * 15} dias</strong>: ${periodos.join(" · ")}.`;
    }

    function abrirModalLancar() {
      const sel = document.getElementById("lancar-colaborador");
      sel.innerHTML = colaboradoresAtivos.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join("");
      document.querySelectorAll('input[name="lancar-tipo"]').forEach((r) => (r.checked = r.value === "unico"));
      document.getElementById("lancar-unico-wrap").style.display = "";
      document.getElementById("lancar-fracionado-wrap").style.display = "none";
      document.getElementById("lancar-inicio").value = "";
      document.getElementById("lancar-fim").value = "";
      document.getElementById("lancar-qtd-blocos").value = "2";
      renderBlocosFracionado();
      document.getElementById("lancar-resumo").textContent = "";
      openModal("modal-lancar");
    }

    document.querySelectorAll('input[name="lancar-tipo"]').forEach((r) =>
      r.addEventListener("change", () => {
        const tipo = tipoLancamentoSelecionado();
        document.getElementById("lancar-unico-wrap").style.display = tipo === "unico" ? "" : "none";
        document.getElementById("lancar-fracionado-wrap").style.display = tipo === "fracionado" ? "" : "none";
        atualizarResumoLancamento();
      })
    );
    document.getElementById("lancar-inicio").addEventListener("change", atualizarResumoLancamento);
    document.getElementById("lancar-fim").addEventListener("change", atualizarResumoLancamento);
    document.getElementById("lancar-qtd-blocos").addEventListener("change", renderBlocosFracionado);

    document.getElementById("form-lancar").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("lancar-btn-submit");
      const colaboradorId = document.getElementById("lancar-colaborador").value;
      const tipo = tipoLancamentoSelecionado();
      let periodos;
      if (tipo === "unico") {
        periodos = [{ inicio: document.getElementById("lancar-inicio").value, fim: document.getElementById("lancar-fim").value }];
      } else {
        const inicios = Array.from(document.querySelectorAll(".lancar-bloco-inicio")).map((i) => i.value);
        if (inicios.some((v) => !v)) { showToast("Informe a data de início de todos os blocos.", "error"); return; }
        periodos = inicios.map((iniIso) => {
          const fim = new Date(iniIso + "T00:00:00");
          fim.setDate(fim.getDate() + 14);
          return { inicio: iniIso, fim: `${fim.getFullYear()}-${String(fim.getMonth() + 1).padStart(2, "0")}-${String(fim.getDate()).padStart(2, "0")}` };
        });
      }
      btn.disabled = true;
      btn.textContent = "Lançando...";
      try {
        await rhLancarFeriasRH({ colaboradorId, periodos });
        await refrescarFerias();
        recalcularAvisosFerias();
        closeModal("modal-lancar");
        document.getElementById("form-lancar").reset();
        showToast(`Férias lançadas (${periodos.length} período${periodos.length > 1 ? "s" : ""}).`, "success");
        render();
      } catch (err) {
        showToast(rhMensagemErroSupabase(err), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Lançar férias";
      }
    });

    if (session) {
      renderShell(session, withBadges(NAV_RH, await rhNavBadges()));
      renderTopHeader(document.getElementById("top-header"), session, { notifications: [] });
      document.getElementById("content").innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;
      document.querySelector("#modal-lancar .modal-close").innerHTML = ICONS.x;
      wireModalClosers();
      try {
        await Promise.all([refrescarFerias(), carregarColaboradoresAtivos()]);
        recalcularAvisosFerias(); // também popula o sino de notificações do topo
        render();
      } catch (err) {
        rhShowFatalError(rhMensagemErroSupabase(err));
      }
    }

})();
</script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
