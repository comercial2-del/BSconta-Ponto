<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Férias — BSconta+ RH</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-solicitar">
    <div class="modal" style="max-width:640px">
      <div class="modal-header"><h3>Solicitar férias</h3><button class="modal-close" data-close-modal>${''}</button></div>
      <form id="form-ferias">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field full">
              <label>Tipo de solicitação</label>
              <div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.3rem">
                <label style="display:flex;align-items:flex-start;gap:.5rem;font-weight:400;cursor:pointer">
                  <input type="radio" name="fer-tipo" value="integral" checked style="margin-top:.2rem" />
                  <span>Férias integrais — todos os dias disponíveis de uma vez.</span>
                </label>
                <label style="display:flex;align-items:flex-start;gap:.5rem;font-weight:400;cursor:pointer">
                  <input type="radio" name="fer-tipo" value="parcelado" style="margin-top:.2rem" />
                  <span>Férias parceladas — dividir em até 3 períodos (um deles com 14 dias ou mais; os demais com 5 dias ou mais).</span>
                </label>
              </div>
            </div>
          </div>

          <div id="fer-integral-wrap" class="form-grid" style="margin-top:.9rem">
            <div class="field"><label>Data de início</label><input type="date" id="fer-integral-inicio" /></div>
          </div>

          <div id="fer-parcelado-wrap" style="display:none;margin-top:.9rem">
            <div id="fer-periodos-list" style="display:flex;flex-direction:column;gap:.7rem"></div>
            <button type="button" class="btn-ghost" id="fer-add-periodo" style="margin-top:.7rem">${''}Adicionar período</button>
          </div>

          <p class="field-hint" id="fer-resumo" style="margin-top:.9rem"></p>
          <div class="field full" style="margin-top:.6rem"><label>Observações (opcional)</label><textarea id="fer-obs" placeholder="Alguma informação para o RH?"></textarea></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-close-modal>Cancelar</button>
          <button type="submit" class="btn-primary auto">Enviar solicitação</button>
        </div>
      </form>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/rh-supabase-auth.js"></script>
  <script src="../js/rh-ferias-data.js"></script>
  <script>
(async function () {
    const session = await requireRoleReal("COLABORADOR");
    if (!session) return;
    if (!session.employeeId) {
      rhShowFatalError("Este login não está vinculado a um cadastro de colaborador (rh.colaboradores). Peça ao RH para vincular seu usuário antes de solicitar férias.");
      return;
    }
    document.querySelector("#modal-solicitar .modal-close").innerHTML = ICONS.x;
    document.getElementById("fer-add-periodo").innerHTML = `${ICONS.plus} Adicionar período`;

    let feriasState = null;
    let avisoFerias = null;

    async function carregarFerias() {
      feriasState = await rhCarregarFeriasColaborador(session.employeeId);
      // Lembrete de férias (item pedido pelo RH): mesma regra usada em
      // rh/ferias.html, mas aqui avisando o próprio colaborador.
      avisoFerias = rhAvisoFeriasColaborador(feriasState.colaborador, feriasState.historico);
    }

    function fmt(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }

    function periodoLabel(s) { return `${fmt(s.inicio)} a ${fmt(s.fim)}`; }

    function render() {
      const f = feriasState.saldo;
      const total = f.diasUsados + f.saldoDias;
      const pct = total > 0 ? (f.diasUsados / total) * 100 : 0;
      const proximas = feriasState.proximas;
      const solicitacoes = feriasState.historico;

      document.getElementById("content").innerHTML = `
        <div class="space-y">
          <div class="row-between">
            <div>
              <h1 class="page-title">Férias</h1>
              <p class="page-sub">${f.periodoAquisitivoInicio ? `Período aquisitivo atual: ${fmt(f.periodoAquisitivoInicio)} a ${fmt(f.periodoAquisitivoFim)}.` : "Cadastre sua data de admissão com o RH para calcularmos seu período aquisitivo de férias."}</p>
            </div>
            <button type="button" class="btn-primary auto" id="btn-solicitar" ${f.saldoDias < 1 ? "disabled" : ""}>${ICONS.plus}<span>Solicitar férias</span></button>
          </div>

          ${avisoFerias ? `
          <div class="card card-p" style="border-color:rgba(245,158,11,.35);background:var(--amber-50);display:flex;align-items:center;gap:.7rem">
            <span style="color:var(--amber-700)">${ICONS.alertCircle}</span>
            <p style="margin:0;color:var(--amber-700);font-weight:600">
              ${avisoFerias.vencido
                ? `Seu período aquisitivo (${fmt(avisoFerias.periodoAquisitivoInicio)} a ${fmt(avisoFerias.periodoAquisitivoFim)}) já venceu há ${Math.abs(avisoFerias.diasParaVencer)} dia(s) — fale com o RH para programar suas férias o quanto antes.`
                : `Seu período aquisitivo (${fmt(avisoFerias.periodoAquisitivoInicio)} a ${fmt(avisoFerias.periodoAquisitivoFim)}) vence em ${avisoFerias.diasParaVencer} dia(s) — é hora de programar suas férias.`}
            </p>
          </div>` : ""}

          <div class="grid-3 reverse">
            <div class="card card-p" style="display:flex;align-items:center;gap:1.3rem">
              <div class="vacation-ring-wrap">${progressRingSvg({ size: 108, stroke: 10, pct, colorVar: "--emerald-500" })}
                <div class="vacation-ring-center"><strong>${f.saldoDias}</strong><span>dias disponíveis</span></div>
              </div>
              <div>
                <p class="info-value">${f.diasUsados} dias já utilizados</p>
                <p class="hint" style="margin-top:0.3rem">de um total de ${f.diasUsados + f.saldoDias} dias neste período aquisitivo.</p>
              </div>
            </div>
            <div class="card card-p">
              <h2>Próximas férias</h2>
              ${proximas
                .map(
                  (v) => `
                <div style="display:flex;align-items:center;gap:0.9rem">
                  <div class="benefit-icon" style="background:var(--emerald-50);color:var(--emerald-600)">${ICONS.palmTree}</div>
                  <div>
                    <p style="margin:0;font-weight:700">${fmt(v.inicio)} a ${fmt(v.fim)}</p>
                    <p style="margin:0.2rem 0 0;font-size:0.82rem;color:var(--text-faint)">${v.dias} dias · ${statusBadgeHtml(v.status, STATUS_LABELS)}</p>
                  </div>
                </div>`
                )
                .join("") || emptyStateHtml({ icon: ICONS.palmTree, title: "Nenhuma férias agendada" })}
            </div>
          </div>

          <div class="card card-p">
            <h2>Histórico de solicitações</h2>
            ${solicitacoes.length
              ? solicitacoes
                  .map((s) => {
                    const steps = pipelineSteps(s.status);
                    return `
              <div class="request-card">
                <div class="request-card-top">
                  <div>
                    <p class="protocolo">${s.protocolo}</p>
                    <p class="titulo">${periodoLabel(s)}</p>
                  </div>
                  ${statusBadgeHtml(s.status, STATUS_LABELS)}
                </div>
                <p class="desc">${s.dias} dias solicitados${s.observacoes ? ` · ${esc(s.observacoes)}` : ""}</p>
                <div class="status-pipeline">${steps.map((st) => `<span class="p-step ${st}"></span>`).join("")}</div>
                <div class="meta-row"><span>${ICONS.calendar}Solicitado em ${fmt(s.solicitadoEm)}</span></div>
              </div>`;
                  })
                  .join("")
              : emptyStateHtml({ icon: ICONS.calendar, title: "Nenhuma solicitação ainda" })}
          </div>
        </div>
      `;

      document.getElementById("btn-solicitar").addEventListener("click", () => abrirModalSolicitar());
    }

    function pipelineSteps(status) {
      if (status === "APROVADA") return ["filled approve", "filled approve", "filled approve"];
      if (status === "RECUSADA") return ["filled reject", "filled reject", ""];
      if (status === "EM_ANALISE") return ["filled", "filled", ""];
      return ["filled", "", ""];
    }

    // ------------------------------------------------------------------
    // Modal "Solicitar férias" — integral (todos os dias disponíveis de
    // uma vez) ou parcelada (até 3 períodos, ver rhValidarPeriodosFerias
    // em rh-ferias-data.js para as regras de fracionamento).
    // ------------------------------------------------------------------
    function tipoSolicitacaoSelecionado() {
      return document.querySelector('input[name="fer-tipo"]:checked')?.value || "integral";
    }

    function somarDias(iniIso, dias) {
      const d = new Date(iniIso + "T00:00:00");
      d.setDate(d.getDate() + (dias - 1));
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function linhaPeriodoHtml(i, podeRemover) {
      return `
        <div class="form-grid fer-periodo-row" data-idx="${i}">
          <div class="field"><label>Período ${i + 1} — início</label><input type="date" class="fer-per-inicio" /></div>
          <div class="field"><label>Período ${i + 1} — fim</label><input type="date" class="fer-per-fim" /></div>
          ${podeRemover ? `<button type="button" class="btn-ghost fer-per-remover" style="align-self:flex-end;height:2.6rem">${ICONS.x}</button>` : ""}
        </div>`;
    }

    function renderPeriodosParcelado(qtd) {
      const wrap = document.getElementById("fer-periodos-list");
      wrap.innerHTML = Array.from({ length: qtd }, (_, i) => linhaPeriodoHtml(i, qtd > 1)).join("");
      wrap.querySelectorAll(".fer-per-inicio, .fer-per-fim").forEach((input) => input.addEventListener("change", atualizarResumoSolicitacao));
      wrap.querySelectorAll(".fer-per-remover").forEach((btn) =>
        btn.addEventListener("click", () => {
          renderPeriodosParcelado(wrap.querySelectorAll(".fer-periodo-row").length - 1);
          atualizarResumoSolicitacao();
        })
      );
      atualizarAddPeriodoBtn();
    }

    function atualizarAddPeriodoBtn() {
      const qtd = document.querySelectorAll(".fer-periodo-row").length;
      document.getElementById("fer-add-periodo").style.display = qtd >= FERIAS_MAX_PERIODOS ? "none" : "";
    }

    function coletarPeriodosParcelado() {
      return Array.from(document.querySelectorAll(".fer-periodo-row")).map((row) => ({
        inicio: row.querySelector(".fer-per-inicio").value,
        fim: row.querySelector(".fer-per-fim").value,
      }));
    }

    function atualizarResumoSolicitacao() {
      const resumo = document.getElementById("fer-resumo");
      const saldoDisponivel = feriasState.saldo.saldoDias;
      const tipo = tipoSolicitacaoSelecionado();

      if (tipo === "integral") {
        const inicio = document.getElementById("fer-integral-inicio").value;
        if (!inicio || saldoDisponivel < 1) { resumo.textContent = ""; return; }
        const fim = somarDias(inicio, saldoDisponivel);
        resumo.innerHTML = `Período: <strong>${fmt(inicio)} a ${fmt(fim)}</strong> (${saldoDisponivel} dias — todo o seu saldo disponível).`;
        return;
      }

      const periodos = coletarPeriodosParcelado().filter((p) => p.inicio && p.fim);
      if (!periodos.length) { resumo.textContent = ""; return; }
      try {
        const calc = rhValidarPeriodosFerias(coletarPeriodosParcelado().filter((p) => p.inicio || p.fim));
        const totalDias = calc.reduce((a, p) => a + p.dias, 0);
        const partes = calc.map((p) => `${fmt(p.inicio)} a ${fmt(p.fim)} (${p.dias}d)`).join(" · ");
        const excedeu = totalDias > saldoDisponivel;
        resumo.innerHTML = `${calc.length} período(s) — total de <strong>${totalDias} dias</strong> de ${saldoDisponivel} disponíveis: ${partes}.${excedeu ? ` <strong style="color:var(--red-600)">Excede seu saldo disponível.</strong>` : ""}`;
      } catch (err) {
        resumo.innerHTML = `<span style="color:var(--red-600)">${esc(err.message)}</span>`;
      }
    }

    function abrirModalSolicitar() {
      document.querySelectorAll('input[name="fer-tipo"]').forEach((r) => (r.checked = r.value === "integral"));
      document.getElementById("fer-integral-wrap").style.display = "";
      document.getElementById("fer-parcelado-wrap").style.display = "none";
      document.getElementById("fer-integral-inicio").value = "";
      document.getElementById("fer-obs").value = "";
      renderPeriodosParcelado(2);
      document.getElementById("fer-resumo").textContent = "";
      openModal("modal-solicitar");
    }

    document.querySelectorAll('input[name="fer-tipo"]').forEach((r) =>
      r.addEventListener("change", () => {
        const tipo = tipoSolicitacaoSelecionado();
        document.getElementById("fer-integral-wrap").style.display = tipo === "integral" ? "" : "none";
        document.getElementById("fer-parcelado-wrap").style.display = tipo === "parcelado" ? "" : "none";
        atualizarResumoSolicitacao();
      })
    );
    document.getElementById("fer-integral-inicio").addEventListener("change", atualizarResumoSolicitacao);
    document.getElementById("fer-add-periodo").addEventListener("click", () => {
      const qtd = document.querySelectorAll(".fer-periodo-row").length;
      if (qtd >= FERIAS_MAX_PERIODOS) return;
      renderPeriodosParcelado(qtd + 1);
      atualizarResumoSolicitacao();
    });

    document.getElementById("form-ferias").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const tipo = tipoSolicitacaoSelecionado();
      const observacoes = document.getElementById("fer-obs").value.trim();

      let periodos;
      if (tipo === "integral") {
        const inicio = document.getElementById("fer-integral-inicio").value;
        if (!inicio) { showToast("Informe a data de início.", "error"); return; }
        periodos = [{ inicio, fim: somarDias(inicio, feriasState.saldo.saldoDias) }];
      } else {
        periodos = coletarPeriodosParcelado();
        if (periodos.some((p) => !p.inicio || !p.fim)) { showToast("Informe início e fim de todos os períodos.", "error"); return; }
      }

      btn.disabled = true;
      btn.textContent = "Enviando...";
      try {
        await rhCriarSolicitacaoFerias({
          colaboradorId: session.employeeId,
          periodos,
          saldoDisponivel: feriasState.saldo.saldoDias,
          observacoes,
        });
        await carregarFerias();
        closeModal("modal-solicitar");
        document.getElementById("form-ferias").reset();
        showToast(periodos.length > 1 ? "Solicitação de férias parceladas enviada ao RH." : "Solicitação de férias enviada ao RH.", "success");
        render();
      } catch (err) {
        showToast(rhMensagemErroSupabase(err), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar solicitação";
      }
    });

    if (session) {
      try {
        await carregarFerias();
        renderShell(session, NAV_COLABORADOR);
        renderTopHeader(document.getElementById("top-header"), session, { notifications: [] });
        render();
        wireModalClosers();
      } catch (err) {
        rhShowFatalError(rhMensagemErroSupabase(err));
      }
    }

})();
</script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
