<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — BSconta+ RH</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
  <link rel="stylesheet" href="../css/dark-mode.css?v=20261006c" />
  <script src="../js/theme.js?v=20261006c"></script>
  <style>
    /* ===== Dashboard do colaborador (layout v2) — cores da logo BSconta+ ===== */
    .dbx{
      --dbx-navy:#163A8C; --dbx-sky:#29A3E6; --dbx-brand-soft:#EAF4FD;
      --dbx-r:18px;
      --dbx-sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px -6px rgba(15,23,42,.08);
      --dbx-sh-h:0 2px 4px rgba(15,23,42,.05),0 16px 32px -12px rgba(22,58,140,.25);
      display:flex;flex-direction:column;gap:28px;
    }
    html[data-theme="dark"] .dbx{ --dbx-brand-soft:#16294d; --dbx-sh:0 1px 2px rgba(0,0,0,.3); --dbx-sh-h:0 12px 28px -12px rgba(0,0,0,.6); }
    .dbx svg{width:18px;height:18px;flex-shrink:0}

    /* Hero */
    .dbx-hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 32px 26px;color:#fff;
      background:radial-gradient(circle at 85% -20%,rgba(255,255,255,.22),transparent 45%),
                 radial-gradient(circle at 5% 130%,rgba(41,163,230,.55),transparent 55%),
                 linear-gradient(120deg,#0F2A6B 0%,#163A8C 50%,#1F7FC9 100%);
      box-shadow:0 20px 40px -20px rgba(22,58,140,.6)}
    .dbx-hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:40px solid rgba(255,255,255,.06);pointer-events:none}
    .dbx-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
    .dbx-crumb{font-size:12px;opacity:.8;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .dbx-crumb i{width:6px;height:6px;border-radius:50%;background:#7CF0C0;box-shadow:0 0 0 3px rgba(124,240,192,.25)}
    .dbx-hero h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:0;color:#fff}
    .dbx-hero p{opacity:.88;margin:6px 0 0;color:#fff}
    .dbx-clock{text-align:right;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:16px;padding:12px 18px}
    .dbx-clock b{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1}
    .dbx-clock span{font-size:12px;opacity:.85}
    .dbx-shortcuts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;position:relative;z-index:1}
    .dbx-sc{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;text-decoration:none;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;backdrop-filter:blur(6px);transition:.18s}
    .dbx-sc:hover{background:rgba(255,255,255,.22);transform:translateY(-2px);color:#fff}
    .dbx-sc.dbx-sc-dest{background:#fff;color:var(--dbx-navy);border-color:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
    .dbx-sc.dbx-sc-dest:hover{background:#EEF6FE;color:var(--dbx-navy)}

    /* Cabeçalhos de seção */
    .dbx-sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:12px}
    .dbx-sh h2{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
    .dbx-sh p{font-size:12.5px;color:var(--text-faint);margin:2px 0 0}
    .dbx-link{color:var(--dbx-sky);font-weight:600;font-size:12.5px;display:inline-flex;gap:2px;align-items:center;text-decoration:none;transition:gap .15s}
    .dbx-link:hover{gap:6px}
    .dbx-link svg{width:15px;height:15px}

    /* Cards */
    .dbx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--dbx-r);box-shadow:var(--dbx-sh);transition:.2s;color:var(--text);text-decoration:none}
    .dbx-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .dbx-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
    .dbx-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .dbx-kpi{padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
    a.dbx-card:hover,.dbx-ferias:hover{transform:translateY(-3px);box-shadow:var(--dbx-sh-h);border-color:rgba(41,163,230,.35)}
    .dbx-kpi-h{display:flex;align-items:center;justify-content:space-between}
    .dbx-kpi-h span,.dbx-lbl{font-size:12px;font-weight:600;color:var(--text-faint)}
    .dbx-kpi-row{flex-direction:row;align-items:center}
    .dbx-grow{flex:1}
    .dbx-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
    .dbx-ic svg{width:19px;height:19px}
    .dbx-ic.big{width:52px;height:52px;border-radius:16px} .dbx-ic.big svg{width:24px;height:24px}
    .dbx-ic.brand{background:var(--dbx-brand-soft);color:var(--dbx-sky)}
    .dbx-ic.green{background:var(--emerald-50);color:var(--emerald-600)}
    .dbx-ic.amber{background:var(--amber-50);color:var(--amber-600)}
    .dbx-ic.violet{background:var(--violet-50);color:var(--violet-600)}
    .dbx-ic.teal{background:var(--teal-50);color:var(--teal-600)}
    .dbx-ic.red{background:var(--red-50);color:var(--red-600)}
    .dbx-ic.pink{background:#FDF2F8;color:#DB2777}
    html[data-theme="dark"] .dbx-ic.pink{background:#3a1d2e;color:#f472b6}
    .dbx-val{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
    .dbx-val small{font-size:14px;font-weight:700;color:var(--text-faint);margin-left:3px}
    .dbx-val-text{font-size:21px;display:flex;align-items:center;gap:10px}
    .dbx-val.neg{color:var(--red-600)} .dbx-val.pos{color:var(--emerald-600)}
    .dbx-foot{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .dbx-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
    .dbx-tag.ok{background:var(--emerald-50);color:var(--emerald-700)}
    .dbx-tag.neg{background:var(--red-50);color:var(--red-700)}
    .dbx-tag.info{background:var(--dbx-brand-soft);color:var(--dbx-sky)}
    .dbx-bar{height:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
    .dbx-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--dbx-navy),var(--dbx-sky));animation:dbx-grow 1.2s ease-out}
    @keyframes dbx-grow{from{width:0}}
    .dbx-live{width:8px;height:8px;border-radius:50%;background:var(--emerald-500);animation:dbx-pulse 1.8s infinite;flex-shrink:0}
    @keyframes dbx-pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

    /* Jornada */
    .dbx-jornada{padding:24px;display:grid;grid-template-columns:190px 1fr 220px;gap:32px;align-items:center}
    .dbx-ring{position:relative;width:170px;height:170px;margin:auto}
    .dbx-ring svg{width:170px;height:170px;transform:rotate(-90deg)}
    .dbx-ring circle{stroke-width:12;fill:none;stroke-linecap:round}
    .dbx-ring .bg{stroke:var(--surface-2);stroke:color-mix(in srgb,var(--border) 80%,transparent)}
    .dbx-ring .fg{stroke:url(#dbx-g);animation:dbx-ring 1.4s ease-out forwards}
    @keyframes dbx-ring{to{stroke-dashoffset:var(--off)}}
    .dbx-ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
    .dbx-ring-c b{font-size:30px;font-weight:800;letter-spacing:-.03em}
    .dbx-ring-c span{font-size:12px;color:var(--text-faint)}
    .dbx-j-head{display:flex;align-items:center;gap:10px;margin-bottom:26px}
    .dbx-j-head h3{font-size:16px;font-weight:700;margin:0}
    .dbx-steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
    .dbx-steps:before,.dbx-steps:after{content:"";position:absolute;top:19px;left:12.5%;height:3px;border-radius:3px}
    .dbx-steps:before{right:12.5%;background:var(--border)}
    .dbx-steps:after{width:var(--dbx-prog,0%);background:linear-gradient(90deg,var(--emerald-500),var(--dbx-sky));transition:width .6s}
    .dbx-st{text-align:center;position:relative;z-index:1}
    .dbx-dot{width:40px;height:40px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--border);color:var(--text-faint)}
    .dbx-dot svg{width:16px;height:16px}
    .dbx-st.done .dbx-dot{background:var(--emerald-500);border-color:var(--emerald-500);color:#fff;box-shadow:0 6px 14px -4px rgba(16,185,129,.5)}
    .dbx-st.now .dbx-dot{border-color:var(--dbx-sky);color:var(--dbx-sky);box-shadow:0 0 0 5px var(--dbx-brand-soft)}
    .dbx-st b{font-size:13px;display:block} .dbx-st small{color:var(--text-faint);font-size:12px}
    .dbx-st.now b{color:var(--dbx-sky)}
    .dbx-j-act{display:flex;flex-direction:column;gap:12px}
    .dbx-btn{display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:13px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;
      background:linear-gradient(135deg,var(--dbx-navy),var(--dbx-sky));color:#fff;box-shadow:0 10px 20px -10px rgba(22,58,140,.8);transition:.18s}
    .dbx-btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px -10px rgba(22,58,140,.9);color:#fff}
    .dbx-btn.ghost{background:var(--surface-2);color:var(--text-soft);box-shadow:none;border:1px solid var(--border);font-weight:600;font-size:13px;padding:11px}
    .dbx-btn.ghost:hover{border-color:var(--dbx-sky);color:var(--dbx-sky)}
    .dbx-btn.teal{background:linear-gradient(135deg,var(--teal-600),var(--teal-500));box-shadow:0 10px 20px -10px rgba(13,148,136,.8);padding:12px 18px;white-space:nowrap}
    .dbx-next{font-size:12px;color:var(--text-faint);text-align:center}
    .dbx-next b{color:var(--text)}

    /* Listas */
    .dbx-panel{padding:20px 22px;display:flex;flex-direction:column}
    .dbx-panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .dbx-panel-h h3{font-size:15px;font-weight:700;display:flex;gap:10px;align-items:center;margin:0}
    .dbx-panel-h .dbx-ic{width:34px;height:34px}
    .dbx-req{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;margin-top:8px;border:1px solid var(--border);background:var(--surface-2);transition:.15s;color:var(--text);text-decoration:none}
    .dbx-req:hover{border-color:rgba(41,163,230,.45)}
    .dbx-req small{font-size:11.5px;color:var(--text-faint);font-weight:600}
    .dbx-req p{font-weight:600;margin:3px 0 0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

    /* Férias */
    .dbx-ferias{padding:22px 26px;display:flex;align-items:center;gap:20px;background:linear-gradient(110deg,var(--surface) 55%,var(--teal-50))}
    .dbx-ferias h3{font-size:15px;font-weight:700;margin:0}
    .dbx-ferias p{color:var(--text-faint);font-size:13px;margin:3px 0 0}
    .dbx-num{text-align:center;padding:0 22px;border-left:1px solid var(--border);border-right:1px solid var(--border)}
    .dbx-num b{font-size:26px;font-weight:800;display:block;line-height:1;color:var(--teal-600)}
    .dbx-num span{font-size:11.5px;color:var(--text-faint)}

    /* Animação de entrada */
    .dbx-fade{opacity:0;transform:translateY(10px);animation:dbx-in .5s ease-out forwards}
    @keyframes dbx-in{to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.dbx-fade,.dbx-bar i,.dbx-ring .fg{animation-duration:.01s}}

    @media (max-width:1100px){.dbx-grid4{grid-template-columns:repeat(2,1fr)}.dbx-jornada{grid-template-columns:1fr;text-align:center}.dbx-j-head{justify-content:center}}
    @media (max-width:820px){
      .dbx{gap:22px}.dbx-hero{padding:22px 20px}.dbx-hero h1{font-size:24px}
      .dbx-clock{text-align:left}
      .dbx-grid3,.dbx-grid2{grid-template-columns:1fr}
      .dbx-ferias{flex-wrap:wrap}.dbx-num{border:0;padding:0}
    }
    @media (max-width:480px){.dbx-grid4{grid-template-columns:1fr}.dbx-sc{flex:1 1 calc(50% - 10px);justify-content:center}}
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content">
          <div class="loading-wrap"><div class="spinner"></div></div>
        </div>
      </main>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/rh-supabase-auth.js"></script>
  <script src="../js/rh-ponto-data.js"></script>
  <script src="../js/rh-ferias-data.js"></script>
  <script src="../js/rh-solicitacoes-data.js"></script>
  <script src="../js/rh-comunicados-data.js"></script>
  <script>
(async function () {
    const session = await requireRoleReal("COLABORADOR");
    if (!session) return;

    function firstName(n) { return (n || "").split(" ")[0]; }

    // Dados reais (rh.ponto_registros, rh.ferias_solicitacoes/ferias_saldos,
    // rh.solicitacoes, rh.comunicados) — substitui DEMO.ponto / DEMO.ferias /
    // DEMO.solicitacoesColaborador / DEMO.comunicados, que eram fixos em
    // memória e nem chegavam a ser carregados nesta tela (js/demo-data.js).
    let dados = { ponto: null, ferias: null, solicitacoes: [], comunicados: [] };

    async function carregarDados() {
      if (!session.employeeId) throw new Error("Este login não tem cadastro de colaborador vinculado — fale com o RH.");
      const [ponto, ferias, solicitacoes, comunicados] = await Promise.all([
        rhCarregarPonto(session.employeeId),
        rhCarregarFeriasColaborador(session.employeeId),
        rhCarregarSolicitacoesColaborador(session.employeeId),
        rhCarregarComunicadosColaborador(session.employeeId),
      ]);
      dados = { ponto, ferias, solicitacoes, comunicados };
    }

    function horasTrabalhadasSemana() {
      const hoje = new Date();
      const dow = (hoje.getDay() + 6) % 7;
      const inicioSemana = new Date(hoje); inicioSemana.setDate(hoje.getDate() - dow);
      const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const inicioIso = iso(inicioSemana);
      const hojeRow = { data: iso(hoje), horasTrabalhadas: dados.ponto.hoje.horasTrabalhadas };
      return [...dados.ponto.historico, hojeRow]
        .filter((h) => h.data >= inicioIso && h.data <= iso(hoje) && h.horasTrabalhadas)
        .reduce((acc, h) => acc + h.horasTrabalhadas, 0);
    }
    // Formato único (1:30h / 0:30m) — ver fmtDuracao em js/ui.js.
    function fmtHorasCurto(h) { return fmtDuracao(h); }
    function proximoHorarioPonto() {
      const p = dados.ponto.hoje;
      const hp = session.horarioPrevisto;
      if (!p.entrada) return { label: "Entrada", hora: hp?.entrada || "—" };
      if (!p.intervaloSaida) return { label: "Intervalo", hora: "—" };
      if (!p.intervaloVolta) return { label: "Retorno", hora: "—" };
      if (!p.saida) return { label: "Saída", hora: hp?.saida || "—" };
      return null;
    }
    function statusPontoHoje() {
      const p = dados.ponto.hoje;
      if (p.saida) return { label: "Jornada concluída", tone: "green" };
      if (p.entrada) return { label: "Em andamento", tone: "indigo" };
      return { label: "Ainda não iniciado", tone: "amber" };
    }

    function render() {
      const p = dados.ponto;
      const f = dados.ferias;
      const pendentesSolic = dados.solicitacoes.filter((s) => s.status !== "RESOLVIDA").length;
      const naoLidos = dados.comunicados.filter((c) => !c.lido).length;
      const proximo = proximoHorarioPonto();
      const statusHoje = statusPontoHoje();
      // Enquanto o dia não termina (sem horário de saída), rh.ponto_registros
      // ainda não tem horas_trabalhadas calculado (só é gravado ao bater a
      // saída) — mostra uma estimativa em tempo real a partir da entrada.
      const horasHojeEstimado = !p.hoje.saida && p.hoje.entrada
        ? Math.max(0, (Date.now() - new Date().setHours(...p.hoje.entrada.split(":").map(Number), 0, 0)) / 3600000)
        : p.hoje.horasTrabalhadas;
      const horasSemana = horasTrabalhadasSemana();
      const metaDia = Number(p.metaDiaria) || null;
      const metaSemana = metaDia && Array.isArray(p.diasTrabalho) && p.diasTrabalho.length ? metaDia * p.diasTrabalho.length : null;
      const pct = (v, m) => (m ? Math.min(100, Math.max(0, ((Number(v) || 0) / m) * 100)) : 0);
      const pctHoje = pct(horasHojeEstimado, metaDia);
      const pctSemana = pct(horasSemana, metaSemana);
      const saldo = Number(p.saldoBancoHoras) || 0;
      const hp = session.horarioPrevisto || {};
      const RING_C = 2 * Math.PI * 70;
      const statusIcon = { green: "green", indigo: "brand", amber: "amber" }[statusHoje.tone] || "brand";
      const acaoPrincipal = proximo ? `Registrar ${proximo.label.toLowerCase()}` : "Ver jornada";

      document.getElementById("content").innerHTML = `
        <div class="dbx">
          <!-- 1. Saudação + atalhos -->
          <section class="dbx-hero dbx-fade">
            <div class="dbx-hero-top">
              <div>
                <h1 id="dbx-greet">Olá, ${esc(firstName(session.name))} 👋</h1>
                <p>${esc(session.cargo)} · ${esc(session.departamento)} — aqui está um resumo do seu dia.</p>
              </div>
              <div class="dbx-clock"><b id="dbx-clock">--:--</b><span id="dbx-date"></span></div>
            </div>
            <div class="dbx-shortcuts">
              ${shortcutHtml("ponto.html", ICONS.clock, "Bater ponto", true)}
              ${shortcutHtml("ferias.html", ICONS.palmTree, "Solicitar férias")}
              ${shortcutHtml("documentos.html", ICONS.fileText, "Meus holerites")}
              ${shortcutHtml("documentos.html?enviar=1", ICONS.upload, "Enviar documento")}
              ${shortcutHtml("beneficios.html", ICONS.heart, "Benefícios")}
              ${shortcutHtml("solicitacoes.html", ICONS.plus, "Nova solicitação")}
            </div>
          </section>

          <!-- 2. Indicadores -->
          <section>
            <div class="dbx-sh dbx-fade"><div><h2>Seus indicadores</h2><p>Resumo do seu ponto e solicitações</p></div></div>
            <div class="dbx-grid4">
              <a class="dbx-card dbx-kpi dbx-fade" href="ponto.html">
                <div class="dbx-kpi-h"><span>Status do ponto</span><div class="dbx-ic ${statusIcon}">${ICONS.checkCircle}</div></div>
                <div class="dbx-val dbx-val-text">${!p.hoje.saida && p.hoje.entrada ? '<i class="dbx-live"></i>' : ""}${esc(statusHoje.label)}</div>
                <div class="dbx-foot">${p.hoje.local ? `<span class="dbx-tag info">${LOCAL_PONTO_LABELS[p.hoje.local]}</span>` : "local não informado"}${proximo ? ` próximo: ${proximo.label.toLowerCase()}` : ""}</div>
              </a>
              <a class="dbx-card dbx-kpi dbx-fade" href="ponto.html">
                <div class="dbx-kpi-h"><span>Horas hoje</span><div class="dbx-ic brand">${ICONS.clock}</div></div>
                <div class="dbx-val">${horasHojeEstimado != null ? fmtHorasCurto(horasHojeEstimado) : "—"}</div>
                <div><div class="dbx-bar"><i style="width:${pctHoje}%"></i></div>
                  <div class="dbx-foot" style="margin-top:8px">${metaDia ? `de ${fmtDuracao(metaDia)} previstas` : ""}${p.hoje.saida ? " · encerrado" : " · estimado"}</div></div>
              </a>
              <a class="dbx-card dbx-kpi dbx-fade" href="ponto.html">
                <div class="dbx-kpi-h"><span>Horas na semana</span><div class="dbx-ic violet">${ICONS.calendar}</div></div>
                <div class="dbx-val">${fmtHorasCurto(horasSemana)}</div>
                <div><div class="dbx-bar"><i style="width:${pctSemana}%"></i></div>
                  <div class="dbx-foot" style="margin-top:8px">segunda até hoje${metaSemana ? ` · meta ${fmtDuracao(metaSemana)}` : ""}</div></div>
              </a>
              <a class="dbx-card dbx-kpi dbx-fade" href="ponto.html">
                <div class="dbx-kpi-h"><span>Banco de horas</span><div class="dbx-ic ${saldo < 0 ? "red" : "green"}">${ICONS.hourglass}</div></div>
                <div class="dbx-val ${saldo < 0 ? "neg" : saldo > 0 ? "pos" : ""}">${fmtDuracao(saldo, { sinal: true })}</div>
                <div class="dbx-foot">${saldo < 0 ? '<span class="dbx-tag neg">a compensar</span>' : saldo > 0 ? '<span class="dbx-tag ok">saldo positivo</span>' : '<span class="dbx-tag ok">em dia</span>'} acumulado no mês</div>
              </a>
            </div>
            <div class="dbx-grid3">
              <a class="dbx-card dbx-kpi dbx-kpi-row dbx-fade" href="ferias.html">
                <div class="dbx-ic teal">${ICONS.palmTree}</div>
                <div class="dbx-grow"><span class="dbx-lbl">Férias disponíveis</span><div class="dbx-foot">${f.saldo.diasUsados} dias já usados</div></div>
                <div class="dbx-val">${f.saldo.saldoDias}<small>dias</small></div>
              </a>
              <a class="dbx-card dbx-kpi dbx-kpi-row dbx-fade" href="solicitacoes.html">
                <div class="dbx-ic amber">${ICONS.fileText}</div>
                <div class="dbx-grow"><span class="dbx-lbl">Solicitações em aberto</span><div class="dbx-foot">aguardando o RH</div></div>
                <div class="dbx-val">${pendentesSolic}</div>
              </a>
              <a class="dbx-card dbx-kpi dbx-kpi-row dbx-fade" href="comunicados.html">
                <div class="dbx-ic pink">${ICONS.megaphone}</div>
                <div class="dbx-grow"><span class="dbx-lbl">Comunicados não lidos</span><div class="dbx-foot">do RH</div></div>
                <div class="dbx-val">${naoLidos}</div>
              </a>
            </div>
          </section>

          <!-- 3. Jornada de hoje -->
          <section>
            <div class="dbx-sh dbx-fade"><div><h2>Jornada de hoje</h2><p>Acompanhe seus registros do dia</p></div>
              <a class="dbx-link" href="ponto.html">Ver jornada completa ${ICONS.chevronRight}</a></div>
            <div class="dbx-card dbx-jornada dbx-fade">
              <div class="dbx-ring">
                <svg viewBox="0 0 170 170">
                  <defs><linearGradient id="dbx-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163A8C"/><stop offset="1" stop-color="#29A3E6"/></linearGradient></defs>
                  <circle class="bg" cx="85" cy="85" r="70"/>
                  <circle class="fg" cx="85" cy="85" r="70" style="stroke-dasharray:${RING_C};stroke-dashoffset:${RING_C};--off:${RING_C * (1 - pctHoje / 100)}"/>
                </svg>
                <div class="dbx-ring-c"><b>${horasHojeEstimado != null ? fmtHorasCurto(horasHojeEstimado).replace(/[hm]$/, "") : "—"}</b><span>${metaDia ? `de ${fmtDuracao(metaDia)}` : "hoje"}</span></div>
              </div>
              <div>
                <div class="dbx-j-head"><h3>Registros</h3>${p.hoje.local ? localBadgeHtml(p.hoje.local) : ""}</div>
                <div class="dbx-steps" id="punch-track"></div>
              </div>
              <div class="dbx-j-act">
                <a class="dbx-btn" href="ponto.html">${ICONS.clock}${acaoPrincipal}</a>
                <a class="dbx-btn ghost" href="ponto.html">${ICONS.edit}Solicitar ajuste</a>
                ${proximo && proximo.hora && proximo.hora !== "—" ? `<div class="dbx-next">Próximo registro às <b>${proximo.hora}</b></div>` : ""}
              </div>
            </div>
          </section>

          <!-- 4. Solicitações + Comunicados -->
          <section class="dbx-grid2">
            <div class="dbx-card dbx-panel dbx-fade">
              <div class="dbx-panel-h"><h3><span class="dbx-ic amber">${ICONS.fileText}</span>Solicitações recentes</h3>
                <a class="dbx-link" href="solicitacoes.html">Ver todas ${ICONS.chevronRight}</a></div>
              ${dados.solicitacoes.length === 0
                ? emptyStateHtml({ icon: ICONS.fileText, title: "Nenhuma solicitação ainda", desc: "Suas solicitações ao RH aparecem aqui." })
                : dados.solicitacoes.slice(0, 3).map((s) => `
                <a class="dbx-req" href="solicitacoes.html">
                  <div class="dbx-ic brand">${ICONS.fileText}</div>
                  <div class="dbx-grow" style="min-width:0">
                    <small>${esc(s.protocolo)} · ${esc(s.categoria)}</small>
                    <p>${esc(s.descricao)}</p>
                  </div>
                  ${statusBadgeHtml(s.status, { EM_ANALISE: "Em análise", RESOLVIDA: "Resolvida", PENDENTE: "Pendente" })}
                </a>`).join("")}
            </div>
            <div class="dbx-card dbx-panel dbx-fade">
              <div class="dbx-panel-h"><h3><span class="dbx-ic pink">${ICONS.megaphone}</span>Comunicados do RH</h3>
                <a class="dbx-link" href="comunicados.html">Ver todos ${ICONS.chevronRight}</a></div>
              ${dados.comunicados.length === 0
                ? emptyStateHtml({ icon: ICONS.megaphone, title: "Tudo em dia por aqui", desc: "Os comunicados publicados pelo RH aparecem aqui." })
                : dados.comunicados.slice(0, 3).map((c) => `
                <a class="dbx-req" href="comunicados.html">
                  ${!c.lido ? '<span class="announcement-unread-dot"></span>' : '<span style="width:8px;flex-shrink:0"></span>'}
                  <div class="dbx-grow" style="min-width:0">
                    <p>${c.urgente ? `<span class="badge badge-urgent" style="margin-right:0.4rem">Urgente</span>` : ""}${esc(c.titulo)}</p>
                    <small>${formatDate(c.data)}</small>
                  </div>
                  <span class="row-chevron">${ICONS.chevronRight}</span>
                </a>`).join("")}
            </div>
          </section>

          <!-- 5. Férias -->
          <section class="dbx-card dbx-ferias dbx-fade">
            <div class="dbx-ic teal big">${ICONS.palmTree}</div>
            <div class="dbx-grow">
              <h3>Próximas férias</h3>
              ${f.proximas.length
                ? f.proximas.map((v) => `<p><b>${formatDateRange(v.inicio, v.fim)}</b> · ${v.dias} dias · ${statusBadgeHtml(v.status, { APROVADA: "Aprovada", PENDENTE: "Pendente", EM_ANALISE: "Em análise" })}</p>`).join("")
                : `<p>Nenhuma férias agendada. Que tal planejar um descanso?</p>`}
            </div>
            <div class="dbx-num"><b>${f.saldo.saldoDias}</b><span>dias disponíveis</span></div>
            <a class="dbx-btn teal" href="ferias.html">${f.proximas.length ? "Ver férias" : "Solicitar férias"} ${ICONS.chevronRight}</a>
          </section>
        </div>
      `;

      // Entrada escalonada dos cards
      document.querySelectorAll("#content .dbx-fade").forEach((el, i) => { el.style.animationDelay = `${i * 0.04}s`; });

      // Relógio + saudação conforme a hora
      function tick() {
        const d = new Date();
        const h = d.getHours();
        const elG = document.getElementById("dbx-greet");
        if (!elG) return;
        elG.textContent = `${h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"}, ${firstName(session.name)} 👋`;
        document.getElementById("dbx-clock").textContent = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
        const dt = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
        document.getElementById("dbx-date").textContent = dt.charAt(0).toUpperCase() + dt.slice(1);
      }
      tick();
      clearInterval(window.__dbxClock);
      window.__dbxClock = setInterval(tick, 10000);

      const steps = [
        { label: "Entrada", hora: p.hoje.entrada, prev: hp.entrada },
        { label: "Intervalo", hora: p.hoje.intervaloSaida },
        { label: "Retorno", hora: p.hoje.intervaloVolta },
        { label: "Saída", hora: p.hoje.saida, prev: hp.saida },
      ];
      const feitos = steps.filter((s) => s.hora).length;
      let currentSet = false;
      const track = document.getElementById("punch-track");
      track.style.setProperty("--dbx-prog", `${Math.min(feitos, 3) * 25}%`);
      track.innerHTML = steps
        .map((s, i) => {
          const done = !!s.hora;
          const isCurrent = !done && !currentSet;
          if (isCurrent) currentSet = true;
          const sub = s.hora || (s.prev ? `prev. ${s.prev}` : isCurrent ? "Aguardando" : "—");
          return `
          <div class="dbx-st ${done ? "done" : isCurrent ? "now" : ""}">
            <div class="dbx-dot">${done ? ICONS.check : i + 1}</div>
            <b>${s.label}</b><small>${sub}</small>
          </div>`;
        })
        .join("");
    }

    function shortcutHtml(href, icon, label, destaque) {
      return `<a href="${href}" class="dbx-sc${destaque ? " dbx-sc-dest" : ""}">${icon}<span>${label}</span></a>`;
    }
    function formatDate(iso) {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }
    function formatDateRange(iso1, iso2) {
      return `${formatDate(iso1)} a ${formatDate(iso2)}`;
    }

    if (session) {
      renderShell(session, NAV_COLABORADOR);
      try {
        await carregarDados();
      } catch (err) {
        rhShowFatalError(rhMensagemErroSupabase(err));
        return;
      }
      const notificacoes = [];
      const respondidaRecente = dados.solicitacoes.find((s) => s.status === "RESOLVIDA");
      if (respondidaRecente) {
        notificacoes.push({ text: `Sua solicitação <strong>${respondidaRecente.protocolo}</strong> foi respondida.`, time: formatDate(respondidaRecente.data), unread: true, icon: ICONS.messageSquare });
      }
      const comunicadoNaoLido = dados.comunicados.find((c) => !c.lido);
      if (comunicadoNaoLido) {
        notificacoes.push({ text: `Novo comunicado: ${esc(comunicadoNaoLido.titulo)}.`, time: formatDate(comunicadoNaoLido.data), unread: true, icon: ICONS.megaphone });
      }
      if (dados.ferias.proximas.length) {
        const v = dados.ferias.proximas[0];
        notificacoes.push({ text: `Férias aprovadas para ${formatDateRange(v.inicio, v.fim)}.`, time: "", unread: false, icon: ICONS.palmTree });
      }
      renderTopHeader(document.getElementById("top-header"), session, { notifications: notificacoes });
      render();
      initLembretePonto(session.horarioPrevisto, dados.ponto.hoje);
    }
  
})();
</script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
