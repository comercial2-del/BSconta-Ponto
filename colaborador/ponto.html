<style id="colaborador-ponto-history-polish">
/* Jornada / Histórico do colaborador — visual compacto e alinhado à referência */
.history-period-card{padding:0!important;overflow:hidden;border:1px solid #e7ecf3!important}
.history-filter-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.1rem;border-bottom:1px solid #eef1f5;background:#fff}
.history-period-tabs{display:inline-flex;align-items:center;gap:.18rem;padding:.18rem;background:#f5f7fa;border:1px solid #e6eaf0;border-radius:10px}
.history-period-tabs button{border:0;background:transparent;color:#667085;font-weight:700;font-size:.82rem;padding:.48rem .8rem;border-radius:8px;cursor:pointer;transition:.15s ease}
.history-period-tabs button:hover{color:#1d2939;background:#eef2f6}
.history-period-tabs button.active{background:#2f5bea;color:#fff;box-shadow:0 2px 5px rgba(47,91,234,.2)}
.history-period-control{display:flex;align-items:center;gap:.55rem}
.history-period-label{font-size:.82rem;font-weight:800;color:#1d2939;min-width:10rem;text-align:center}
.history-stepper{display:inline-flex;align-items:center;gap:.1rem;padding:.2rem;border:1px solid #e2e7ef;border-radius:10px;background:#fff}
.history-stepper .step-btn{width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:#98a2b3;display:flex;align-items:center;justify-content:center;cursor:pointer}
.history-stepper .step-btn:hover{background:#f3f5f8;color:#344054}
.history-stepper .step-btn svg{width:15px;height:15px}
.history-calendar-button{width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:#98a2b3;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.history-calendar-button:hover{background:#f3f5f8;color:#344054}
.history-calendar-button svg{width:15px;height:15px}
.history-calendar-button input{position:absolute;inset:0;opacity:0;cursor:pointer}
.history-range{display:flex;align-items:center;gap:.55rem;padding:.18rem;border:1px solid #e2e7ef;border-radius:10px;background:#fff}
.history-range input[type=date]{width:120px;border:0!important;box-shadow:none!important;padding:.45rem .55rem!important;font-size:.78rem!important;font-weight:700!important;background:#fff!important}
.history-range .range-sep{font-size:.76rem;font-weight:700;color:#98a2b3}
.history-range .range-count{display:inline-flex;align-items:center;height:30px;padding:0 .65rem;border-radius:7px;background:#f5f7fa;color:#667085;font-size:.72rem;font-weight:800;white-space:nowrap}
.history-body{padding:1rem 1.1rem 1.05rem}
.history-section-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.75rem}
.history-context{font-size:.75rem;color:#98a2b3;font-weight:600}
.history-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.55rem}
.history-day-card{position:relative;min-height:98px;padding:.72rem .68rem;border:1px solid #e7ecf2;border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:.18rem;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease,background .14s ease}
.history-day-card:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(16,24,40,.07)}
.history-day-card .dow{font-size:.61rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#98a2b3}
.history-day-card .num{font-size:1.2rem;line-height:1.05;font-weight:800;color:#1d2939}
.history-day-card .status-label{margin-top:auto;font-size:.72rem;font-weight:800}
.history-day-card .status-time{font-size:.64rem;color:#98a2b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-day-card .status-meta{font-size:.64rem;color:#475467;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:.28rem;border-top:1px solid rgba(16,24,40,.06)}
.history-day-card .hoje-chip{position:absolute;top:.55rem;right:.5rem;font-size:.52rem;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:#fff;background:#2f5bea;padding:.13rem .36rem;border-radius:999px}
.history-day-card.trabalhado{background:#effbf5;border-color:#d6f3e4}.history-day-card.trabalhado .status-label{color:#059669}
.history-day-card.homeoffice{background:#f1f5ff;border-color:#dde7ff}.history-day-card.homeoffice .status-label{color:#3558c8}
.history-day-card.atraso{background:#fff9e8;border-color:#f8edc8}.history-day-card.atraso .status-label{color:#b96a00}
.history-day-card.falta{background:#fff1f1;border-color:#ffd9d9}.history-day-card.falta .status-label{color:#d92d20}
.history-day-card.previsto{background:#fff;border-style:dashed}.history-day-card.previsto .status-label{color:#98a2b3}
.history-day-card.fimdesemana{background:#f8fafc;border-color:#eef2f6}.history-day-card.fimdesemana .status-label{color:#98a2b3;font-weight:700}
.history-day-card.semregistro{background:#fff;border-style:dashed}.history-day-card.semregistro .status-label{color:#98a2b3}
.history-day-card.pendente{background:#f8f5ff;border-color:#ded2fb;border-style:dashed}.history-day-card.pendente .status-label{color:#7c3aed}.history-day-card.pendente .status-meta{color:#7c3aed;border-top-color:rgba(124,58,237,.14)}
.history-day-card.is-today,.history-day-card.is-selected{border-color:#2f5bea;box-shadow:0 0 0 2px rgba(47,91,234,.12)}
.history-day-card.corrigido::after{content:"";position:absolute;right:.55rem;bottom:.55rem;width:7px;height:7px;border-radius:50%;background:#2f5bea}
.history-single{display:grid;grid-template-columns:minmax(0,300px)}
.history-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.38rem}
.history-month-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.38rem;margin-bottom:.35rem}
.history-month-head span{text-align:center;font-size:.61rem;font-weight:800;letter-spacing:.04em;color:#98a2b3;text-transform:uppercase;padding:.1rem 0}
.history-month-cell{min-height:46px;border:1px solid #e7ecf2;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:.76rem;font-weight:800;color:#1d2939;cursor:pointer;transition:.14s ease}
.history-month-cell:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,24,40,.06)}
.history-month-cell.blank{visibility:hidden}
.history-month-cell .dot{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%}
.history-month-cell.completo{background:#effbf5;color:#047857;border-color:#d6f3e4}.history-month-cell.completo .dot{background:#10b981}
.history-month-cell.atraso{background:#fff9e8;color:#b96a00;border-color:#f8edc8}.history-month-cell.atraso .dot{background:#f59e0b}
.history-month-cell.falta{background:#fff1f1;color:#d92d20;border-color:#ffd9d9}.history-month-cell.falta .dot{background:#ef4444}
.history-month-cell.extra{background:#f5f3ff;color:#6d42c7;border-color:#e9e2ff}.history-month-cell.extra .dot{background:#8b5cf6}
.history-month-cell.futuro{color:#98a2b3;border-style:dashed}
.history-month-cell.abonado{background:#f7f3ff;color:#7c3aed;border-color:#e3d9fc}.history-month-cell.abonado .dot{background:#8b5cf6}
.history-month-cell.pendente{background:#f8f5ff;color:#7c3aed;border-color:#ded2fb;border-style:dashed}.history-month-cell.pendente .dot{background:#8b5cf6}
.history-month-cell.hoje{box-shadow:0 0 0 2px #2f5bea}
.history-month-cell.selected{border-color:#2f5bea;box-shadow:0 0 0 2px rgba(47,91,234,.1)}
.history-custom-summary{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;margin-bottom:.8rem}
.history-summary-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.38rem .6rem;border-radius:8px;background:#f7f9fc;border:1px solid #e9edf3;font-size:.72rem;font-weight:800;color:#667085}
.history-summary-chip strong{color:#344054}
.history-empty-range{padding:1.2rem;border:1px dashed #dfe5ec;border-radius:12px;background:#fafbfc;color:#98a2b3;text-align:center;font-size:.78rem;font-weight:600}
.history-legend{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:.8rem;padding-top:.75rem;border-top:1px solid #eef1f5}
.history-legend .item{display:inline-flex;align-items:center;gap:.38rem;font-size:.72rem;font-weight:700;color:#667085}
.history-legend .dot{width:8px;height:8px;border-radius:50%}
@media(max-width:900px){.history-filter-bar{align-items:stretch;flex-direction:column}.history-period-control{justify-content:flex-start}.history-week{grid-template-columns:repeat(4,1fr)}}
@media(max-width:640px){.history-week{grid-template-columns:repeat(2,1fr)}.history-filter-bar{padding:.8rem}.history-body{padding:.8rem}.history-period-tabs{width:100%}.history-period-tabs button{flex:1}.history-period-control{width:100%}.history-stepper,.history-range{width:100%;justify-content:space-between}.history-period-label{flex:1}.history-range input[type=date]{width:auto;min-width:0;flex:1}.history-month-grid,.history-month-head{gap:.25rem}.history-month-cell{min-height:40px}}
</style>
<style id="colaborador-ponto-v2">
/* ===== Ponto / Jornada v2 — cores da logo BSconta+ ===== */
.ponto-page-narrow{max-width:1180px!important;--pj-navy:#163A8C;--pj-sky:#29A3E6;--pj-soft:#EAF4FD;--pj-sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px -6px rgba(15,23,42,.08)}
html[data-theme="dark"] .ponto-page-narrow{--pj-soft:#16294d;--pj-sh:0 1px 2px rgba(0,0,0,.3)}
.pj svg,.pj-tabs svg{width:18px;height:18px;flex-shrink:0}
/* Abas */
.pj-tabs-wrap{display:flex;margin-bottom:6px}
.pj-tabs.tabs{display:inline-flex;gap:4px;padding:5px;border:1px solid var(--border)!important;background:var(--surface);border-radius:14px;box-shadow:var(--pj-sh);overflow-x:auto}
.pj-tabs .tab-btn{border-radius:10px;padding:9px 16px;min-height:0;font-size:13px;font-weight:600;color:var(--text-faint);gap:2px}
.pj-tabs .tab-btn::after{display:none!important}
.pj-tabs .tab-btn:hover:not(.active){color:var(--text);background:var(--surface-2)}
.pj-tabs .tab-btn.active,html[data-theme="dark"] .pj-tabs .tab-btn.active{background:linear-gradient(135deg,var(--pj-navy),var(--pj-sky));color:#fff;box-shadow:0 6px 14px -6px rgba(22,58,140,.7)}
.pj{display:flex;flex-direction:column;gap:20px}
/* Card principal */
.pj-hero{position:relative;overflow:hidden;border-radius:22px;padding:30px 32px;display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center;
  background:radial-gradient(circle at 100% 0%,var(--pj-soft),transparent 42%),var(--surface);border:1px solid var(--border);box-shadow:var(--pj-sh)}
.pj-hero:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--pj-navy),var(--pj-sky),#6EE7B7)}
.pj-hero:after{content:"";position:absolute;right:250px;top:28px;bottom:28px;width:1px;background:var(--border)}
.pj-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pj-chip{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft)}
.pj-chip svg{width:14px;height:14px}
.pj-chip .geo-link{display:inline-flex;color:var(--pj-sky)}
.pj-chip .live{display:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.pj-chip.tone-active{background:var(--emerald-50);color:var(--emerald-700);border-color:transparent}
.pj-chip.tone-active .live{display:block;background:var(--emerald-500);animation:pj-pulse 1.8s infinite}
.pj-chip.tone-pause{background:var(--amber-50);color:var(--amber-700);border-color:transparent}.pj-chip.tone-pause .live{display:block}
.pj-chip.tone-done{background:var(--pj-soft);color:var(--pj-sky);border-color:transparent}
.pj-chip.tone-wait,.pj-chip.tone-offline{background:var(--red-50);color:var(--red-700);border-color:transparent}.pj-chip.tone-wait .live,.pj-chip.tone-offline .live{display:block}
.pj-chip.ho{background:var(--violet-50);color:var(--violet-600);border-color:transparent}
.pj-chip.pres{background:var(--teal-50);color:var(--teal-700);border-color:transparent}
@keyframes pj-pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.pj-clock{display:flex;align-items:flex-end;gap:18px;margin:20px 0 6px}
.pj-clock b{font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums;color:var(--text)}
.pj-clock b small{font-size:24px;font-weight:700;color:var(--pj-sky);letter-spacing:-.02em;margin-left:2px}
.pj-clock>span{font-size:13.5px;color:var(--text-faint);padding-bottom:6px;line-height:1.45}
.pj-clock>span strong{color:var(--text)}
.pj-greet{font-size:14px;color:var(--text-soft);margin:0}
.pj-cta-wrap{max-width:440px}
.pj-hero .ponto-cta-btn{margin-top:22px;width:auto;display:inline-flex;padding:15px 24px;border-radius:16px;font-size:15px;
  background:linear-gradient(135deg,var(--pj-navy),var(--pj-sky));box-shadow:0 14px 28px -14px rgba(22,58,140,.9)}
.pj-hero .ponto-cta-btn svg{width:19px;height:19px}
.pj-hero .ponto-cta-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 32px -14px rgba(22,58,140,1)}
.pj-hero .ponto-cta-btn.pause-variant{background:linear-gradient(135deg,var(--pj-navy),var(--pj-sky));box-shadow:0 14px 28px -14px rgba(22,58,140,.9)}
.pj-hero .ponto-cta-btn.done-variant{background:var(--surface-2);color:var(--text-faint);box-shadow:none;border:1px solid var(--border)}
.pj-hero .ponto-cta-hint{text-align:left;margin-top:10px;font-size:12px}
.pj-hero .offline-banner{margin-top:12px}
.pj-ring{position:relative;width:200px;height:200px}
.pj-ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.pj-ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.pj-ring .bg{stroke:var(--border)}
.pj-ring .fg{stroke:url(#pj-rg);animation:pj-ring 1.4s ease-out forwards}
@keyframes pj-ring{to{stroke-dashoffset:var(--off)}}
.pj-ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.pj-ring-c small{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.pj-ring-c b{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--text)}
.pj-ring-c span{font-size:12px;color:var(--text-faint)}
.pj-ring-c em{font-style:normal;color:var(--pj-sky);font-weight:700}
/* Cards */
.pj-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--pj-sh)}
.pj-card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.pj-card-h h3{font-size:15px;font-weight:700;display:flex;gap:10px;align-items:center;margin:0}
.pj-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.pj-ic.brand{background:var(--pj-soft);color:var(--pj-sky)}.pj-ic.green{background:var(--emerald-50);color:var(--emerald-600)}
.pj-ic.red{background:var(--red-50);color:var(--red-600)}.pj-ic.amber{background:var(--amber-50);color:var(--amber-600)}.pj-ic.violet{background:var(--violet-50);color:var(--violet-600)}
.pj-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pj-tag.info{background:var(--pj-soft);color:var(--pj-sky)}.pj-tag.neg{background:var(--red-50);color:var(--red-700)}.pj-tag.ok{background:var(--emerald-50);color:var(--emerald-700)}
.pj-timeline{padding:24px}
.pj-steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin:4px 0 24px}
.pj-steps:before,.pj-steps:after{content:"";position:absolute;top:23px;left:12.5%;height:4px;border-radius:4px}
.pj-steps:before{right:12.5%;background:var(--border)}
.pj-steps:after{width:var(--pj-prog,0%);background:linear-gradient(90deg,var(--emerald-500),var(--pj-sky));transition:width .6s}
.pj-st{text-align:center;position:relative;z-index:1}
.pj-dot{width:48px;height:48px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-weight:700;background:var(--surface);border:2px solid var(--border);color:var(--text-faint)}
.pj-dot svg{width:20px;height:20px}
.pj-st.done .pj-dot{background:var(--emerald-500);border-color:var(--emerald-500);color:#fff;box-shadow:0 8px 18px -6px rgba(16,185,129,.6)}
.pj-st.now .pj-dot{border-color:var(--pj-sky);color:var(--pj-sky);box-shadow:0 0 0 6px var(--pj-soft)}
.pj-st b{display:block;font-size:13.5px}
.pj-st .t{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.pj-st .p{font-size:11.5px;color:var(--text-faint);margin-top:2px}
.pj-st.now b,.pj-st.now .t{color:var(--pj-sky)}
.pj-st.todo .t{color:var(--text-faint);font-weight:600;font-size:16px}
.pj-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pj-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.pj-stat span{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;gap:6px;align-items:center}
.pj-stat span svg{width:14px;height:14px}
.pj-stat b{display:block;font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pj-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pj-box{padding:22px;display:flex;flex-direction:column}
.pj-bank-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.pj-bank-val{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pj .neg{color:var(--red-600)}.pj .pos{color:var(--emerald-600)}
.pj-muted{color:var(--text-faint);font-size:12.5px}
.pj-calc{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.pj-calc div{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.pj-calc div:last-child{border:0;background:var(--surface-2);font-weight:700}
.pj-calc b{font-variant-numeric:tabular-nums}
.pj-note{font-size:11.5px;color:var(--text-faint);margin:10px 0 0;line-height:1.45}
.pj-next{display:flex;flex-direction:column;gap:6px}
.pj-nx{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid transparent}
.pj-nx.cur{background:var(--pj-soft);border-color:rgba(41,163,230,.35)}
.pj-nx .pj-ic{width:34px;height:34px}
.pj-nx .tx{flex:1}.pj-nx b{font-size:13.5px;display:block}.pj-nx small{color:var(--text-faint);font-size:12px}
.pj-nx .hr{font-weight:800;font-variant-numeric:tabular-nums}
.pj-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 0;color:var(--text-faint);font-size:12.5px}
.pj-done svg{width:34px;height:34px;color:var(--emerald-500);margin-bottom:4px}.pj-done b{color:var(--text);font-size:14px}
.pj-last{margin:auto 0 0;padding-top:14px;font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:7px}
.pj-last i{width:8px;height:8px;border-radius:50%;background:var(--emerald-500);box-shadow:0 0 0 3px var(--emerald-50)}
.pj-last b{color:var(--text)}
.pj-text{color:var(--text-faint);font-size:13px;line-height:1.5;margin:0;flex:1}
.pj-tips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pj-tips div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text-soft)}
.pj-tips svg{width:15px;height:15px;color:var(--emerald-500);margin-top:1px}
.pj-btn{display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;margin-top:16px;

<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-ajuste-ponto">
    <div class="modal modal-ajuste">
      <div class="modal-header"><h3>Solicitar ajuste de ponto</h3><button class="modal-close" data-close-modal></button></div>
      <form id="form-ajuste-ponto">
        <div class="modal-body">
          <div class="field" style="margin-top:0">
            <label>Data do ajuste</label>
            <input type="date" id="ajuste-data" required />
          </div>

          <p class="ajuste-step-label"><span class="ajuste-step-num">1</span>O que você precisa ajustar?</p>
          <div class="local-choice-grid">
            <button type="button" class="local-choice" data-modo="dia"><span class="ajuste-modo-icon"></span><span>Dia inteiro</span></button>
            <button type="button" class="local-choice" data-modo="pontos"><span class="ajuste-modo-icon"></span><span>Ponto específico</span></button>
          </div>
          <p class="field-hint" id="ajuste-modo-hint" style="margin-top:0.5rem"></p>

          <p class="ajuste-step-label"><span class="ajuste-step-num">2</span>Horários</p>
          <div id="ajuste-modo-conteudo"></div>

          <p class="ajuste-step-label"><span class="ajuste-step-num">3</span>Justificativa</p>
          <div class="field" style="margin-top:0">
            <textarea id="ajuste-justificativa" required placeholder="Explique rapidamente o que aconteceu..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-close-modal>Cancelar</button>
          <button type="submit" class="btn-primary auto" id="btn-enviar-ajuste-ponto"><span>Enviar ao RH</span></button>
        </div>
      </form>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js?v=20260929c"></script>
  <script src="../js/ui.js?v=20260929c"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js?v=20260929c"></script>
  <script src="../js/rh-supabase-auth.js?v=20260929c"></script>
  <script src="../js/rh-ponto-data.js?v=20260929c"></script>
  <script src="../js/rh-historia-data.js?v=20260929c"></script>
  <script src="../js/rh-historia-ui.js?v=20260929c"></script>
  <script>
(async function () {
    const session = await requireRoleReal("COLABORADOR");
    if (!session) return;
    if (!session.employeeId) {
      document.getElementById("content").innerHTML = emptyStateHtml({
        icon: ICONS.alertCircle || ICONS.clock,
        title: "Sem cadastro de colaborador vinculado",
        desc: "Seu login não está ligado a um colaborador em rh.colaboradores, então não há um registro de ponto para mostrar. Fale com o RH.",
      });
      return;
    }
    // DEMO.ponto agora é carregado DE VERDADE do Supabase (rh.ponto_registros)
    // — antes era um objeto de exemplo único, igual para qualquer pessoa;
    // depois passou a ser localStorage por colaborador; agora é o banco.
    let pendentesMap = {};
    // Regras de intervalo (rh.configuracoes_ponto) e abonos aprovados do
    // próprio colaborador — ambos da migração 22. Sem a migração, ficam no
    // padrão (intervalo mínimo de 60 min, sem horário mínimo) / vazios.
    let configPonto = { ...RH_CONFIG_PONTO_PADRAO };
    let meusAbonos = [];
    let meusAbonosTodos = [];
    async function carregarTudo() {
      DEMO.ponto = await rhCarregarPonto(session.employeeId);
      pendentesMap = await rhDiasComAjustePendente(session.employeeId);
      aplicarPendentes();
      configPonto = await rhCarregarConfigPonto();
      // Intervalo mínimo da pessoa: se o intervalo cadastrado dela for menor
      // que o da empresa (ex.: estagiário com 30 min), vale o dela — o banco
      // aplica a mesma regra (rh.intervalo_minimo_validacao, script 30).
      const intervaloPessoa = Number(DEMO.ponto?.intervaloCadastradoMin);
      if (Number(configPonto.intervalo_minimo_min) > 0 && intervaloPessoa > 0) {
        configPonto = { ...configPonto, intervalo_minimo_min: Math.min(Number(configPonto.intervalo_minimo_min), intervaloPessoa) };
      }
      try { meusAbonosTodos = await rhListarAbonos({ colaboradorId: session.employeeId }); } catch (e) { meusAbonosTodos = []; }
      meusAbonos = meusAbonosTodos.filter((a) => a.status === "APROVADO");
    }
    function abonoDoDia(iso) {
      return rhAbonoDoDia(meusAbonos, session.employeeId, iso);
    }
    function aplicarPendentes() {
      const p = DEMO.ponto;
      Object.keys(pendentesMap).forEach((data) => {
        if (data === p.hoje.data) {
          p.hoje.pendenteAjuste = pendentesMap[data];
          // p.historico agora sempre contém uma entrada para hoje também
          // (ver rhCarregarPonto) — é um objeto separado de p.hoje, então
          // precisa receber o mesmo pendenteAjuste para o card de hoje na
          // aba Histórico mostrar o selo "Ajuste pendente" corretamente.
          const recHoje = p.historico.find((h) => h.data === data);
          if (recHoje) recHoje.pendenteAjuste = pendentesMap[data];
          return;
        }
        let rec = p.historico.find((h) => h.data === data);
        if (!rec) { rec = { data, status: "completo", entrada: null, intervaloSaida: null, intervaloVolta: null, saida: null, horasTrabalhadas: null, horasExtras: 0, atrasoMin: 0, local: null, geo: null, alteradoPeloRH: null }; p.historico.push(rec); p.historico.sort((a, b) => a.data.localeCompare(b.data)); }
        rec.pendenteAjuste = pendentesMap[data];
      });
    }
    async function persistirPonto() {
      const salvo = await rhSalvarPontoHoje(session.employeeId, DEMO.ponto.hoje);
      Object.assign(DEMO.ponto.hoje, salvo);
    }
    try {
      await carregarTudo();
    } catch (erro) {
      document.getElementById("content").innerHTML = emptyStateHtml({
        icon: ICONS.alertCircle || ICONS.clock,
        title: "Não foi possível carregar seu ponto",
        desc: erro?.message || String(erro),
      });
      return;
    }
    // ------------------------------------------------------------------
    // Virada do dia (ciclo de 24 h). À meia-noite (Brasília) o dia de ponto
    // atual se encerra e começa um novo, automaticamente — mesmo com a tela
    // aberta a noite toda. Nada é apagado: o dia anterior já está salvo em
    // rh.ponto_registros (uma linha por dia) e continua no histórico,
    // completo ou não. Um esquecimento (ex.: não bateu a saída) fica
    // identificado no histórico como "Registro incompleto" e NÃO trava o
    // dia seguinte, que sempre começa do zero pela Entrada.
    // ------------------------------------------------------------------
    let diaCarregado = todayIso();
    let _recarregandoDia = false;
    async function verificarViradaDoDia({ avisar = true } = {}) {
      if (_recarregandoDia || todayIso() === diaCarregado) return false;
      _recarregandoDia = true;
      try {
        document.getElementById("modal-local-ponto")?.classList.remove("open");
        await carregarTudo();
        diaCarregado = todayIso();
        diaSelecionado = diaCarregado;
        render();
        if (avisar) showToast("Novo dia de ponto iniciado. Os registros do dia anterior continuam salvos no histórico.", "info");
      } catch (e) {
        console.error("Falha ao iniciar o novo dia de ponto", e);
      } finally {
        _recarregandoDia = false;
      }
      return true;
    }
    // ------------------------------------------------------------------
    // Atualização automática SILENCIOSA — substitui o "F5 / Ctrl+R" que os
    // colaboradores precisavam fazer. A cada 60 s (e sempre que a aba volta
    // a ficar visível) os dados do ponto são buscados de novo no banco, em
    // segundo plano: sem recarregar a página, sem spinner, sem piscar.
    // A tela só é redesenhada se algo realmente mudou (ex.: RH aprovou um
    // ajuste, abono novo, ponto batido em outro aparelho), mantendo a
    // posição de rolagem. Nunca atualiza enquanto há um modal aberto, uma
    // batida em andamento ou o colaborador digitando num campo — para não
    // atrapalhar o que ele está fazendo.
    // ------------------------------------------------------------------
    const ATUALIZACAO_SILENCIOSA_MS = 60000;
    let _batendoPonto = false;
    let _atualizandoSilencioso = false;
    function estadoAtualSerializado() {
      try { return JSON.stringify([DEMO.ponto, pendentesMap, meusAbonosTodos, configPonto]); } catch (e) { return ""; }
    }
    function usuarioOcupado() {
      if (_batendoPonto || _recarregandoDia) return true;
      if (document.querySelector(".modal-overlay.open")) return true;
      const ativo = document.activeElement;
      return !!(ativo && /^(INPUT|TEXTAREA|SELECT)$/.test(ativo.tagName));
    }
    window.bscontaOcupado = usuarioOcupado;
    async function atualizarSilenciosamente() {
      if (_atualizandoSilencioso || !navigator.onLine || document.visibilityState === "hidden") return;
      if (await verificarViradaDoDia()) return;
      if (usuarioOcupado()) return;
      _atualizandoSilencioso = true;
      const antes = estadoAtualSerializado();
      const backup = { ponto: DEMO.ponto, pendentesMap, meusAbonosTodos, meusAbonos, configPonto };
      try {
        await carregarTudo();
        if (usuarioOcupado()) {
          // Começou uma ação enquanto buscava: não mexe na tela agora.
          return;
        }
        if (estadoAtualSerializado() !== antes) {
          const scrollY = window.scrollY;
          const content = document.getElementById("content");
          const contentScroll = content ? content.scrollTop : 0;
          render();
          if (content) content.scrollTop = contentScroll;
          window.scrollTo(0, scrollY);
        }
      } catch (e) {
        // Falha de rede momentânea: mantém o que já estava na tela e tenta no próximo ciclo.
        DEMO.ponto = backup.ponto; pendentesMap = backup.pendentesMap; meusAbonosTodos = backup.meusAbonosTodos; meusAbonos = backup.meusAbonos; configPonto = backup.configPonto;
        console.warn("Atualização automática do ponto falhou; tenta de novo no próximo ciclo.", e);
      } finally {
        _atualizandoSilencioso = false;
      }
    }
    setInterval(() => verificarViradaDoDia(), 30000);
    setInterval(() => atualizarSilenciosamente(), ATUALIZACAO_SILENCIOSA_MS);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") atualizarSilenciosamente(); });
    window.addEventListener("focus", () => atualizarSilenciosamente());
    window.addEventListener("online", () => atualizarSilenciosamente());

    document.querySelector("#modal-ajuste-ponto .modal-close").innerHTML = ICONS.x;
    document.getElementById("btn-enviar-ajuste-ponto").innerHTML = `${ICONS.send}<span>Enviar ao RH</span>`;
    document.querySelector('#modal-ajuste-ponto [data-modo="dia"] .ajuste-modo-icon').innerHTML = ICONS.calendar;
    document.querySelector('#modal-ajuste-ponto [data-modo="pontos"] .ajuste-modo-icon').innerHTML = ICONS.edit;
    const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    let abaAtiva = "hoje";
    let periodoTipo = "semana";
    let mesRef = { ano: 2026, mes: 8 }; // Setembro (0-indexed)
    let diaSelecionado = todayIso();
    let rangeInicio = null, rangeFim = null;
    let _clockInterval = null;

    // Dia de ponto = dia civil de Brasília (ver rhTodayIso em js/rh-ponto-data.js).
    function todayIso() {
      return rhTodayIso();
    }
    function porData(iso) { return DEMO.ponto.historico.find((h) => h.data === iso); }
    // Lê os itens de um ajuste pendente aceitando o formato atual
    // (`ajuste.itens`, um ou mais registros) e o formato antigo, singular
    // (`{campo, campoLabel, horario}` direto no objeto) — solicitações
    // pendentes criadas antes desta mudança continuam aparecendo certas no
    // calendário. Ver rhItensAjustePonto (mesma lógica) em js/rh-ponto-data.js.
    function itensAjustePendente(ajuste) {
      if (!ajuste) return [];
      if (Array.isArray(ajuste.itens) && ajuste.itens.length) return ajuste.itens;
      if (ajuste.campo) return [{ campo: ajuste.campo, campoLabel: ajuste.campoLabel, horario: ajuste.horario }];
      return [];
    }
    function resumoAjustePendente(ajuste) {
      return itensAjustePendente(ajuste)
        .map((it) => `${it.campoLabel} → ${it.horario}`)
        .join(", ");
    }
    // Formato único (1:30h / 0:30m) — ver fmtDuracao em js/ui.js.
    function fmtHoras(h, opts) { return fmtDuracao(h, opts); }

    function passosDeHoje() {
      const p = DEMO.ponto;
      return [
        { key: "entrada", label: "Entrada", ctaLabel: "Registrar entrada", hora: p.hoje.entrada },
        { key: "intervaloSaida", label: "Saída intervalo", ctaLabel: "Registrar saída para intervalo", hora: p.hoje.intervaloSaida },
        { key: "intervaloVolta", label: "Retorno intervalo", ctaLabel: "Registrar retorno do intervalo", hora: p.hoje.intervaloVolta },
        { key: "saida", label: "Saída", ctaLabel: "Registrar saída", hora: p.hoje.saida },
      ];
    }

    function render() {
      clearInterval(_clockInterval);
      const steps = passosDeHoje();
      const nextStep = steps.find((s) => !s.hora);

      document.getElementById("content").innerHTML = `
        <div class="space-y ponto-page-narrow">
          <div class="row-between">
            <div>
              <h1 class="page-title">Ponto / Jornada</h1>
              <p class="page-sub">Registre seu ponto e acompanhe sua jornada de trabalho.</p>
            </div>
          </div>

          <div class="pj-tabs-wrap">
            <div class="tabs pj-tabs">
              <button type="button" class="tab-btn ${abaAtiva === "hoje" ? "active" : ""}" data-aba="hoje">${ICONS.clock}<span style="margin-left:0.4rem">Hoje</span></button>
              <button type="button" class="tab-btn ${abaAtiva === "historico" ? "active" : ""}" data-aba="historico">${ICONS.calendar}<span style="margin-left:0.4rem">Histórico</span></button>
              <button type="button" class="tab-btn ${abaAtiva === "abonos" ? "active" : ""}" data-aba="abonos">${ICONS.clipboardCheck}<span style="margin-left:0.4rem">Abonos</span>${faltasParaJustificar().length ? `<span class="badge badge-red" style="margin-left:0.4rem">${faltasParaJustificar().length}</span>` : ""}</button>
            </div>
          </div>

          <div id="aba-conteudo"></div>
        </div>
      `;

      document.querySelectorAll("[data-aba]").forEach((btn) =>
        btn.addEventListener("click", () => {
          abaAtiva = btn.dataset.aba;
          render();
        })
      );

      if (abaAtiva === "hoje") renderHoje(steps, nextStep);
      else if (abaAtiva === "abonos") renderAbonos();
      else renderHistorico();
    }

    // ------------------------------------------------------------------
    // Aba "Hoje" — tela principal de bater ponto
    // ------------------------------------------------------------------
    // ------------------------------------------------------------------
    // Aba "Abonos" — o colaborador justifica as próprias faltas (atestado,
    // falta justificada, compromisso externo...) e acompanha a análise do
    // RH. O pedido sempre nasce PENDENTE; só o RH aprova (e, aprovado, o
    // dia deixa de contar como falta).
    // ------------------------------------------------------------------
    const TIPOS_ABONO_COLABORADOR = ["ATESTADO", "FALTA_JUSTIFICADA", "AUSENCIA_AUTORIZADA", "COMPROMISSO_EXTERNO", "FOLGA", "OUTRO"];

    function faltasParaJustificar() {
      if (!DEMO.ponto) return [];
      return rhFaltasSemJustificativa({ historico: DEMO.ponto.historico, diasTrabalho: DEMO.ponto.diasTrabalho, admissao: session.admissao, abonos: meusAbonosTodos });
    }

    function renderAbonos() {
      const faltas = faltasParaJustificar();
      const fmtDia = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
      document.getElementById("aba-conteudo").innerHTML = `
        <div class="space-y">
          <div class="card card-p">
            <div class="row-between" style="margin-bottom:.9rem;flex-wrap:wrap;gap:.7rem">
              <div>
                <h2 style="margin:0">Faltas para justificar</h2>
                <p class="page-sub" style="margin:.25rem 0 0">Dias de trabalho sem registro de ponto. Envie a justificativa (e o atestado, se tiver) para o RH analisar.</p>
              </div>
              <button type="button" class="btn-ghost" style="width:auto" id="btn-abono-livre">${ICONS.plus}<span>Solicitar abono</span></button>
            </div>
            ${faltas.length
              ? `<div class="mini-list">${faltas.map((d) => `
                  <div class="mini-card" style="align-items:center">
                    <div><p class="t" style="text-transform:capitalize">${esc(fmtDia(d))}</p><p class="s">Sem registro de ponto</p></div>
                    <button type="button" class="btn-primary auto" data-justificar="${d}">${ICONS.edit}<span>Justificar</span></button>
                  </div>`).join("")}</div>`
              : emptyStateHtml({ icon: ICONS.checkCircle, title: "Nenhuma falta pendente de justificativa", desc: "Se precisar avisar uma ausência futura (consulta, compromisso), use “Solicitar abono”." })}
          </div>

          <div class="card card-p">
            <h2 style="margin:0 0 .8rem">Meus abonos</h2>
            ${(() => {
              const lista = meusAbonosTodos.filter((a) => a.status !== "ARQUIVADO");
              if (!lista.length) return `<p class="hint">Você ainda não enviou nenhuma justificativa.</p>`;
              return `<div class="mini-list">${lista.map((a) => `
                <div class="abono-card">
                  <div>
                    <p class="t">${esc(RH_TIPOS_ABONO[a.tipo]?.label || a.tipo)} ${statusBadgeHtml(a.status, RH_STATUS_ABONO)}</p>
                    <p class="s">${rhAbonoPeriodoTexto(a)} · ${a.dias} dia(s)${a.motivo ? ` · ${esc(a.motivo)}` : ""}</p>
                  </div>
                  <div class="doc-row" style="grid-column:auto;justify-content:flex-end">
                    ${a.anexo_path
                      ? `<span class="doc-chip" style="cursor:default">${ICONS.fileText}<span>${esc(a.anexo_nome || "Documento enviado")}</span></span>`
                      : a.status === "PENDENTE"
                      ? `<span class="doc-missing">${ICONS.alertCircle}<span>Sem documento</span></span><button type="button" class="btn-ghost" style="width:auto;padding:.35rem .7rem" data-anexar="${a.id}">${ICONS.upload}<span>Anexar</span></button>`
                      : `<span class="hint">Sem documento</span>`}
                  </div>
                </div>`).join("")}</div>`;
            })()}
          </div>
        </div>`;
      document.querySelectorAll("[data-anexar]").forEach((b) => b.addEventListener("click", () => abrirModalAnexar(meusAbonosTodos.find((x) => x.id === b.dataset.anexar))));
      document.getElementById("btn-abono-livre").addEventListener("click", () => abrirModalJustificar(todayIso()));
      document.querySelectorAll("[data-justificar]").forEach((b) => b.addEventListener("click", () => abrirModalJustificar(b.dataset.justificar)));
    }

    function abrirModalJustificar(dataIso) {
      let overlay = document.getElementById("modal-justificar");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.id = "modal-justificar";
        overlay.innerHTML = '<div class="modal" style="max-width:560px"></div>';
        document.body.appendChild(overlay);
        overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
      }
      overlay.querySelector(".modal").innerHTML = `
        <div class="modal-header"><div><h3>Justificar falta / solicitar abono</h3><p class="page-sub" style="margin:.2rem 0 0">O RH vai analisar e você acompanha o status aqui.</p></div><button type="button" class="modal-close" data-fechar>${ICONS.x}</button></div>
        <form id="form-justificar">
          <div class="modal-body">
            <div class="form-grid">
              <div class="field full"><label>Tipo</label><select id="jf-tipo" required>${TIPOS_ABONO_COLABORADOR.map((t) => `<option value="${t}">${esc(RH_TIPOS_ABONO[t].label)}</option>`).join("")}</select></div>
              <div class="field"><label>Data inicial</label><input type="date" id="jf-inicio" required value="${dataIso}" /></div>
              <div class="field"><label>Data final</label><input type="date" id="jf-fim" required value="${dataIso}" /></div>

              <div class="field full"><label>Atestado / documento</label>${rhDropzoneHtml("jf-anexo", { titulo: "Anexe o atestado ou comprovante" })}</div>
            </div>
            <div class="notice-soft" id="jf-aviso" style="margin-top:.8rem">${ICONS.alertCircle}<span>Sem documento anexado. O pedido vai ao RH mesmo assim, marcado como <strong>sem documento</strong> — você pode anexar depois em “Meus abonos”.</span></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn-ghost" data-fechar>Cancelar</button><button type="submit" class="btn-primary auto" id="jf-enviar">${ICONS.send}<span>Enviar ao RH</span></button></div>
        </form>`;
      overlay.querySelectorAll("[data-fechar]").forEach((b) => b.addEventListener("click", () => overlay.classList.remove("open")));
      const anexoJf = rhWireDropzone(overlay, "jf-anexo", (f) => { overlay.querySelector("#jf-aviso").hidden = !!f; });
      overlay.querySelector("#jf-inicio").addEventListener("change", (e) => { const f = overlay.querySelector("#jf-fim"); if (!f.value || f.value < e.target.value) f.value = e.target.value; });
      overlay.querySelector("#form-justificar").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = overlay.querySelector("#jf-enviar");
        btn.disabled = true;
        try {
          await rhSolicitarAbonoColaborador({
            colaboradorId: session.employeeId,
            colaboradorNome: session.name,
            tipo: overlay.querySelector("#jf-tipo").value,
            dataInicio: overlay.querySelector("#jf-inicio").value,
            dataFim: overlay.querySelector("#jf-fim").value,
            motivo: overlay.querySelector("#jf-motivo").value,
            descricao: overlay.querySelector("#jf-descricao").value.trim(),
            arquivo: anexoJf.arquivo(),
          });
          meusAbonosTodos = await rhListarAbonos({ colaboradorId: session.employeeId });
          meusAbonos = meusAbonosTodos.filter((a) => a.status === "APROVADO");
          overlay.classList.remove("open");
          showToast("Justificativa enviada ao RH.", "success");
          render();
        } catch (err) {
          showToast(typeof rhErroMigracao22 === "function" ? rhErroMigracao22(err) : (err?.message || err), "error");
          btn.disabled = false;
        }
      });
      requestAnimationFrame(() => overlay.classList.add("open"));
    }

    function abrirModalAnexar(abono) {
      if (!abono) return;
      let overlay = document.getElementById("modal-anexar");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.id = "modal-anexar";
        overlay.innerHTML = '<div class="modal" style="max-width:480px"></div>';
        document.body.appendChild(overlay);
        overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
      }
      overlay.querySelector(".modal").innerHTML = `
        <div class="modal-header"><div><h3>Anexar documento</h3><p class="page-sub" style="margin:.2rem 0 0">${esc(RH_TIPOS_ABONO[abono.tipo]?.label || "")} · ${rhAbonoPeriodoTexto(abono)}</p></div><button type="button" class="modal-close" data-fechar>${ICONS.x}</button></div>
        <div class="modal-body">${rhDropzoneHtml("an-anexo", { titulo: "Anexe o atestado ou comprovante" })}</div>
        <div class="modal-footer"><button type="button" class="btn-ghost" data-fechar>Cancelar</button><button type="button" class="btn-primary auto" id="an-enviar" disabled>${ICONS.send}<span>Enviar documento</span></button></div>`;
      overlay.querySelectorAll("[data-fechar]").forEach((b) => b.addEventListener("click", () => overlay.classList.remove("open")));
      const dz = rhWireDropzone(overlay, "an-anexo", (f) => { overlay.querySelector("#an-enviar").disabled = !f; });
      overlay.querySelector("#an-enviar").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
          await rhAnexarDocumentoAbono(abono, dz.arquivo());
          meusAbonosTodos = await rhListarAbonos({ colaboradorId: session.employeeId });
          overlay.classList.remove("open");
          showToast("Documento enviado ao RH.", "success");
          render();
        } catch (err) {
          showToast(rhErroMigracao22(err), "error");
          btn.disabled = false;
        }
      });
      requestAnimationFrame(() => overlay.classList.add("open"));
