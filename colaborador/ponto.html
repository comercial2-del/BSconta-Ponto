    function saudacaoPorHora() {
      const h = new Date().getHours();
      if (h < 12) return "Bom dia";
      if (h < 18) return "Boa tarde";
      return "Boa noite";
    }

    function jornadaStatusInfo(p) {
      if (!navigator.onLine) return { tone: "offline", label: "Sem conexão" };
      if (!p.hoje.entrada) return { tone: "wait", label: "Aguardando entrada" };
      if (p.hoje.entrada && !p.hoje.intervaloSaida) return { tone: "active", label: "Jornada em andamento" };
      if (p.hoje.intervaloSaida && !p.hoje.intervaloVolta) return { tone: "pause", label: "Em intervalo" };
      if (p.hoje.intervaloVolta && !p.hoje.saida) return { tone: "active", label: "Jornada em andamento" };
      return { tone: "done", label: "Jornada encerrada" };
    }

    /** Estimativa simples do horário de saída/retorno de intervalo a partir da
     * entrada (+4h / +5h) — só para dar contexto em "Próximos registros" antes
     * de o colaborador bater esses pontos de verdade; nunca é a fonte real. */
    function previstoIntervalo(entradaStr) {
      if (!entradaStr) return { saida: null, volta: null };
      const [h, m] = entradaStr.split(":").map(Number);
      const add = (mins) => {
        const total = h * 60 + m + mins;
        const hh = Math.floor(total / 60) % 24;
        const mm = total % 60;
        return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
      };
      return { saida: add(240), volta: add(300) };
    }

    function calcularHorasHoje(p) {
      const parse = (hhmm) => {
        if (!hhmm) return null;
        const [h, m] = hhmm.split(":").map(Number);
        return h * 60 + m;
      };
      const ent = parse(p.hoje.entrada);
      if (ent === null) return null;
      const saidaInt = parse(p.hoje.intervaloSaida);
      const voltaInt = parse(p.hoje.intervaloVolta);
      const saida = parse(p.hoje.saida);
      const agoraMin = (() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); })();
      let minutos = 0;
      if (saidaInt !== null) {
        minutos += Math.max(0, saidaInt - ent);
        if (voltaInt !== null) {
          const fim = saida !== null ? saida : agoraMin;
          minutos += Math.max(0, fim - voltaInt);
        }
      } else {
        const fim = saida !== null ? saida : agoraMin;
        minutos += Math.max(0, fim - ent);
      }
      return minutos / 60;
    }

    function iconePasso(key) {
      return { entrada: ICONS.clock, intervaloSaida: ICONS.utensils, intervaloVolta: ICONS.refresh, saida: ICONS.logout }[key] || ICONS.clock;
    }

    function renderHoje(steps, nextStep) {
      const p = DEMO.ponto;
      const primeiroNome = (session.name || "").split(" ")[0];
      const agora = new Date();
      const dataFmt = agora.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
      const diaSemana = agora.toLocaleDateString("pt-BR", { weekday: "long" });
      const status = jornadaStatusInfo(p);
      const offline = !navigator.onLine;
      const horasHoje = calcularHorasHoje(p);
      const previsto = previstoIntervalo(p.hoje.entrada);
      const ultimoFeito = steps.filter((s) => s.hora).slice(-1)[0];
      const proximos = nextStep ? steps.slice(steps.findIndex((s) => s.key === nextStep.key)) : [];
      // p.historico agora inclui o dia de hoje (ver js/rh-ponto-data.js) —
      // exclui a data de hoje aqui também, para o "Detalhe do banco de
      // horas" continuar contando só os dias já fechados, igual ao cálculo
      // de p.saldoBancoHoras feito na camada de dados.
      const historicoFechado = p.historico.filter((r) => r.data !== todayIso());
      const horasDevendo = historicoFechado.reduce((acc, r) => acc + (Number(r.atrasoMin) || 0) / 60 + (Number(r.descontoAlmocoH) || 0), 0);
      const horasAcumuladas = historicoFechado.reduce((acc, r) => acc + (Number(r.horasExtras) || 0), 0);

      let ctaHtml;
      if (offline) {
        ctaHtml = `
          <button type="button" class="ponto-cta-btn" disabled>${ICONS.clock}<span>Registrar ponto</span></button>
          <div class="offline-banner">${ICONS.alertCircle}<span>Sem conexão. Verifique sua internet para registrar o ponto.</span></div>`;
      } else if (!nextStep) {
        ctaHtml = `
          <button type="button" class="ponto-cta-btn done-variant" disabled>${ICONS.checkCircle}<span>Jornada encerrada hoje</span></button>
          <p class="ponto-cta-hint" id="cta-hint">Jornada de hoje concluída. Bom descanso!</p>`;
      } else {
        const variant = nextStep.key === "intervaloSaida" ? "pause-variant" : "";
        const avisoIntervalo = rhValidarBatidaIntervalo(nextStep.key, horaAgora(), p.hoje, configPonto);
        const dicaIntervalo = nextStep.key === "intervaloVolta" && p.hoje.intervaloSaida && Number(configPonto.intervalo_minimo_min) > 0
          ? `Intervalo mínimo de ${configPonto.intervalo_minimo_min} min.`
          : nextStep.key === "intervaloSaida" && configPonto.almoco_inicio_minimo
          ? `O intervalo pode começar a partir das ${configPonto.almoco_inicio_minimo}.`
          : "";
        ctaHtml = `
          <button type="button" class="ponto-cta-btn ${variant}" id="btn-bater">${ICONS.clock}<span>${nextStep.ctaLabel}</span>${ICONS.chevronRight.replace("<svg ", '<svg class="arrow" ')}</button>
          <p class="ponto-cta-hint${avisoIntervalo ? " is-error" : ""}" id="cta-hint">${esc(avisoIntervalo || [dicaIntervalo, "Clique no botão para registrar seu ponto no horário atual."].filter(Boolean).join(" "))}</p>`;
      }

      // Resumo do dia para o card principal (anel + números).
      const meta = Number(p.metaDiaria) || 0;
      const pctHoje = meta && horasHoje != null ? Math.min(100, Math.max(0, (horasHoje / meta) * 100)) : 0;
      const faltam = meta && horasHoje != null ? Math.max(0, meta - horasHoje) : null;
      const toMin = (hhmm) => { if (!hhmm) return null; const [h, m] = String(hhmm).split(":").map(Number); return h * 60 + m; };
      const fmtHHMM = (min) => `${String(Math.floor(min / 60) % 24).padStart(2, "0")}:${String(Math.round(min) % 60).padStart(2, "0")}`;
      const intervaloMin = p.hoje.intervaloSaida && p.hoje.intervaloVolta
        ? Math.max(0, toMin(p.hoje.intervaloVolta) - toMin(p.hoje.intervaloSaida))
        : (Number(p.intervaloCadastradoMin) || 60);
      const saidaEstimada = p.hoje.saida || (p.hoje.entrada && meta ? fmtHHMM(toMin(p.hoje.entrada) + meta * 60 + intervaloMin) : (session.horarioPrevisto?.saida ? String(session.horarioPrevisto.saida).slice(0, 5) : null));
      const previstoPorPasso = {
        entrada: session.horarioPrevisto?.entrada ? String(session.horarioPrevisto.entrada).slice(0, 5) : null,
        intervaloSaida: previsto.saida,
        intervaloVolta: previsto.volta,
        saida: saidaEstimada,
      };
      const feitos = steps.filter((s) => s.hora).length;
      const saldo = Number(p.saldoBancoHoras) || 0;
      const RING_C = 2 * Math.PI * 85;
      const diaSemanaCap = diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1);
      const subtituloProximo = { entrada: "início da jornada", intervaloSaida: "pausa para o intervalo", intervaloVolta: "volta do intervalo", saida: "fim da jornada" };
      const corPasso = { entrada: "brand", intervaloSaida: "brand", intervaloVolta: "amber", saida: "green" };

      document.getElementById("aba-conteudo").innerHTML = `
        <div class="pj">
          <section class="pj-hero pj-fade">
            <div class="pj-hero-main">
              <div class="pj-chips">
                <span class="pj-chip tone-${status.tone}"><i class="live"></i>${status.label}</span>
                ${p.hoje.local ? `<span class="pj-chip ${p.hoje.local === "HOME_OFFICE" ? "ho" : "pres"}">${p.hoje.local === "HOME_OFFICE" ? ICONS.home : ICONS.building}${LOCAL_PONTO_LABELS[p.hoje.local]}</span>` : ""}
                ${p.hoje.geo ? `<span class="pj-chip">${geoLinkHtml(p.hoje.geo)}Localização registrada</span>` : ""}
              </div>
              <div class="pj-clock">
                <b><span id="ponto-clock">${horaAgora()}</span><small id="ponto-clock-s">:${String(agora.getSeconds()).padStart(2, "0")}</small></b>
                <span><strong>${esc(diaSemanaCap)}</strong><br>${esc(dataFmt)}</span>
              </div>
              <p class="pj-greet">${esc(saudacaoPorHora())}, ${esc(primeiroNome)}! Que seu dia seja produtivo.</p>
              <div class="pj-cta-wrap">${ctaHtml}</div>
            </div>
            <div class="pj-ring">
              <svg viewBox="0 0 200 200">
                <defs><linearGradient id="pj-rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163A8C"/><stop offset="1" stop-color="#29A3E6"/></linearGradient></defs>
                <circle class="bg" cx="100" cy="100" r="85"/>
                <circle class="fg" cx="100" cy="100" r="85" style="stroke-dasharray:${RING_C};stroke-dashoffset:${RING_C};--off:${RING_C * (1 - pctHoje / 100)}"/>
              </svg>
              <div class="pj-ring-c"><small>Trabalhadas hoje</small><b>${horasHoje == null ? "—" : fmtHoras(horasHoje).replace(/[hm]$/, "")}</b><span>${meta ? `de ${fmtHoras(meta)} · <em>${Math.round(pctHoje)}%</em>` : "hoje"}</span></div>
            </div>
          </section>

          <section class="pj-card pj-timeline pj-fade">
            <div class="pj-card-h"><h3><span class="pj-ic brand">${ICONS.timeline}</span>Registros de hoje</h3><span class="pj-tag info">${feitos} de 4 registros</span></div>
            <div class="pj-steps" id="punch-track" style="--pj-prog:${Math.min(feitos, 3) * 25}%"></div>
            <div class="pj-stats">
              <div class="pj-stat"><span>${ICONS.clock}Trabalhadas</span><b>${horasHoje == null ? "—" : fmtHoras(horasHoje)}</b></div>
              <div class="pj-stat"><span>${ICONS.calendar}Jornada prevista</span><b>${meta ? fmtHoras(meta) : "—"}</b></div>
              <div class="pj-stat"><span>${ICONS.hourglass}Faltam</span><b>${faltam == null ? "—" : faltam === 0 ? "Concluída" : fmtHoras(faltam)}</b></div>
              <div class="pj-stat"><span>${ICONS.logout}${p.hoje.saida ? "Saída" : "Saída estimada"}</span><b>${saidaEstimada || "—"}</b></div>
            </div>
          </section>

          <div class="pj-grid3">
            <section class="pj-card pj-box pj-fade">
              <div class="pj-card-h"><h3><span class="pj-ic ${saldo < 0 ? "red" : "green"}">${ICONS.hourglass}</span>Banco de horas</h3>${saldo < 0 ? '<span class="pj-tag neg">a compensar</span>' : saldo > 0 ? '<span class="pj-tag ok">saldo positivo</span>' : '<span class="pj-tag ok">em dia</span>'}</div>
              <div class="pj-bank-top"><div class="pj-bank-val ${saldo < 0 ? "neg" : saldo > 0 ? "pos" : ""}">${fmtDuracao(saldo, { sinal: true })}</div><div class="pj-muted">saldo do mês<br>meta ${fmtHoras(p.metaDiaria)} por dia útil</div></div>
              <div class="pj-calc">
                <div><span>Horas acumuladas (extras)</span><b class="pos">${horasAcumuladas > 0 ? fmtDuracao(horasAcumuladas, { sinal: true }) : "—"}</b></div>
                <div><span>Horas devendo (atrasos)</span><b class="neg">${horasDevendo > 0 ? fmtDuracao(-horasDevendo) : "—"}</b></div>
                <div><span>Saldo final</span><b class="${saldo < 0 ? "neg" : saldo > 0 ? "pos" : ""}">${fmtDuracao(saldo, { sinal: true })}</b></div>
              </div>
              <p class="pj-note">As horas acumuladas já são usadas para abater as horas devendo. O saldo final é o que vale.</p>
            </section>

            <section class="pj-card pj-box pj-fade">
              <div class="pj-card-h"><h3><span class="pj-ic violet">${ICONS.calendar}</span>Próximos registros</h3></div>
              ${
                proximos.length
                  ? `<div class="pj-next">${proximos.map((s, i) => `
                      <div class="pj-nx ${i === 0 ? "cur" : ""}">
                        <span class="pj-ic ${corPasso[s.key]}">${iconePasso(s.key)}</span>
                        <div class="tx"><b>${s.label}</b><small>${i === 0 ? "próximo registro" : subtituloProximo[s.key]}</small></div>
                        <span class="hr">${previstoPorPasso[s.key] || "—"}</span>
                      </div>`).join("")}</div>`
                  : `<div class="pj-done">${ICONS.checkCircle}<b>Jornada concluída</b><span>Nenhum registro pendente hoje.</span></div>`
              }
              ${ultimoFeito ? `<p class="pj-last"><i></i>Último registro: <b>${ultimoFeito.label}</b> às ${ultimoFeito.hora}</p>` : ""}
            </section>

            <section class="pj-card pj-box pj-fade">
              <div class="pj-card-h"><h3><span class="pj-ic amber">${ICONS.edit}</span>Ajustar ponto</h3></div>
              <p class="pj-text">Esqueceu de bater ou registrou um horário errado? Solicite a correção ou o lançamento atrasado. O RH analisa e confirma.</p>
              <div class="pj-tips">
                <div>${ICONS.check}Bata o ponto sempre no horário certo</div>
                <div>${ICONS.check}Permita a localização ao registrar a entrada</div>
              </div>
              <button type="button" class="pj-btn" id="btn-ajustar-ponto">${ICONS.edit}<span>Solicitar ajuste de ponto</span></button>
            </section>
          </div>
        </div>
      `;

      document.getElementById("punch-track").innerHTML = renderPunchTrack(steps, previstoPorPasso);
      document.querySelectorAll("#aba-conteudo .pj-fade").forEach((el, i) => { el.style.animationDelay = `${i * 0.05}s`; });
      iniciarRelogioAoVivo();

      document.getElementById("btn-ajustar-ponto")?.addEventListener("click", abrirModalAjustePonto);

      document.getElementById("btn-bater")?.addEventListener("click", async () => {
        if (!navigator.onLine) { showToast("Sem conexão. Não foi possível registrar o ponto.", "error"); render(); return; }
        // Virou o dia com a tela aberta: recarrega (novo dia começa vazio) em
        // vez de gravar a batida em cima dos horários do dia anterior.
        if (await verificarViradaDoDia()) return;
        // Regra do intervalo checada ANTES de pedir a localização (evita
        // pedir GPS para depois recusar a batida). Revalidada na confirmação.
        const bloqueioPrevio = rhValidarBatidaIntervalo(nextStep.key, horaAgora(), p.hoje, configPonto);
        if (bloqueioPrevio) {
          showToast(bloqueioPrevio, "error");
          const h = document.getElementById("cta-hint");
          if (h) { h.textContent = bloqueioPrevio; h.classList.add("is-error"); }
          return;
        }
        // LOCALIZAÇÃO OBRIGATÓRIA NA ENTRADA: o modal só libera o registro
        // com uma localização válida; o local (Na empresa / Home Office) sai
        // da distância até a sede (raio de 500 m) — ver abrirModalLocalPonto.
        // Localização só na ENTRADA (primeiro ponto do dia): define o local
        // do dia (Na empresa / Home Office). As demais batidas registram
        // direto, mantendo o local e a localização da entrada.
        if (nextStep.key !== "entrada") {
          registrarProximoPontoUI(nextStep, DEMO.ponto.hoje.local, null);
          return;
        }
        abrirModalLocalPonto({ titulo: nextStep.ctaLabel || "Registrar ponto", rotuloAcao: "Registrar ponto" }, (local, geo) => {
          registrarProximoPontoUI(nextStep, local, geo);
        });
      });
    }

    function piscarSucesso() {
      const btn = document.getElementById("btn-bater");
      if (!btn) return;
      btn.classList.add("just-saved");
      setTimeout(() => btn.classList.remove("just-saved"), 750);
    }

    /** Junta a leitura desta batida ao geo do dia. Mantém lat/lng/precisao
     * no topo (última leitura — é o que o pin do mapa abre) e guarda a
     * leitura de CADA batida em geo.batidas, para o histórico ter a
     * localização de todas as marcações do dia, não só da última. */
    function geoComBatida(geoAnterior, key, local, geo) {
      const batidas = { ...(geoAnterior && typeof geoAnterior.batidas === "object" ? geoAnterior.batidas : {}) };
      batidas[key] = { ...geo, local };
      return { ...geo, local, batidas };
    }

    function registrarProximoPontoUI(nextStep, local, geo) {
      const btn = document.getElementById("btn-bater");
      if (btn) {
        btn.disabled = true;
        btn.classList.add("is-saving");
        btn.innerHTML = `<span class="spinner spinner-sm"></span><span>Registrando...</span>`;
      }
      _batendoPonto = true;
      (async () => {
        const p = DEMO.ponto;
        const antes = { local: p.hoje.local, geo: p.hoje.geo, entrada: p.hoje.entrada, intervaloSaida: p.hoje.intervaloSaida, intervaloVolta: p.hoje.intervaloVolta, saida: p.hoje.saida };
        try {
          if (nextStep.key === "entrada" && (!geo || !Number.isFinite(Number(geo.lat)) || !Number.isFinite(Number(geo.lng)))) {
            throw new Error("é necessário permitir o acesso à localização para registrar o ponto.");
          }
          if (await verificarViradaDoDia()) return;
          const hora = horaAgora();
          // Regra do intervalo (mínimo de 60 min por padrão e, se o RH
          // configurou, horário mínimo para iniciar o almoço). A mesma regra
          // também é garantida no banco (trigger), então não dá para burlar.
          const bloqueio = rhValidarBatidaIntervalo(nextStep.key, hora, p.hoje, configPonto);
          if (bloqueio) {
            showToast(bloqueio, "error");
            render();
            const h = document.getElementById("cta-hint");
            if (h) { h.textContent = bloqueio; h.classList.add("is-error"); }
            return;
          }
          if (geo) p.hoje.geo = geoComBatida(p.hoje.geo, nextStep.key, local, geo);
          if (nextStep.key === "entrada") { p.hoje.entrada = hora; p.hoje.local = local; }
          else if (nextStep.key === "intervaloSaida") p.hoje.intervaloSaida = hora;
          else if (nextStep.key === "intervaloVolta") p.hoje.intervaloVolta = hora;
          else if (nextStep.key === "saida") p.hoje.saida = hora;
          else throw new Error("Etapa de ponto desconhecida.");
          await persistirPonto();
          showToast(`✓ Ponto registrado com sucesso${LOCAL_PONTO_LABELS[p.hoje.local] ? ` (${LOCAL_PONTO_LABELS[p.hoje.local]})` : ""} — horário registrado: ${hora}.`, "success");
          render();
          requestAnimationFrame(piscarSucesso);
        } catch (err) {
          Object.assign(p.hoje, antes);
          if (err?.code === "DIA_VIROU") { await verificarViradaDoDia({ avisar: false }); showToast(err.message, "info"); return; }
          // Redesenha a tela: o botão volta ao rótulo da etapa (antes ficava
          // preso em "Registrando...") e o motivo do erro aparece por extenso.
          const motivo = "Não foi possível registrar o ponto: " + (err?.message || err);
          render();
          const h = document.getElementById("cta-hint");
          if (h) { h.textContent = motivo; h.classList.add("is-error"); }
          showToast(motivo, "error");
        } finally {
          _batendoPonto = false;
        }
      })();
    }

    function horaAgora() {
      // Fallback: se o navegador ainda estiver com uma versão antiga de
      // js/rh-ponto-data.js em cache, não quebra a tela inteira.
      if (typeof rhHoraAgoraPonto === "function") return rhHoraAgoraPonto();
      return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
    }

    // ------------------------------------------------------------------
    // Ajustar ponto — o colaborador não edita o próprio registro
    // diretamente (só o RH pode alterar oficialmente, ver "alteradoPeloRH"
    // no histórico); em vez disso essa ação abre uma solicitação que entra
    // na fila do RH (mesma fila de "Solicitações"), pra manter uma trilha
    // de aprovação de quem mudou o quê.
    //
    // Dois modos, escolhidos no passo 1 do modal:
    //   "dia"    — ajuste do dia inteiro: até 4 campos fixos (Entrada,
    //              Saída intervalo, Retorno intervalo, Saída), cada um com
    //              seu próprio horário (em branco = não se aplica esse dia).
    //   "pontos" — um ou mais registros específicos: lista dinâmica de
    //              linhas, cada uma com o SEU PRÓPRIO estado {campo,
    //              horario} — corrige o bug em que trocar o "Registro" no
    //              formulário antigo mantinha o horário digitado antes,
    //              porque havia um único <input type="time"> compartilhado
    //              por qualquer registro escolhido. Aqui cada linha tem seu
    //              próprio <input>, então nenhum valor "vaza" de um
    //              registro para outro.
    // A solicitação sempre grava `itens: [{campo, campoLabel, horario}, ...]`
    // — 1 item no caso mais simples, vários quando o colaborador pede mais
    // de um ajuste no mesmo dia (ver rhCriarAjustePonto/rhResolverAjustePonto
    // em js/rh-ponto-data.js, que aplicam todos os itens de uma vez).
    // ------------------------------------------------------------------
    const REGISTRO_LABELS = { entrada: "Entrada", intervaloSaida: "Saída intervalo", intervaloVolta: "Retorno intervalo", saida: "Saída" };
    const REGISTRO_ORDEM = ["entrada", "intervaloSaida", "intervaloVolta", "saida"];

    let ajusteModo = "pontos";
    let pontosRows = [];
    let _pontosRowSeq = 1;

    function novaLinhaPonto() {
      const usados = pontosRows.map((r) => r.campo);
      const campo = REGISTRO_ORDEM.find((c) => !usados.includes(c)) || REGISTRO_ORDEM[0];
      return { id: _pontosRowSeq++, campo, horario: "" };
    }

    function abrirModalAjustePonto() {
      document.getElementById("form-ajuste-ponto").reset();
      ajusteModo = "pontos";
      pontosRows = [novaLinhaPonto()];
      const dataInput = document.getElementById("ajuste-data");
      dataInput.value = todayIso();
      dataInput.max = todayIso();
      atualizarModoAjuste();
      openModal("modal-ajuste-ponto");
    }

    // Escolha do modo (passo 1) — botões estáticos do modal, os listeners
    // são presos uma única vez aqui (não dentro de abrirModalAjustePonto,
    // que roda de novo a cada abertura do modal e duplicaria os handlers).
    document.querySelectorAll('#modal-ajuste-ponto [data-modo]').forEach((btn) =>
      btn.addEventListener("click", () => {
        if (ajusteModo === btn.dataset.modo) return;
        ajusteModo = btn.dataset.modo;
        if (ajusteModo === "pontos" && !pontosRows.length) pontosRows = [novaLinhaPonto()];
        atualizarModoAjuste();
      })
    );

    function atualizarModoAjuste() {
      document.querySelectorAll('#modal-ajuste-ponto [data-modo]').forEach((b) => b.classList.toggle("selected", b.dataset.modo === ajusteModo));
      document.getElementById("ajuste-modo-hint").textContent =
        ajusteModo === "dia"
          ? "Informe os horários certos de todos os registros do dia — deixe em branco o que não se aplica."
          : "Escolha exatamente quais registros do dia precisam de correção ou lançamento, um por linha.";
      renderConteudoModoAjuste();
    }

    function renderConteudoModoAjuste() {
      const wrap = document.getElementById("ajuste-modo-conteudo");
      if (ajusteModo === "dia") {
        wrap.innerHTML = `
          <div class="ajuste-dia-grid">
            ${REGISTRO_ORDEM.map(
              (campo) => `
              <div class="ajuste-dia-field">
                <label>${iconePasso(campo)}${REGISTRO_LABELS[campo]}</label>
                <input type="time" id="ajuste-dia-${campo}" />
              </div>`
            ).join("")}
          </div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="ajuste-pontos-list" id="ajuste-pontos-list"></div>
        <button type="button" class="ajuste-add-ponto-btn" id="btn-add-ponto-ajuste">${ICONS.plus}<span>Adicionar outro ponto</span></button>`;
      renderPontosRows();
      document.getElementById("btn-add-ponto-ajuste").addEventListener("click", () => {
        if (pontosRows.length >= REGISTRO_ORDEM.length) return;
        pontosRows.push(novaLinhaPonto());
        renderPontosRows();
      });
    }

    // Lista dinâmica do modo "pontos" — cada linha tem campo (select) e
    // horário (input) independentes, guardados em `pontosRows`. As opções
    // do select excluem os campos já usados por OUTRAS linhas, pra evitar
    // pedir ajuste duplicado/contraditório do mesmo registro duas vezes.
    function renderPontosRows() {
      const list = document.getElementById("ajuste-pontos-list");
      if (!list) return;
      list.innerHTML = pontosRows
        .map((row) => {
          const usadosPorOutros = pontosRows.filter((r) => r.id !== row.id).map((r) => r.campo);
          const opcoes = REGISTRO_ORDEM.filter((c) => c === row.campo || !usadosPorOutros.includes(c));
          return `
          <div class="ajuste-ponto-row" data-row-id="${row.id}">
            <div class="field"><label>Registro</label>
              <select class="ajuste-ponto-campo" data-row-id="${row.id}">
                ${opcoes.map((c) => `<option value="${c}" ${c === row.campo ? "selected" : ""}>${REGISTRO_LABELS[c]}</option>`).join("")}
              </select>
            </div>
            <div class="field"><label>Horário</label>
              <input type="time" class="ajuste-ponto-horario" data-row-id="${row.id}" value="${row.horario || ""}" required />
            </div>
            ${pontosRows.length > 1 ? `<button type="button" class="ajuste-remove-row" data-row-id="${row.id}" title="Remover este ponto">${ICONS.trash}</button>` : ""}
          </div>`;
        })
        .join("");

      const addBtn = document.getElementById("btn-add-ponto-ajuste");
      if (addBtn) addBtn.disabled = pontosRows.length >= REGISTRO_ORDEM.length;

      list.querySelectorAll(".ajuste-ponto-campo").forEach((sel) =>
        sel.addEventListener("change", (e) => {
          const row = pontosRows.find((r) => r.id === Number(e.target.dataset.rowId));
          if (row) row.campo = e.target.value;
          renderPontosRows();
        })
      );
      list.querySelectorAll(".ajuste-ponto-horario").forEach((inp) =>
        inp.addEventListener("input", (e) => {
          const row = pontosRows.find((r) => r.id === Number(e.target.dataset.rowId));
          if (row) row.horario = e.target.value;
        })
      );
      list.querySelectorAll(".ajuste-remove-row").forEach((btn) =>
        btn.addEventListener("click", (e) => {
          pontosRows = pontosRows.filter((r) => r.id !== Number(e.currentTarget.dataset.rowId));
          renderPontosRows();
        })
      );
    }

    function coletarItensAjuste() {
      if (ajusteModo === "dia") {
        return REGISTRO_ORDEM.map((campo) => ({
          campo,
          campoLabel: REGISTRO_LABELS[campo],
          horario: document.getElementById(`ajuste-dia-${campo}`)?.value || "",
        })).filter((it) => it.horario);
      }
      return pontosRows
        .map((r) => ({ campo: r.campo, campoLabel: REGISTRO_LABELS[r.campo], horario: r.horario || "" }))
        .filter((it) => it.horario);
    }

    document.getElementById("form-ajuste-ponto").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btnEnviar = document.getElementById("btn-enviar-ajuste-ponto");
      const data = document.getElementById("ajuste-data").value;
      const justificativa = document.getElementById("ajuste-justificativa").value.trim();
      const itens = coletarItensAjuste();

      if (!data) { showToast("Selecione a data do ajuste.", "error"); return; }
      if (!itens.length) { showToast("Informe pelo menos um horário para ajustar.", "error"); return; }

      btnEnviar.disabled = true;
      try {
        // Pedido de verdade: uma linha real em rh.solicitacoes (RLS só deixa
        // o colaborador criar a própria, sempre PENDENTE — só o RH pode
        // aprovar/recusar). Visível pelo RH em qualquer aba/dispositivo,
        // não depende mais do navegador de quem pediu.
        const solicitacao = await rhCriarAjustePonto({
          colaboradorId: session.employeeId, colaboradorNome: session.name,
          data, modo: ajusteModo, itens, justificativa,
        });
        pendentesMap = await rhDiasComAjustePendente(session.employeeId);
        aplicarPendentes();
        closeModal("modal-ajuste-ponto");
        showToast(`Solicitação ${solicitacao.protocolo} enviada ao RH.`, "success");
        if (abaAtiva === "historico") renderHistorico();
      } catch (erro) {
        showToast("Não foi possível enviar a solicitação: " + (erro?.message || erro), "error");
      } finally {
        btnEnviar.disabled = false;
      }
    });

    function iniciarRelogioAoVivo() {
      clearInterval(_clockInterval);
      _clockInterval = setInterval(() => {
        const el = document.getElementById("ponto-clock");
        if (!el) { clearInterval(_clockInterval); return; }
        el.textContent = horaAgora();
        const sEl = document.getElementById("ponto-clock-s");
        if (sEl) sEl.textContent = ":" + String(new Date().getSeconds()).padStart(2, "0");
      }, 1000);
    }

    function renderPunchTrack(steps, previstos = {}) {
      let currentSet = false;
      return steps
        .map((s, i) => {
          const done = !!s.hora;
          const isCurrent = !done && !currentSet;
          if (isCurrent) currentSet = true;
          const prev = previstos[s.key];
          return `
          <div class="pj-st ${done ? "done" : isCurrent ? "now" : "todo"}">
            <div class="pj-dot">${done ? ICONS.check : i + 1}</div>
            <b>${s.label}</b>
            <div class="t">${s.hora || (isCurrent ? "Aguardando" : "—")}</div>
            ${prev && !(s.key === "saida" && done) ? `<div class="p">previsto ${prev}</div>` : ""}
          </div>`;
        })
        .join("");
    }

    // ------------------------------------------------------------------
    // Aba "Histórico"
    // ------------------------------------------------------------------
    function renderHistorico() {
      document.getElementById("aba-conteudo").innerHTML = `
        <div class="space-y">
          <div class="card card-p history-period-card">
            <div class="history-filter-bar">
              <div class="history-period-tabs">
                <button type="button" data-periodo="dia" class="${periodoTipo === "dia" ? "active" : ""}">Dia</button>
                <button type="button" data-periodo="semana" class="${periodoTipo === "semana" ? "active" : ""}">Semana</button>
                <button type="button" data-periodo="mes" class="${periodoTipo === "mes" ? "active" : ""}">Mês</button>
                <button type="button" data-periodo="personalizado" class="${periodoTipo === "personalizado" ? "active" : ""}">Personalizado</button>
              </div>
              <div id="periodo-controles" class="history-period-control"></div>
            </div>
            <div class="history-body">
              <div class="history-section-head">
                <div>
                  <strong style="font-size:.86rem;color:#1d2939">Histórico de jornada</strong>
                  <span id="history-context" class="history-context"></span>
                </div>
                <span id="history-count" class="history-context"></span>
              </div>
              <div id="calendario-wrap"></div>
              <div class="history-legend">
                <span class="item"><span class="dot" style="background:var(--emerald-500)"></span>Trabalhado</span>
                <span class="item"><span class="dot" style="background:var(--indigo-500)"></span>Home office</span>
                <span class="item"><span class="dot" style="background:var(--amber-500)"></span>Atraso</span>
                <span class="item"><span class="dot" style="background:var(--red-500)"></span>Falta</span>
                <span class="item"><span class="dot" style="background:var(--violet-500)"></span>Ajuste pendente</span>
                <span class="item"><span class="dot" style="background:var(--indigo-600)"></span>Alterado pelo RH</span>
              </div>
            </div>
          </div>

          <div class="card card-p table-scroll">
            <div class="row-between" style="align-items:center;gap:.75rem"><h2 style="margin:0">Registros detalhados</h2><span style="font-size:.72rem;color:#98a2b3;font-weight:600;display:inline-flex;align-items:center;gap:.3rem">${ICONS.mapPin} Abrir localização no mapa</span></div>
            <div id="tabela-historico"></div>
          </div>
        </div>
      `;

      renderControlesPeriodo();
      renderCalendario();
      renderTabelaHistorico();

      document.querySelectorAll("[data-periodo]").forEach((btn) =>
        btn.addEventListener("click", () => {
          periodoTipo = btn.dataset.periodo;
          if (periodoTipo === "dia" || periodoTipo === "semana") {
            diaSelecionado = diaSelecionado || todayIso();
          }
          if (periodoTipo === "mes") {
            const [y, m] = (diaSelecionado || todayIso()).split("-").map(Number);
            mesRef = { ano: y, mes: m - 1 };
          }
          renderHistorico();
        })
      );
    }

    function fmtDateBR(iso) {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }

    function mudarDia(deltaDias) {
      const d = new Date(diaSelecionado + "T00:00:00");
      d.setDate(d.getDate() + deltaDias);
      diaSelecionado = isoOf(d);
      renderControlesPeriodo();
      renderCalendario();
      renderTabelaHistorico();
    }

    function semanaInicioFim(iso) {
      const d = new Date(iso + "T00:00:00");
      const dow = (d.getDay() + 6) % 7;
      const ini = new Date(d); ini.setDate(d.getDate() - dow);
      const fim = new Date(ini); fim.setDate(ini.getDate() + 6);
      return { inicio: isoOf(ini), fim: isoOf(fim) };
    }

    function renderControlesPeriodo() {
      const el = document.getElementById("periodo-controles");
      const ctx = document.getElementById("history-context");
      if (!el) return;

      if (periodoTipo === "mes") {
        const nome = `${MESES[mesRef.mes]}/${mesRef.ano}`;
        el.innerHTML = `
          <div class="history-stepper">
            <button type="button" class="step-btn" id="mes-prev" aria-label="Mês anterior">${ICONS.chevronLeft}</button>
            <span class="history-period-label">${nome}</span>
            <button type="button" class="history-calendar-button" title="Escolher mês">${ICONS.calendar}<input type="month" id="mes-input" value="${mesRef.ano}-${String(mesRef.mes + 1).padStart(2,"0")}" aria-label="Selecionar mês"></button>
            <button type="button" class="step-btn" id="mes-next" aria-label="Próximo mês">${ICONS.chevronRight}</button>
          </div>`;
        document.getElementById("mes-prev").addEventListener("click", () => mudarMes(-1));
        document.getElementById("mes-next").addEventListener("click", () => mudarMes(1));
        document.getElementById("mes-input").addEventListener("change", (e) => {
          if (!e.target.value) return;
          const [y,m] = e.target.value.split("-").map(Number);
          mesRef = { ano:y, mes:m-1 };
          renderControlesPeriodo(); renderCalendario(); renderTabelaHistorico();
        });
        if (ctx) ctx.textContent = "Visão mensal";
      } else if (periodoTipo === "dia" || periodoTipo === "semana") {
        const isSemana = periodoTipo === "semana";
        const faixa = semanaInicioFim(diaSelecionado);
        const label = isSemana ? `${fmtDateBR(faixa.inicio).slice(0,5)}–${fmtDateBR(faixa.fim).slice(0,5)}/${faixa.fim.slice(0,4)}` : fmtDateBR(diaSelecionado);
        const passo = isSemana ? 7 : 1;
        el.innerHTML = `
          <div class="history-stepper">
            <button type="button" class="step-btn" id="dia-prev" aria-label="Anterior">${ICONS.chevronLeft}</button>
            <span class="history-period-label">${label}</span>
            <button type="button" class="history-calendar-button" title="Escolher data">${ICONS.calendar}<input type="date" id="dia-input" value="${diaSelecionado}" aria-label="Selecionar data" /></button>
            <button type="button" class="step-btn" id="dia-next" aria-label="Próximo">${ICONS.chevronRight}</button>
          </div>`;
        document.getElementById("dia-prev").addEventListener("click", () => mudarDia(-passo));
        document.getElementById("dia-next").addEventListener("click", () => mudarDia(passo));
        document.getElementById("dia-input").addEventListener("change", (e) => {
          diaSelecionado = e.target.value || todayIso();
          renderControlesPeriodo(); renderCalendario(); renderTabelaHistorico();
        });
        if (ctx) ctx.textContent = isSemana ? `Semana de ${fmtDateBR(faixa.inicio)} a ${fmtDateBR(faixa.fim)}` : `Dia ${fmtDateBR(diaSelecionado)}`;
      } else {
        if (!rangeInicio) rangeInicio = "2026-09-01";
        if (!rangeFim) rangeFim = todayIso();
        el.innerHTML = `
          <div class="history-range">
            <input type="date" id="range-inicio" value="${rangeInicio}" aria-label="Data inicial" />
            <span class="range-sep">até</span>
            <input type="date" id="range-fim" value="${rangeFim}" aria-label="Data final" />
            <span class="range-count">${intervaloValido() ? `${registrosDoPeriodo().length} registros` : "Ajuste o período"}</span>
          </div>`;
        document.getElementById("range-inicio").addEventListener("change", (e) => { rangeInicio = e.target.value; renderControlesPeriodo(); renderCalendario(); renderTabelaHistorico(); });
        document.getElementById("range-fim").addEventListener("change", (e) => { rangeFim = e.target.value; renderControlesPeriodo(); renderCalendario(); renderTabelaHistorico(); });
        if (ctx) ctx.textContent = intervaloValido() ? `De ${fmtDateBR(rangeInicio)} a ${fmtDateBR(rangeFim)}` : "Período inválido";
      }
    }

    function intervaloValido() {
      return !!rangeInicio && !!rangeFim && rangeInicio <= rangeFim;
    }

    function mudarMes(delta) {
      mesRef.mes += delta;
      if (mesRef.mes < 0) { mesRef.mes = 11; mesRef.ano--; }
      if (mesRef.mes > 11) { mesRef.mes = 0; mesRef.ano++; }
      renderControlesPeriodo();
      renderCalendario();
      renderTabelaHistorico();
    }

    function diaClasse(rec, isToday) {
      let base = "futuro";
      if (rec) {
        if (rec.pendenteAjuste) base = "pendente";
        else if (rec.status === "falta") base = "falta";
        else if (rec.status === "atraso") base = "atraso";
        else if (rec.horasExtras > 0) base = "extra";
        else if (rec.status === "completo" || rec.status === "hoje") base = "completo";
      }
      return `${base}${isToday ? " hoje" : ""}${rec?.alteradoPeloRH ? " corrigido" : ""}`;
    }

    function renderCalendario() {
      if (periodoTipo === "dia" || periodoTipo === "semana") renderCalendarioSemanaOuDia();
      else if (periodoTipo === "mes") renderCalendarioMes();
      else renderCalendarioPersonalizado();
    }

    function renderCalendarioPersonalizado() {
      const wrap = document.getElementById("calendario-wrap");
      if (!intervaloValido()) {
        wrap.innerHTML = `<div class="history-empty-range">Selecione uma data inicial anterior ou igual à data final para consultar o período.</div>`;
        return;
      }
      const rows = registrosDoPeriodo().slice().sort((a,b) => a.data.localeCompare(b.data));
      const totalHoras = rows.reduce((acc, r) => acc + (Number(r.horasTrabalhadas) || 0), 0);
      const atrasos = rows.reduce((acc, r) => acc + (Number(r.atrasoMin) || 0), 0);
      wrap.innerHTML = `
        <div class="history-custom-summary">
          <span class="history-summary-chip">Período <strong>${fmtDateBR(rangeInicio)}–${fmtDateBR(rangeFim)}</strong></span>
          <span class="history-summary-chip">Registros <strong>${rows.length}</strong></span>
          <span class="history-summary-chip">Horas <strong>${fmtHoras(totalHoras)}</strong></span>
          <span class="history-summary-chip">Atrasos <strong>${atrasos ? fmtMinutos(-atrasos) : "0:00m"}</strong></span>
        </div>
        ${rows.length ? `<div class="history-week">${rows.map((r) => weekDayCardHtml(r.data, {selected:false})).join("")}</div>` : `<div class="history-empty-range">Nenhum registro encontrado no período selecionado.</div>`}`;
      wrap.querySelectorAll("[data-dia]").forEach((cell) =>
        cell.addEventListener("click", () => {
          diaSelecionado = cell.dataset.dia;
          renderControlesPeriodo(); renderCalendario(); renderTabelaHistorico();
        })
      );
    }

    // Cartões de dia (visões "Dia" e "Semana") — mostram status e horário
    // diretamente no card, no espírito de uma agenda semanal.
    function weekDayCardHtml(iso, { selected }) {
      const rec = porData(iso);
      const d = new Date(iso + "T00:00:00");
      const dowShort = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"][d.getDay()];
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = iso === todayIso();

      let bucket = "semregistro", statusLabel = "Sem registro", timeLabel = "", metaLabel = "";
      if (rec?.pendenteAjuste) {
        // Enquanto o RH não resolve a solicitação de ajuste, o dia fica
        // marcado como "pendente" — assim que for aprovado, o registro
        // ganha alteradoPeloRH e volta ao fluxo normal (com o selo "corrigido").
        bucket = "pendente";
        statusLabel = "Ajuste pendente";
        metaLabel = rec.pendenteAjuste.modo === "dia" ? "Ajuste do dia aguardando RH" : "Ajuste de ponto aguardando RH";
      } else if (rec && rec.batidasFaltando?.length) {
        // Dia encerrado com batida esquecida: fica identificado no histórico
        // (nada foi apagado) — o colaborador pode pedir o ajuste ao RH.
        bucket = "atraso"; statusLabel = "Registro incompleto";
        timeLabel = rec.entrada ? `${rec.entrada} – ${rec.saida || "sem saída"}` : "";
        metaLabel = `Não registrado: ${rec.batidasFaltando.join(", ")}`;
      } else if (rec) {
        if (rec.status === "falta") {
          bucket = "falta"; statusLabel = "Falta";
        } else if (rec.status === "atraso") {
          bucket = "atraso"; statusLabel = "Atraso";
          timeLabel = rec.entrada ? (rec.saida ? `${rec.entrada} – ${rec.saida}` : `${rec.entrada} – em andamento`) : "";
          metaLabel = rec.atrasoMin ? `${fmtMinutos(-rec.atrasoMin)} de atraso` : "";
        } else if (rec.status === "completo" || rec.status === "hoje") {
          const isHome = rec.local === "HOME_OFFICE";
          const emAndamento = rec.status === "hoje" && !rec.saida;
          bucket = isHome ? "homeoffice" : "trabalhado";
          statusLabel = emAndamento ? "Em andamento" : "Trabalhado";
          timeLabel = rec.entrada ? (rec.saida ? `${rec.entrada} – ${rec.saida}` : `${rec.entrada} – em andamento`) : "";
          if (rec.horasExtras) timeLabel += ` · ${fmtDuracao(rec.horasExtras, { sinal: true })} extra`;
          // Rodapé: total de horas (quando já apurado) + local do registro —
          // mesma informação que a visão mensal já mostra na tabela detalhada.
          metaLabel = [rec.horasTrabalhadas != null ? fmtHoras(rec.horasTrabalhadas) : "", isHome ? "Home office" : "Presencial"].filter(Boolean).join(" · ");
        } else if (rec.status === "futuro") {
          bucket = isWeekend ? "fimdesemana" : "previsto";
          statusLabel = isWeekend ? "Fim de semana" : "Previsto";
        }
      } else if (isWeekend) {
        bucket = "fimdesemana"; statusLabel = "Fim de semana";
      }
      // Abono aprovado pelo RH: o dia aparece como "Abonado", não como falta.
      const abono = (!rec || rec.status === "falta" || rec.status === "futuro") && !rec?.pendenteAjuste ? abonoDoDia(iso) : null;
      if (abono) {
        bucket = "abonado"; statusLabel = "Abonado";
        metaLabel = RH_TIPOS_ABONO[abono.tipo]?.label || "Abono";
      }

      const classes = ["history-day-card", bucket];
      if (rec?.alteradoPeloRH) classes.push("corrigido");
      if (isToday) classes.push("is-today");
      else if (selected) classes.push("is-selected");

      const tituloCard = rec?.pendenteAjuste
        ? `Ajuste pendente — ${esc(resumoAjustePendente(rec.pendenteAjuste))}, aguardando aprovação do RH`
        : rec?.alteradoPeloRH
        ? esc(`Alterado pelo RH — ${rec.alteradoPeloRH.motivo}`)
        : "";

      return `
        <div class="${classes.join(" ")}" data-dia="${iso}" title="${tituloCard}">
          ${isToday ? `<span class="hoje-chip">Hoje</span>` : ""}
          <span class="dow">${dowShort}</span>
          <span class="num">${d.getDate()}</span>
          <span class="status-label">${statusLabel}</span>
          ${timeLabel ? `<span class="status-time">${timeLabel}</span>` : ""}
          ${metaLabel ? `<span class="status-meta">${metaLabel}${rec?.alteradoPeloRH ? " · Alterado pelo RH" : ""}</span>` : ""}
        </div>`;
    }

    function renderCalendarioSemanaOuDia() {
      const wrap = document.getElementById("calendario-wrap");
      let html;
      if (periodoTipo === "dia") {
        html = `<div class="history-single">${weekDayCardHtml(diaSelecionado, { selected: true })}</div>`;
      } else {
        const d = new Date(diaSelecionado + "T00:00:00");
        const dow = (d.getDay() + 6) % 7;
        const inicioSemana = new Date(d);
        inicioSemana.setDate(d.getDate() - dow);
        let cards = "";
        for (let i = 0; i < 7; i++) {
          const dia = new Date(inicioSemana);
          dia.setDate(inicioSemana.getDate() + i);
          const iso = isoOf(dia);
          cards += weekDayCardHtml(iso, { selected: iso === diaSelecionado });
        }
        html = `<div class="history-week">${cards}</div>`;
      }
      wrap.innerHTML = html;
      wrap.querySelectorAll("[data-dia]").forEach((cell) =>
        cell.addEventListener("click", () => {
          diaSelecionado = cell.dataset.dia;
          renderHistorico();
        })
      );
    }

    function renderCalendarioMes() {
      const wrap = document.getElementById("calendario-wrap");
      const ano = mesRef.ano, mes = mesRef.mes;
      const daysInMonth = new Date(ano, mes + 1, 0).getDate();
      const firstDow = (new Date(ano, mes, 1).getDay() + 6) % 7;
      const hoje = todayIso();

      let cells = "";
      for (let i = 0; i < firstDow; i++) cells += `<div class="history-month-cell blank"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${ano}-${String(mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const rec = porData(iso);
        const isToday = iso === hoje;
        const isSelected = iso === diaSelecionado;
        const tituloCell = rec?.pendenteAjuste ? "Ajuste pendente — aguardando aprovação do RH" : rec?.alteradoPeloRH ? "Alterado pelo RH — " + esc(rec.alteradoPeloRH.motivo) : "Selecionar dia";
        const abonoCell = (!rec || rec.status === "falta" || rec.status === "futuro") && !rec?.pendenteAjuste ? abonoDoDia(iso) : null;
        const classeCell = abonoCell ? `abonado${isToday ? " hoje" : ""}` : diaClasse(rec, isToday);
        cells += `<div class="history-month-cell clickable ${classeCell}${isSelected ? " selected" : ""}" data-dia="${iso}" title="${abonoCell ? "Abonado — " + esc(RH_TIPOS_ABONO[abonoCell.tipo]?.label || "") : tituloCell}"><span>${d}</span>${rec && rec.status !== "futuro" ? '<span class="dot"></span>' : ""}</div>`;
      }
      wrap.innerHTML = `
        <div class="history-month-head"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span></div>
        <div class="history-month-grid">${cells}</div>`;
      wrap.querySelectorAll("[data-dia]").forEach((cell) =>
        cell.addEventListener("click", () => {
          diaSelecionado = cell.dataset.dia;
          renderControlesPeriodo(); renderCalendario(); renderTabelaHistorico();
        })
      );
    }

    function registrosDoPeriodo() {
      const all = DEMO.ponto.historico.filter((h) => h.status !== "futuro");
      if (periodoTipo === "dia") return all.filter((h) => h.data === diaSelecionado);
      if (periodoTipo === "semana") {
        const d = new Date(diaSelecionado + "T00:00:00");
        const dow = (d.getDay() + 6) % 7;
        const inicio = new Date(d); inicio.setDate(d.getDate() - dow);
        const fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);
        return all.filter((h) => h.data >= isoOf(inicio) && h.data <= isoOf(fim));
      }
      if (periodoTipo === "personalizado") return intervaloValido() ? all.filter((h) => h.data >= rangeInicio && h.data <= rangeFim) : [];
      // mês
      const prefixo = `${mesRef.ano}-${String(mesRef.mes + 1).padStart(2, "0")}`;
      return all.filter((h) => h.data.startsWith(prefixo));
    }
    function isoOf(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

    function renderTabelaHistorico() {
      const rows = registrosDoPeriodo().slice().reverse();
      const countEl = document.getElementById("history-count");
      if (countEl) countEl.textContent = `${rows.length} ${rows.length === 1 ? "registro" : "registros"}`;
      document.getElementById("tabela-historico").innerHTML = rows.length
        ? `
        <table>
          <thead><tr><th>Data</th><th>Entrada</th><th>Saída</th><th>Intervalo</th><th class="cell-num">Horas</th><th class="cell-num">Extras</th><th class="cell-num">Atraso</th><th>Local</th><th>Status</th><th>RH</th></tr></thead>
          <tbody>
            ${rows
              .map(
                (h) => `<tr>
              <td>${fmtDate(h.data)}</td>
              <td>${h.entrada || "—"}</td>
              <td>${h.saida || (h.batidasFaltando?.length ? "Não registrada" : h.data === todayIso() && h.entrada ? "Em andamento" : "—")}</td>
              <td>${h.intervaloSaida && h.intervaloVolta ? `${h.intervaloSaida}–${h.intervaloVolta}` : "—"}${Number(h.descontoAlmocoH) > 0 ? `<small class="intervalo-excesso" title="Intervalo passou do mínimo (1h) e não foi compensado no dia — conta como horas negativas no banco de horas.">${fmtMinutos(-Math.round(Number(h.descontoAlmocoH) * 60))} intervalo</small>` : ""}</td>
              <td class="cell-num">${h.horasTrabalhadas != null ? fmtHoras(h.horasTrabalhadas) : "—"}</td>
              <td class="cell-num">${h.horasExtras ? fmtDuracao(h.horasExtras, { sinal: true }) : "—"}</td>
              <td class="cell-num">${h.atrasoMin ? fmtMinutos(-h.atrasoMin) : "—"}</td>
              <td>${localBadgeHtml(h.local)}${geoLinkForPonto(h.geo, h.data)}</td>
              <td>${h.batidasFaltando?.length ? `<span class="status-badge status-ATRASO" title="Não registrado: ${esc(h.batidasFaltando.join(", "))}">Incompleto</span>` : statusPillPonto(h.status)}</td>
              <td>${h.alteradoPeloRH ? `<span class="badge-alterado" title="${esc(h.alteradoPeloRH.motivo)} — ${fmtDate(h.alteradoPeloRH.em.slice(0,10))}">${ICONS.edit}Alterado</span>` : "—"}</td>
            </tr>`
              )
              .join("")}
          </tbody>
        </table>`
        : emptyStateHtml({ icon: ICONS.calendar, title: "Nenhum registro neste período", desc: "Selecione um dia no calendário para ver os detalhes da sua jornada." });
    }

    function statusPillPonto(status) {
      const map = { completo: ["status-DONE", "Completo"], atraso: ["status-ATRASO", "Atraso"], falta: ["status-CANCELED", "Falta"], hoje: ["status-EM_ANALISE", "Em andamento"] };
      const [cls, label] = map[status] || ["badge-neutral", status];
      return `<span class="status-badge ${cls}">${label}</span>`;
    }

    // Reconecte/perca conexão: se a tela "Hoje" estiver aberta, o botão de
    // registrar ponto e o status da jornada precisam refletir isso na hora.
    window.addEventListener("online", () => { if (abaAtiva === "hoje") render(); });
    window.addEventListener("offline", () => { if (abaAtiva === "hoje") render(); });

    if (session) {
      renderShell(session, NAV_COLABORADOR);
      renderTopHeader(document.getElementById("top-header"), session, { notifications: [] });
      render();
      initLembretePonto(session.horarioPrevisto, DEMO.ponto.hoje);
      wireModalClosers();
    }
  
})();
</script>
