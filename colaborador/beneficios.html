<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benefícios — BSconta+ RH</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/theme-v2.css" />
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="top-header" class="top-header"></div>
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <script>window.BASE_PATH = "../";</script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/rh-supabase-auth.js"></script>
  <script src="../js/rh-beneficios-data.js"></script>
  <script src="../js/rh-historia-data.js"></script>
  <script src="../js/rh-historia-ui.js"></script>
  <script>
(async function () {
    const session = await requireRoleReal("COLABORADOR");
    if (!session) return;
    const TONE_BG = { orange: "var(--orange-50)", red: "var(--red-50)", indigo: "var(--indigo-50)", teal: "var(--teal-50)", violet: "var(--violet-50)", green: "var(--emerald-50)" };
    const TONE_FG = { orange: "var(--orange-600)", red: "var(--red-600)", indigo: "var(--indigo-600)", teal: "var(--teal-600)", violet: "var(--violet-600)", green: "var(--emerald-600)" };

    // Cada benefício vira um card clicável. Quando o RH registrou os
    // detalhes (rh.colaborador_beneficios), o card mostra valor e desconto
    // e o clique abre o card de detalhes no meio da tela.
    let itens = [];
    function montarItens(meusBeneficios, minhasConcessoes) {
      const usadas = new Set();
      const norm = (t) => String(t || "").trim().toLowerCase();
      const lista = meusBeneficios.map((b) => {
        const c = minhasConcessoes.find((x) => !usadas.has(x.id) && (x.beneficio_id === b.id || norm(x.beneficio) === norm(b.nome)));
        if (c) usadas.add(c.id);
        return { id: "b-" + b.id, nome: b.nome, desc: b.desc, icon: b.icon, tone: b.tone, status: b.status, concessao: c || null };
      });
      minhasConcessoes.filter((c) => !usadas.has(c.id)).forEach((c) => lista.push({ id: "c-" + c.id, nome: c.beneficio, desc: c.descricao, icon: "heart", tone: "indigo", status: c.status, concessao: c }));
      return lista;
    }
    const PERIODO_CURTO = { MENSAL: "/mês", QUINZENAL: "/quinzena", SEMANAL: "/semana", DIARIO: "/dia", ANUAL: "/ano", UNICO: "" };

    function render() {
      document.getElementById("content").innerHTML = `
        <div class="space-y">
          <div class="row-between">
            <div>
              <h1 class="page-title">Benefícios</h1>
              <p class="page-sub">Seus benefícios na BSconta+. Toque em um benefício para ver os detalhes.</p>
            </div>
            <a href="solicitacoes.html" class="btn-ghost">${ICONS.messageSquare}<span>Solicitar alteração</span></a>
          </div>
          ${itens.length
            ? `<div class="benefit-grid">${itens.map((it) => {
                const c = it.concessao;
                return `
              <button type="button" class="card benefit-card benefit-card-click" data-beneficio="${it.id}">
                <div class="benefit-icon" style="background:${TONE_BG[it.tone] || TONE_BG.indigo};color:${TONE_FG[it.tone] || TONE_FG.indigo}">${ICONS[it.icon] || ICONS.heart}</div>
                <div style="flex:1;min-width:0;text-align:left">
                  <div class="row-between" style="margin-bottom:0.1rem">
                    <p class="title">${esc(it.nome)}</p>
                    ${statusBadgeHtml(it.status, STATUS_LABELS)}
                  </div>
                  <p class="desc">${esc(it.desc || "")}</p>
                  ${c ? `<div class="benefit-values">
                    ${c.valor != null ? `<span class="bf-valor">${rhBrl(c.valor)}<small>${PERIODO_CURTO[c.periodicidade] || ""}</small></span>` : ""}
                    ${c.possui_desconto ? `<span class="doc-missing" style="font-weight:700">${ICONS.dollarSign}<span>Desconto ${rhBrl(c.valor_desconto)}</span></span>` : `<span class="badge badge-green">Sem desconto</span>`}
                  </div>` : ""}
                </div>
                <span class="bf-chevron">${ICONS.chevronRight}</span>
              </button>`;
              }).join("")}</div>`
            : emptyStateHtml({ icon: ICONS.heart, title: "Nenhum benefício por aqui", desc: "Ainda não há benefícios atribuídos a você. Fale com o RH se acha que algo está faltando." })}
        </div>`;
      document.querySelectorAll("[data-beneficio]").forEach((b) => b.addEventListener("click", () => abrirDetalhe(itens.find((x) => x.id === b.dataset.beneficio))));
    }

    function abrirDetalhe(it) {
      if (!it) return;
      const c = it.concessao;
      let overlay = document.getElementById("modal-beneficio-detalhe");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.id = "modal-beneficio-detalhe";
        overlay.innerHTML = '<div class="modal" style="max-width:520px"></div>';
        document.body.appendChild(overlay);
        overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") overlay.classList.remove("open"); });
      }
      const info = (l, v) => `<div class="ad-info"><span>${l}</span><strong>${v}</strong></div>`;
      const liquido = c && c.valor != null ? Number(c.valor) - (c.possui_desconto ? Number(c.valor_desconto || 0) : 0) : null;
      overlay.querySelector(".modal").innerHTML = `
        <div class="modal-header">
          <div class="ad-head">
            <div class="benefit-icon" style="width:44px;height:44px;background:${TONE_BG[it.tone] || TONE_BG.indigo};color:${TONE_FG[it.tone] || TONE_FG.indigo}">${ICONS[it.icon] || ICONS.heart}</div>
            <div><h3>${esc(it.nome)}</h3>${it.desc ? `<p class="page-sub" style="margin:.15rem 0 0">${esc(it.desc)}</p>` : ""}</div>
          </div>
          <button type="button" class="modal-close" data-fechar aria-label="Fechar">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem">${statusBadgeHtml(it.status, STATUS_LABELS)}${c?.informado_em ? `<span class="hint">Informado pelo RH em ${new Date(c.informado_em).toLocaleDateString("pt-BR")}</span>` : ""}</div>
          ${c ? `
            <div class="bf-destaque">
              <div><span>Valor do benefício</span><strong>${c.valor != null ? rhBrl(c.valor) : "—"}</strong><small>${esc(RH_PERIODICIDADE[c.periodicidade] || "")}</small></div>
              <div class="${c.possui_desconto ? "is-desconto" : ""}"><span>Desconto</span><strong>${c.possui_desconto ? "− " + rhBrl(c.valor_desconto) : "Sem desconto"}</strong><small>${c.possui_desconto ? "descontado de você" : ""}</small></div>
              ${liquido != null ? `<div class="is-liquido"><span>Você recebe</span><strong>${rhBrl(liquido)}</strong><small>${esc(RH_PERIODICIDADE[c.periodicidade] || "")}</small></div>` : ""}
            </div>
            <div class="ad-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:1rem">
              ${info("Início", fmtDate(c.data_inicio))}
              ${info("Término", c.data_fim ? fmtDate(c.data_fim) : "Sem data de término")}
            </div>
            ${c.descricao ? `<div class="ad-bloco"><span>Descrição</span><p>${esc(c.descricao)}</p></div>` : ""}`
          : `<p class="page-sub" style="margin:0">O RH ainda não registrou valor, periodicidade ou desconto para este benefício. Se tiver dúvidas, abra uma solicitação.</p>`}
        </div>
        <div class="modal-footer">
          <a href="solicitacoes.html" class="btn-ghost" style="width:auto">${ICONS.messageSquare}<span>Tenho uma dúvida</span></a>
          <button type="button" class="btn-primary auto" data-fechar>Fechar</button>
        </div>`;
      overlay.querySelectorAll("[data-fechar]").forEach((b) => b.addEventListener("click", () => overlay.classList.remove("open")));
      requestAnimationFrame(() => overlay.classList.add("open"));
    }

    if (session) {
      renderShell(session, NAV_COLABORADOR);
      renderTopHeader(document.getElementById("top-header"), session, { notifications: [] });
      try {
        const meusBeneficios = await rhCarregarBeneficiosColaborador();
        let minhasConcessoes = [];
        if (session.employeeId) {
          try { minhasConcessoes = await rhListarConcessoes(session.employeeId); } catch (e) { minhasConcessoes = []; }
        }
        itens = montarItens(meusBeneficios, minhasConcessoes);
        render();
      } catch (err) {
        rhShowFatalError(rhMensagemErroSupabase(err));
      }
    }

})();
</script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
